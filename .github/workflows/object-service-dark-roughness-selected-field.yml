name: Object service-dark selected roughness field evidence

on:
  push:
    branches: [studio/materials-object-functional-surface-001]
    paths:
      - "lookdev/service_dark_roughness_selected_field_001.json"
      - "lookdev-proof/service_dark_roughness_selected_field_observe.gd"
      - "tools/verify_service_dark_roughness_selected_field.py"
      - ".github/workflows/object-service-dark-roughness-selected-field.yml"
      - "lookdev/service_dark_roughness_microvariation_review_001.json"
      - "lookdev-proof/service_dark_roughness_microvariation_observe.gd"
      - "tools/verify_service_dark_roughness_microvariation.py"
  pull_request:
    paths:
      - "lookdev/service_dark_roughness_selected_field_001.json"
      - "lookdev-proof/service_dark_roughness_selected_field_observe.gd"
      - "tools/verify_service_dark_roughness_selected_field.py"
      - ".github/workflows/object-service-dark-roughness-selected-field.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-service-dark-selected-roughness-field:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact Materials head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact selected-field parent evidence
        env:
          ROUGHNESS_HEAD: 83f8d8fc99f7c832711f7f30fbcac72938550fc2
          ROUGHNESS_CONTRACT_BLOB: a4b7ff0e454a62e20ac5c3ed14f9af01092b2c56
          ROUGHNESS_OBSERVER_BLOB: 4549a086f2f61f42f852daf6337c9d444980432c
        run: |
          set -euo pipefail
          mkdir -p lookdev-proof/generated
          git rev-parse HEAD > lookdev-proof/generated/service-dark-selected-roughness-exact-head.txt
          test "$(cat lookdev-proof/generated/service-dark-selected-roughness-exact-head.txt)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$ROUGHNESS_HEAD" HEAD
          test "$(git rev-parse "$ROUGHNESS_HEAD:lookdev/service_dark_roughness_microvariation_review_001.json")" = "$ROUGHNESS_CONTRACT_BLOB"
          test "$(git rev-parse "$ROUGHNESS_HEAD:lookdev-proof/service_dark_roughness_microvariation_observe.gd")" = "$ROUGHNESS_OBSERVER_BLOB"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and run complete Object suite
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Rebuild exact base material payload
        run: python tools/build_object_material_lookdev_evidence.py

      - name: Materialize exact Animation, Rigging and latch-ownership donors
        env:
          ANIMATION_COMMIT: 12a350fc38f67348f342cd0e53ed6b16383b789d
          RIG_COMMIT: 4b72c9918c5fc1e89bd18a0be24fb4afac6e7775
          LATCH_OWNERSHIP_COMMIT: d3fa10a270faae7925811f44f03381fe5c5d0215
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            studio/animation-object-lid-open-close-001 \
            studio/rigging-object-lid-articulation-001 \
            studio/hard-surface-front-latch-ownership-001
          git cat-file -e "$ANIMATION_COMMIT^{commit}"
          git cat-file -e "$RIG_COMMIT^{commit}"
          git cat-file -e "$LATCH_OWNERSHIP_COMMIT^{commit}"
          git show "$ANIMATION_COMMIT:assets/modular-equipment-case-001/lid-motion-clip.json" > lookdev-proof/generated/lid-motion-clip.json
          git show "$RIG_COMMIT:assets/modular-equipment-case-001/articulation.json" > lookdev-proof/generated/articulation.json
          git show "$LATCH_OWNERSHIP_COMMIT:assets/modular-equipment-case-001/front-latch-ownership-001.json" > lookdev-proof/generated/front-latch-ownership-001.json

      - name: Rebuild exact owner-bound articulation payload
        run: python tools/build_object_material_articulation_evidence.py

      - name: Materialize exact source-owned inner-lid surface identity
        env:
          SOURCE_SURFACE_COMMIT: e67353416209604aa50ad3ba57f71336f4384349
          SOURCE_SURFACE_PATH: assets/modular-equipment-case-001/lid-inner-surface-identity-001.json
          SOURCE_SURFACE_BLOB: 873c03a73042213255c65df63cdff49edcf10a6c
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_SURFACE_COMMIT" --depth=1
          observed_blob="$(git rev-parse "$SOURCE_SURFACE_COMMIT:$SOURCE_SURFACE_PATH")"
          test "$observed_blob" = "$SOURCE_SURFACE_BLOB"
          git show "$SOURCE_SURFACE_COMMIT:$SOURCE_SURFACE_PATH" > lookdev-proof/generated/lid-inner-surface-identity-001.json

      - name: Rebuild exact Materials roughness chain and selected-field payload
        run: |
          python tools/build_object_inner_lid_material_evidence.py \
            --source-surface-identity lookdev-proof/generated/lid-inner-surface-identity-001.json
          python tools/build_object_service_dark_uv_density_family_evidence.py \
            --exact-head "$(git rev-parse HEAD)"
          python tools/build_object_service_dark_atlas_pack_evidence.py \
            --exact-head "$(git rev-parse HEAD)"
          python tools/verify_service_dark_roughness_microvariation.py
          python tools/verify_service_dark_roughness_selected_field.py

      - name: Download pinned Godot 4.7.2
        if: matrix.python-version == '3.11'
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        if: matrix.python-version == '3.11'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Render in-memory versus serialized selected roughness field
        if: matrix.python-version == '3.11'
        run: |
          set -euo pipefail
          rm -f \
            lookdev-proof/service-dark-roughness-selected-field-runtime-receipt.json \
            lookdev-proof/service-dark-roughness-selected-field.png \
            lookdev-proof/service-dark-roughness-selected-*-in-memory.png \
            lookdev-proof/service-dark-roughness-selected-*-serialized.png
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path lookdev-proof \
            --script service_dark_roughness_selected_field_observe.gd

      - name: Validate exact selected-field serialization continuity
        if: matrix.python-version == '3.11'
        run: |
          python tools/verify_service_dark_roughness_selected_field.py \
            --runtime-receipt lookdev-proof/service-dark-roughness-selected-field-runtime-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("lookdev-proof/service-dark-roughness-selected-field-runtime-receipt.json").read_text())
          assert r["state"] == "PASS", r
          assert r["base_level_scalar_identity"] is True, r
          assert r["render_pixel_identity_all_contexts"] is True, r
          assert len(r["comparisons"]) == 2, r
          for pose, contexts in r["comparisons"].items():
              assert len(contexts) == 2, (pose, contexts)
              for context, diff in contexts.items():
                  assert diff["changed_pixels_raw"] == 0, (pose, context, diff)
                  assert diff["changed_pixels_gt_1lsb"] == 0, (pose, context, diff)
          print(json.dumps(r, indent=2))
          PY

      - name: Negative control rejects serialized scalar digest drift
        if: matrix.python-version == '3.11'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("lookdev-proof/service-dark-roughness-selected-field-runtime-receipt.json")
          data=json.loads(src.read_text())
          data["serialized_scalar_r8_sha256"]="0"*64
          Path("/tmp/bad-selected-field-receipt.json").write_text(json.dumps(data))
          PY
          set +e
          output="$(python tools/verify_service_dark_roughness_selected_field.py \
            --runtime-receipt /tmp/bad-selected-field-receipt.json 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q "serialized scalar field digest drift"
          printf '%s\n' "serialized scalar digest negative rejected as expected"

      - name: Retain exact selected roughness field evidence
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: object-service-dark-selected-roughness-field-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lookdev/service_dark_roughness_selected_field_001.json
            tools/verify_service_dark_roughness_selected_field.py
            lookdev-proof/service_dark_roughness_selected_field_observe.gd
            lookdev-proof/generated/service-dark-selected-roughness-exact-head.txt
            lookdev-proof/generated/object_service_dark_roughness_microvariation_payload.json
            lookdev-proof/generated/object_service_dark_roughness_selected_field_payload.json
            lookdev-proof/service-dark-roughness-selected-field-runtime-receipt.json
            lookdev-proof/service-dark-roughness-selected-field.png
            lookdev-proof/service-dark-roughness-selected-*-in-memory.png
            lookdev-proof/service-dark-roughness-selected-*-serialized.png
          if-no-files-found: warn
          retention-days: 30
