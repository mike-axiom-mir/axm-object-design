name: Object service-module configuration family evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  procedural:
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall tools tests
      - name: Test full repository suite
        run: python -m unittest discover -s tests -v
      - name: Checkout exact shared rigid-frame donor
        if: matrix.python-version == '3.11'
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: bd51542bc68534a6e6f3a11d421dc70216b2abf9
          path: _donor/axm-universal-creation
      - name: Checkout exact Sticker Fabric shared home
        if: matrix.python-version == '3.11'
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-sticker-fabric
          ref: 3aa93b0132eea9becefb20c716c6ec1a023ad28b
          path: _donor/axm-sticker-fabric
      - name: Build exact configuration-family evidence
        if: matrix.python-version == '3.11'
        run: |
          python tools/build_service_module_configuration_family.py \
            --host assets/modular-equipment-case-001/source.json \
            --module assets/modular-equipment-case-001/utility-module-001.json \
            --registration assets/modular-equipment-case-001/utility-module-registration-key-001.json \
            --profile assets/modular-equipment-case-001/service-module-configuration-family-001.json \
            --out evidence/service-module-configuration-family
          cp assets/modular-equipment-case-001/source.json evidence/service-module-configuration-family/host-source.json
          cp assets/modular-equipment-case-001/utility-module-001.json evidence/service-module-configuration-family/module-source.json
          cp assets/modular-equipment-case-001/utility-module-registration-key-001.json evidence/service-module-configuration-family/registration-source.json
          cp assets/modular-equipment-case-001/service-module-configuration-family-001.json evidence/service-module-configuration-family/family-profile.json
          git rev-parse HEAD > evidence/service-module-configuration-family/exact-head.txt
      - name: Verify exact historical UC shared rigid-frame equivalence
        if: matrix.python-version == '3.11'
        run: |
          python tools/verify_service_module_shared_frame_equivalence.py \
            --uc-root _donor/axm-universal-creation \
            --output-dir evidence/service-module-configuration-family/shared-frame-equivalence
          git -C _donor/axm-universal-creation rev-parse HEAD > evidence/service-module-configuration-family/shared-frame-equivalence/shared-donor-head.txt
          sha256sum _donor/axm-universal-creation/src/axm_stickers/placement.py > evidence/service-module-configuration-family/shared-frame-equivalence/shared-donor-module.sha256
      - name: Verify exact Sticker Fabric successor rebind
        if: matrix.python-version == '3.11'
        run: |
          python tools/verify_service_module_sticker_fabric_rebind.py \
            --sticker-root _donor/axm-sticker-fabric \
            --output-dir evidence/service-module-configuration-family/sticker-fabric-rebind
          git -C _donor/axm-sticker-fabric rev-parse HEAD > evidence/service-module-configuration-family/sticker-fabric-rebind/shared-home-head.txt
          sha256sum _donor/axm-sticker-fabric/src/axm_stickers/placement.py > evidence/service-module-configuration-family/sticker-fabric-rebind/shared-home-module.sha256
          cp _donor/axm-sticker-fabric/UPSTREAM.json evidence/service-module-configuration-family/sticker-fabric-rebind/sticker-fabric-upstream.json
      - name: Upload retained evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: utility-module-configuration-family-001-evidence
          path: evidence/service-module-configuration-family
          if-no-files-found: error
          retention-days: 30
