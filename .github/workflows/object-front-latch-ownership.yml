name: Object front-latch ownership evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  structural:
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall tools tests
      - name: Test full repository suite
        run: python -m unittest discover -s tests -v
      - name: Build exact front-latch ownership evidence
        if: matrix.python-version == '3.11'
        run: |
          python tools/verify_front_latch_ownership.py \
            --host assets/modular-equipment-case-001/source.json \
            --contract assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --out evidence/front-latch-ownership
          cp assets/modular-equipment-case-001/source.json evidence/front-latch-ownership/host-source.json
          cp assets/modular-equipment-case-001/front-latch-ownership-001.json evidence/front-latch-ownership/latch-contract.json
          git rev-parse HEAD > evidence/front-latch-ownership/exact-head.txt
      - name: Upload retained evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: modular-equipment-case-001-front-latch-ownership-evidence
          path: evidence/front-latch-ownership
          if-no-files-found: error
          retention-days: 30
