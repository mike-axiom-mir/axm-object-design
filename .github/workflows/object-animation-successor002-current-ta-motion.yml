name: Object Animation successor002 current-TA motion

on:
  pull_request:
    paths:
      - 'animation-proof/observe_successor002_current_ta_motion.gd'
      - '.github/workflows/object-animation-successor002-current-ta-motion.yml'
      - 'assets/modular-equipment-case-001/hinge-phase-invariant-successor-motion-rebind-002.json'
      - 'assets/modular-equipment-case-001/lid-motion-clip.json'
      - 'assets/modular-equipment-case-001/lid-latch-motion-sequence-001.json'
      - 'tools/verify_animation_hinge_phase_invariant_successor_motion_rebind.py'
      - 'tools/build_lid_motion_evidence.py'
      - 'tools/build_lid_latch_motion_evidence.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TA_HEAD: f430d00d98e694dcf8302fd4df3c64a074f6f30e
  TA_ARTIFACT_ID: '10531541834'
  TA_ARTIFACT_SHA256: 5e1134d0ebdf786d04ae789a841493ce9cf684f16aedd7dbad597f2e02b3ad5e
  SOURCE_SUCCESSOR_HEAD: a6d18b9fe729304dc4d95d962ed27527adce211f
  SOURCE_SUCCESSOR_BLOB: 7e078189d5c80508b28932563326cd5629c4efa6
  RIGGING_RECEIVER_HEAD: cf377074f70ce7f7e386f1378c51705b3db4d305
  RIGGING_RECEIVER_BLOB: 813a4e97973a023b6a1027582a03e2fb437103ea
  LID_RIG_HEAD: 4b72c9918c5fc1e89bd18a0be24fb4afac6e7775
  LATCH_RIG_HEAD: 3b667ff5d30c46ec2fe7da7679518970f8610018
  LATCH_OWNERSHIP_HEAD: d3fa10a270faae7925811f44f03381fe5c5d0215
  LATCH_RIG_PLAN_SHA256: 81c27ab7b73ed9a43cb3f554b56c3f4294b893712075e33d13f5b02e008455db
  LATCH_OWNERSHIP_SHA256: 0702e4180f858d29c42ff8c38a61eaa16278d6848c8ce6f3ecfae172969ca8ae
  TESTED_UC_HEAD: 9609998db6677391766e9ee7ff53a5b9b08a3cb9

jobs:
  current-ta-successor002-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Animation PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact Animation head
        run: echo "EXACT_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout exact Animation source owners
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.SOURCE_SUCCESSOR_HEAD }}
          path: .source-successor
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.RIGGING_RECEIVER_HEAD }}
          path: .rigging-receiver
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.LID_RIG_HEAD }}
          path: .lid-rig
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.LATCH_RIG_HEAD }}
          path: .latch-rig
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.LATCH_OWNERSHIP_HEAD }}
          path: .latch-ownership
          fetch-depth: 1

      - name: Verify exact owner identities and inherited Object suite
        run: |
          set -euo pipefail
          test "$(git -C .source-successor rev-parse HEAD)" = "$SOURCE_SUCCESSOR_HEAD"
          test "$(git -C .rigging-receiver rev-parse HEAD)" = "$RIGGING_RECEIVER_HEAD"
          test "$(git -C .lid-rig rev-parse HEAD)" = "$LID_RIG_HEAD"
          test "$(git -C .latch-rig rev-parse HEAD)" = "$LATCH_RIG_HEAD"
          test "$(git -C .latch-ownership rev-parse HEAD)" = "$LATCH_OWNERSHIP_HEAD"
          test "$(git -C .source-successor rev-parse "${SOURCE_SUCCESSOR_HEAD}:assets/modular-equipment-case-001/hinge-bored-knuckle-phase-invariant-source-successor-002.json")" = "$SOURCE_SUCCESSOR_BLOB"
          test "$(git -C .rigging-receiver rev-parse "${RIGGING_RECEIVER_HEAD}:assets/modular-equipment-case-001/hinge-phase-invariant-bored-knuckle-rig-compatibility-002.json")" = "$RIGGING_RECEIVER_BLOB"
          echo "$LATCH_OWNERSHIP_SHA256  .latch-ownership/assets/modular-equipment-case-001/front-latch-ownership-001.json" | sha256sum -c -
          echo "$LATCH_RIG_PLAN_SHA256  .latch-rig/assets/modular-equipment-case-001/front-latch-articulation-001.json" | sha256sum -c -
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Rebuild unchanged 101-key Animation sequence
        run: |
          set -euo pipefail
          rm -rf /tmp/axm-current-ta-lid /tmp/axm-current-ta-latch-rig /tmp/axm-current-ta-sequence
          python tools/build_lid_motion_evidence.py \
            --source assets/modular-equipment-case-001/source.json \
            --rig .lid-rig/assets/modular-equipment-case-001/articulation.json \
            --clip assets/modular-equipment-case-001/lid-motion-clip.json \
            --out /tmp/axm-current-ta-lid \
            --exact-head "$EXACT_HEAD_SHA"
          PYTHONPATH="$PWD/tools" python .latch-rig/tools/verify_front_latch_articulation.py \
            --host assets/modular-equipment-case-001/source.json \
            --ownership .latch-ownership/assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --plan .latch-rig/assets/modular-equipment-case-001/front-latch-articulation-001.json \
            --out /tmp/axm-current-ta-latch-rig
          python tools/build_lid_latch_motion_evidence.py \
            --source assets/modular-equipment-case-001/source.json \
            --sequence assets/modular-equipment-case-001/lid-latch-motion-sequence-001.json \
            --motion-evidence /tmp/axm-current-ta-lid/lid-motion-evidence.json \
            --ownership .latch-ownership/assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --rig-receipt /tmp/axm-current-ta-latch-rig/front-latch-articulation.receipt.json \
            --rig-head "$LATCH_RIG_HEAD" \
            --rig-plan-sha256 "$LATCH_RIG_PLAN_SHA256" \
            --out /tmp/axm-current-ta-sequence \
            --exact-head "$EXACT_HEAD_SHA"
          grep -q 'PASS_ORDERED_LATCH_RELEASE_LID_CLIP_REENGAGE_SEQUENCE' /tmp/axm-current-ta-sequence/lid-latch-motion-evidence.json
          grep -q '"sequence_digest": "0a3523cf792264f610881552fd2ebd438aabdfd05e30e92af9dbb33ded1fa2d3"' /tmp/axm-current-ta-sequence/lid-latch-motion-evidence.json
          grep -q '"endpoint_inclusive_sample_count": 101' /tmp/axm-current-ta-sequence/lid-latch-motion-evidence.json

      - name: Build exact successor-bound Animation input
        run: |
          set -euo pipefail
          rm -rf animation-proof/generated/hinge-phase-invariant-successor-motion
          PYTHONPATH="$PWD/tools" python tools/verify_animation_hinge_phase_invariant_successor_motion_rebind.py \
            --contract assets/modular-equipment-case-001/hinge-phase-invariant-successor-motion-rebind-002.json \
            --source assets/modular-equipment-case-001/source.json \
            --sequence-evidence /tmp/axm-current-ta-sequence/lid-latch-motion-evidence.json \
            --source-successor .source-successor/assets/modular-equipment-case-001/hinge-bored-knuckle-phase-invariant-source-successor-002.json \
            --rigging-compatibility .rigging-receiver/assets/modular-equipment-case-001/hinge-phase-invariant-bored-knuckle-rig-compatibility-002.json \
            --lid-plan .lid-rig/assets/modular-equipment-case-001/articulation.json \
            --exact-head "$EXACT_HEAD_SHA" \
            --observed-successor-head "$SOURCE_SUCCESSOR_HEAD" \
            --observed-successor-blob "$SOURCE_SUCCESSOR_BLOB" \
            --observed-rigging-head "$RIGGING_RECEIVER_HEAD" \
            --observed-rigging-blob "$RIGGING_RECEIVER_BLOB" \
            --out animation-proof/generated/hinge-phase-invariant-successor-motion
          cp /tmp/axm-current-ta-sequence/lid-latch-motion-evidence.json animation-proof/generated/hinge-phase-invariant-successor-motion/sequence-evidence.json
          grep -q 'PASS_OBJECT_ANIMATION_PHASE_INVARIANT_HINGE_SUCCESSOR_REBIND_INPUT' animation-proof/generated/hinge-phase-invariant-successor-motion/structural-receipt.json

      - name: Download and bind exact current Technical Art successor receiver artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/axm-ta-artifact animation-proof/generated/current-ta-successor002
          mkdir -p /tmp/axm-ta-artifact animation-proof/generated/current-ta-successor002
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TA_ARTIFACT_ID}/zip" \
            -o /tmp/ta-successor002.zip
          echo "$TA_ARTIFACT_SHA256  /tmp/ta-successor002.zip" | sha256sum --check --strict
          unzip -q /tmp/ta-successor002.zip -d /tmp/axm-ta-artifact
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root=pathlib.Path('/tmp/axm-ta-artifact')
          out=pathlib.Path('animation-proof/generated/current-ta-successor002')
          names={
              'glb':'object-rigid-components-hinge-successor002-rebound.glb',
              'source_receipt':'object-hinge-successor002-ta-transport-rebind-receipt.json',
              'target_receipt':'hinge-successor002-target-transport-receipt.json',
              'ta_head':'exact-technical-art-head.txt',
          }
          found={}
          for key,name in names.items():
              matches=list(root.rglob(name))
              if len(matches)!=1:
                  raise SystemExit(f'expected exactly one {name}, got {matches}')
              found[key]=matches[0]
              shutil.copy2(matches[0],out/name)
          if found['ta_head'].read_text().strip()!=os.environ['TA_HEAD']:
              raise SystemExit('Technical Art exact-head artifact binding drift')
          ta=json.loads(found['source_receipt'].read_text())
          target=json.loads(found['target_receipt'].read_text())
          if ta.get('result')!='PASS_OBJECT_HINGE_SUCCESSOR002_TA_SCENE_REBIND_TO_CURRENT_UC__HOLD_DEFAULT_RUNTIME_VISUAL':
              raise SystemExit('Technical Art successor receiver receipt not green')
          if target.get('result')!='PASS_OBJECT_HINGE_SUCCESSOR002_CURRENT_UC_GODOT_TRIANGLE_TRANSPORT':
              raise SystemExit('Technical Art Godot transport receipt not green')
          expected={
              'technical_art_head':os.environ['TA_HEAD'],
              'hard_surface_head':os.environ['SOURCE_SUCCESSOR_HEAD'],
              'rigging_head':os.environ['RIGGING_RECEIVER_HEAD'],
              'uc_head':os.environ['TESTED_UC_HEAD'],
          }
          for key,value in expected.items():
              if ta.get(key)!=value:
                  raise SystemExit(f'Technical Art {key} drift: {ta.get(key)} != {value}')
          glb=found['glb'].read_bytes()
          digest=hashlib.sha256(glb).hexdigest()
          if digest!=ta.get('successor_rebound_glb_sha256'):
              raise SystemExit('successor rebound GLB digest drift')
          binding={
              'schema':'axm.object-animation-current-ta-successor002-binding/v0.1',
              'animation_head':os.environ['EXACT_HEAD_SHA'],
              'technical_art_head':os.environ['TA_HEAD'],
              'technical_art_artifact_id':int(os.environ['TA_ARTIFACT_ID']),
              'technical_art_artifact_sha256':os.environ['TA_ARTIFACT_SHA256'],
              'hard_surface_head':os.environ['SOURCE_SUCCESSOR_HEAD'],
              'rigging_head':os.environ['RIGGING_RECEIVER_HEAD'],
              'uc_head':os.environ['TESTED_UC_HEAD'],
              'successor_rebound_glb_sha256':digest,
              'runtime_controller_or_gameplay_authority':False,
              'source_successor_default_adopted':False,
          }
          (out/'animation-current-ta-binding.json').write_text(json.dumps(binding,indent=2,sort_keys=True)+'\n')
          print(json.dumps(binding,indent=2))
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" -o .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Prove wrong imported parentage fails closed under motion
        run: |
          set -euo pipefail
          rm -f animation-proof/successor002-current-ta-animationplayer-receipt.json
          code=0
          (
            cd animation-proof
            AXM_MUTATE_BODY_PARENT=hinge_body_b1 ../.godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
              --headless --path . --script observe_successor002_current_ta_motion.gd
          ) > /tmp/current-ta-negative.log 2>&1 || code=$?
          test "$code" -ne 0
          grep -q 'CURRENT_TA_MOTION_MISMATCH' /tmp/current-ta-negative.log
          cp /tmp/current-ta-negative.log animation-proof/successor002-current-ta-negative.log

      - name: Exercise exact frozen motion on current TA successor receiver
        run: |
          set -euo pipefail
          rm -f animation-proof/successor002-current-ta-animationplayer-receipt.json
          (
            cd animation-proof
            ../.godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
              --headless --path . --script observe_successor002_current_ta_motion.gd
          ) | tee /tmp/current-ta-positive.log
          cp /tmp/current-ta-positive.log animation-proof/successor002-current-ta-positive.log
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('animation-proof/successor002-current-ta-animationplayer-receipt.json')
          r=json.loads(p.read_text())
          assert r['result']=='PASS_OBJECT_ANIMATION_SUCCESSOR002_CURRENT_TA_ANIMATIONPLAYER_MOTION',r
          assert r['exact_animation_head']==os.environ['EXACT_HEAD_SHA'],r
          assert r['technical_art_head']==os.environ['TA_HEAD'],r
          assert r['hard_surface_successor_head']==os.environ['SOURCE_SUCCESSOR_HEAD'],r
          assert r['rigging_head']==os.environ['RIGGING_RECEIVER_HEAD'],r
          assert r['uc_head']==os.environ['TESTED_UC_HEAD'],r
          assert r['endpoint_inclusive_sample_count']==101,r
          assert r['animationplayer_key_count']==101,r
          assert r['sampled_max_lid_angle_error_deg']<=1e-5,r
          assert r['sampled_max_body_knuckle_world_vertex_drift_m']<=1e-6,r
          assert r['sampled_max_lid_knuckle_world_vertex_move_m']>=0.0001,r
          assert r['sampled_endpoint_world_vertex_closure_m']<=1e-6,r
          assert r['wall_clock_playback_completed'] is True,r
          assert r['wall_clock_peak_lid_deg']>=99.9,r
          assert r['wall_clock_max_body_knuckle_world_vertex_drift_m']<=1e-6,r
          assert r['wall_clock_max_lid_knuckle_world_vertex_move_m']>=0.0001,r
          assert r['wall_clock_endpoint_world_vertex_closure_m']<=1e-6,r
          assert r['truth_boundary']['runtime_controller_or_state_machine_accepted'] is False,r
          assert r['truth_boundary']['input_or_gameplay_accepted'] is False,r
          print(json.dumps(r,indent=2))
          PY

      - name: Retain exact current-TA Animation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-animation-successor002-current-ta-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            animation-proof/observe_successor002_current_ta_motion.gd
            animation-proof/generated/hinge-phase-invariant-successor-motion/godot-input.json
            animation-proof/generated/hinge-phase-invariant-successor-motion/structural-receipt.json
            animation-proof/generated/hinge-phase-invariant-successor-motion/sequence-evidence.json
            animation-proof/generated/current-ta-successor002/animation-current-ta-binding.json
            animation-proof/generated/current-ta-successor002/exact-technical-art-head.txt
            animation-proof/generated/current-ta-successor002/object-hinge-successor002-ta-transport-rebind-receipt.json
            animation-proof/generated/current-ta-successor002/hinge-successor002-target-transport-receipt.json
            animation-proof/generated/current-ta-successor002/object-rigid-components-hinge-successor002-rebound.glb
            animation-proof/successor002-current-ta-animationplayer-receipt.json
            animation-proof/successor002-current-ta-negative.log
            animation-proof/successor002-current-ta-positive.log
          if-no-files-found: warn
          retention-days: 30
