name: Object service-module fit evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  structural:
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact owner head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall tools tests
      - name: Test full repository suite
        run: python -m unittest discover -s tests -v
      - name: Build exact service-module fit and standoff-reference evidence
        if: matrix.python-version == '3.11'
        run: |
          python tools/verify_service_module_fit.py \
            --host assets/modular-equipment-case-001/source.json \
            --module assets/modular-equipment-case-001/utility-module-001.json \
            --out evidence/service-module-fit
          python tools/verify_service_module_standoff_reference.py \
            --host assets/modular-equipment-case-001/source.json \
            --module assets/modular-equipment-case-001/utility-module-001.json \
            --policy assets/modular-equipment-case-001/utility-module-001-standoff-reference.json \
            --out evidence/service-module-fit
          cp assets/modular-equipment-case-001/source.json evidence/service-module-fit/host-source.json
          cp assets/modular-equipment-case-001/utility-module-001.json evidence/service-module-fit/module-source.json
          cp assets/modular-equipment-case-001/utility-module-001-standoff-reference.json evidence/service-module-fit/standoff-reference-policy.json
          git rev-parse HEAD > evidence/service-module-fit/exact-owner-head.txt
          printf '%s\n' "${{ github.sha }}" > evidence/service-module-fit/github-event-sha.txt
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('evidence/service-module-fit/standoff-reference-receipt.json').read_text())
          assert receipt['result']=='PASS_SOURCE_OWNED_SERVICE_MODULE_STANDOFF_REFERENCE_FEATURE'
          assert receipt['reference_feature']=='module_nearest_host_facing_body_face'
          assert receipt['authority']['source_geometry_changed'] is False
          assert receipt['authority']['module_source_changed'] is False
          assert receipt['authority']['host_source_changed'] is False
          assert receipt['authority']['downstream_rebind_authorized'] is False
          assert receipt['counterfactual_body_center_interpretation']['authorized'] is False
          PY
      - name: Upload retained evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: utility-module-001-fit-evidence
          path: evidence/service-module-fit
          if-no-files-found: error
          retention-days: 30
