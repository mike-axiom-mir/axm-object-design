name: Object lid sampled Runtime resource evidence

on:
  push:
    branches: [studio/runtime-object-lid-sampled-playback-reuse-001]
    paths:
      - "runtime/**"
      - "runtime-proof/**"
      - "tools/verify_object_lid_runtime.py"
      - "tests/test_object_lid_runtime.py"
      - ".github/workflows/object-lid-runtime-reuse.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "runtime-proof/**"
      - "tools/verify_object_lid_runtime.py"
      - "tests/test_object_lid_runtime.py"
      - ".github/workflows/object-lid-runtime-reuse.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MATERIALS_BASE_HEAD: c8b775d85f6007eab8d05fdb5e2ddc3e4ab871d4
  ANIMATION_HEAD: 12a350fc38f67348f342cd0e53ed6b16383b789d
  RIG_HEAD: 4b72c9918c5fc1e89bd18a0be24fb4afac6e7775

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python and run complete Object tests
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

  exact-lid-runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Runtime head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind exact Runtime head and receiving ancestry
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          git cat-file -e "$MATERIALS_BASE_HEAD^{commit}"
          git merge-base --is-ancestor "$MATERIALS_BASE_HEAD" HEAD || {
            echo "Runtime proof must remain stacked on exact Materials receiving head $MATERIALS_BASE_HEAD." >&2
            exit 1
          }

      - name: Materialize exact current Animation clip, evidence builder, and Rig donor
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            studio/animation-object-lid-open-close-001 \
            studio/rigging-object-lid-articulation-001
          git cat-file -e "$ANIMATION_HEAD^{commit}"
          git cat-file -e "$RIG_HEAD^{commit}"
          mkdir -p lookdev-proof/generated runtime-proof/generated /tmp/axm-animation-runtime
          git show "$ANIMATION_HEAD:assets/modular-equipment-case-001/lid-motion-clip.json" > lookdev-proof/generated/lid-motion-clip.json
          git show "$ANIMATION_HEAD:tools/build_lid_motion_evidence.py" > /tmp/axm-animation-runtime/build_lid_motion_evidence.py
          git show "$RIG_HEAD:assets/modular-equipment-case-001/articulation.json" > lookdev-proof/generated/articulation.json
          printf '%s\n' "$ANIMATION_HEAD" > runtime-proof/generated/animation-donor-head.txt
          printf '%s\n' "$RIG_HEAD" > runtime-proof/generated/rig-donor-head.txt

      - name: Rebuild exact current Animation motion evidence
        run: |
          set -euo pipefail
          python /tmp/axm-animation-runtime/build_lid_motion_evidence.py \
            --source assets/modular-equipment-case-001/source.json \
            --rig lookdev-proof/generated/articulation.json \
            --clip lookdev-proof/generated/lid-motion-clip.json \
            --out /tmp/axm-animation-runtime/evidence \
            --exact-head "$ANIMATION_HEAD"
          cp /tmp/axm-animation-runtime/evidence/lid-motion-evidence.json runtime-proof/generated/lid-motion-evidence.json

      - name: Rebuild exact articulated receiving representation
        run: |
          set -euo pipefail
          python tools/build_object_material_articulation_evidence.py
          cp lookdev-proof/generated/object_material_articulation_payload.json runtime-proof/generated/object_material_articulation_payload.json
          cp runtime/object_lid_runtime_contract_001.json runtime-proof/generated/runtime_contract.json

      - name: Verify exact Runtime input identities
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('runtime-proof/generated')
          c=json.loads((root/'runtime_contract.json').read_text())
          m=json.loads((root/'lid-motion-evidence.json').read_text())
          p=json.loads((root/'object_material_articulation_payload.json').read_text())
          assert c['materials_receiving_base']['commit']==os.environ['MATERIALS_BASE_HEAD'],c
          assert c['animation_dependency']['commit']==os.environ['ANIMATION_HEAD'],c
          assert c['rig_dependency']['commit']==os.environ['RIG_HEAD'],c
          assert m['result']=='PASS_BOUNDED_LID_MOTION_CLIP',m
          assert m['exact_receiving_head']==os.environ['ANIMATION_HEAD'],m
          assert m['endpoint_inclusive_sample_count']==81,m
          assert m['repeated_visible_sample_count']==80,m
          assert p['animation_clip_digest']==m['clip_digest'],(p,m)
          assert p['observed_rig_plan_digest']==m['observed_rig_plan_digest'],(p,m)
          assert p['hinge_origin_m']==m['hinge_origin_m'],(p,m)
          assert c['required_display_sample_count']==80,c
          assert c['truth_boundary']['materials_receiving_representation_not_exact_uc_glb'] is True,c
          print(json.dumps({
            'animation_head':m['exact_receiving_head'],
            'clip_digest':m['clip_digest'],
            'rig_plan_digest':m['observed_rig_plan_digest'],
            'display_samples':m['repeated_visible_sample_count']
          },indent=2))
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Run synthetic moving-resource rebuild control
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path runtime-proof \
            --script lid_motion_budget_observe.gd -- rebuild_moving_parts_control

      - name: Run stable moving-resource transform candidate
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path runtime-proof \
            --script lid_motion_budget_observe.gd -- reuse_moving_parts_transform

      - name: Compare exact before and after evidence
        run: |
          set -euo pipefail
          out=evidence/object_lid_runtime_001
          mkdir -p "$out/rendered"
          cp runtime-proof/object-lid-runtime-rebuild_moving_parts_control.json "$out/control.json"
          cp runtime-proof/object-lid-runtime-reuse_moving_parts_transform.json "$out/candidate.json"
          cp runtime-proof/lid-runtime-*.png "$out/rendered/"
          cp runtime-proof/generated/lid-motion-evidence.json "$out/"
          cp runtime-proof/generated/object_material_articulation_payload.json "$out/"
          cp runtime-proof/generated/runtime_contract.json "$out/"
          cp runtime-proof/generated/animation-donor-head.txt "$out/"
          cp runtime-proof/generated/rig-donor-head.txt "$out/"
          python tools/verify_object_lid_runtime.py \
            --control "$out/control.json" \
            --candidate "$out/candidate.json" \
            --contract runtime/object_lid_runtime_contract_001.json \
            --runtime-head "$(cat exact-head.txt)" \
            --output "$out/comparison.json"
          cp exact-head.txt "$out/"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('evidence/object_lid_runtime_001/comparison.json').read_text())
          assert data['state']=='PASS_REUSE_RIGID_LID_TARGET_HOST_RESOURCES',data
          assert all(data['checks'].values()),data
          assert data['visual_tradeoff_for_art_director']=='NONE_OBSERVED_IN_EXACT_RETAINED_PROOF_FRAMES',data
          assert data['measurements']['moving_node_constructions']['candidate'] < data['measurements']['moving_node_constructions']['control'],data
          print(json.dumps({
            'state':data['state'],
            'workload':data['workload'],
            'measurements':data['measurements'],
            'visual_tradeoff_for_art_director':data['visual_tradeoff_for_art_director']
          },indent=2))
          PY

      - name: Upload exact Object lid Runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-lid-runtime-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/object_lid_runtime_001
          if-no-files-found: warn
          retention-days: 30
