name: Object front-latch articulation evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  structural:
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall tools tests
      - name: Test full repository suite
        run: python -m unittest discover -s tests -v
      - name: Build exact front-latch articulation evidence
        if: matrix.python-version == '3.11'
        run: |
          python tools/verify_front_latch_articulation.py \
            --host assets/modular-equipment-case-001/source.json \
            --ownership assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --plan assets/modular-equipment-case-001/front-latch-articulation-001.json \
            --out evidence/front-latch-articulation
          cp assets/modular-equipment-case-001/source.json evidence/front-latch-articulation/host-source.json
          cp assets/modular-equipment-case-001/front-latch-ownership-001.json evidence/front-latch-articulation/ownership-contract.json
          cp assets/modular-equipment-case-001/front-latch-articulation-001.json evidence/front-latch-articulation/articulation-plan.json
          git rev-parse HEAD > evidence/front-latch-articulation/exact-head.txt
          printf '%s\n' d3fa10a270faae7925811f44f03381fe5c5d0215 > evidence/front-latch-articulation/ownership-donor-head.txt
      - name: Upload retained evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: modular-equipment-case-001-front-latch-articulation-evidence
          path: evidence/front-latch-articulation
          if-no-files-found: error
          retention-days: 30
