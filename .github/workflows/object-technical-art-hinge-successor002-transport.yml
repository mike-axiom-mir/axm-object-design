name: Object Technical Art hinge successor002 transport

on:
  pull_request:
    paths:
      - "contracts/object_hinge_successor002_ta_transport_rebind.json"
      - "tools/build_object_hinge_successor002_ta_transport_rebind.py"
      - "tools/verify_object_hinge_successor002_godot_transport.py"
      - "rigid-proof/successor002_observe.gd"
      - ".github/workflows/object-technical-art-hinge-successor002-transport.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  successor002-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PREDECESSOR_TA_HEAD: dad13ce23a0fd8e0ec3e612ac1e72f01c5155284
      HARD_SURFACE_HEAD: a6d18b9fe729304dc4d95d962ed27527adce211f
      GEOMETRY_HEAD: 96abb2830ddabca9ed270b42a9447534d007ce64
      RIGGING_HEAD: cf377074f70ce7f7e386f1378c51705b3db4d305
      CURRENT_UC_HEAD: 9609998db6677391766e9ee7ff53a5b9b08a3cb9
      RIGGING_ARTIFACT_ID: "10527372668"
      RIGGING_ARTIFACT_SHA256: f16d8cab9850b0e8162343e7e92c455741a101e6e4927adc69478fb032c73acc
      RIGGING_RESULT: PASS_PHASE_INVARIANT_BORED_KNUCKLE_SUCCESSOR_RIG_1MM_RADIAL_NONCONTACT_CONTINUOUS_0_TO_110

    steps:
      - name: Checkout exact Technical Art head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bind bounded Technical Art delta and run Object suite
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$PREDECESSOR_TA_HEAD" HEAD
          python - <<'PY'
          import subprocess
          allowed={
            '.github/workflows/object-technical-art-hinge-successor002-transport.yml',
            'contracts/object_hinge_successor002_ta_transport_rebind.json',
            'rigid-proof/successor002_observe.gd',
            'tools/build_object_hinge_successor002_ta_transport_rebind.py',
            'tools/verify_object_hinge_successor002_godot_transport.py',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only','dad13ce23a0fd8e0ec3e612ac1e72f01c5155284','HEAD'],text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'bounded Technical Art delta drift: {sorted(changed)}')
          PY
          python -m json.tool contracts/object_hinge_successor002_ta_transport_rebind.json >/dev/null
          python -m py_compile tools/build_object_hinge_successor002_ta_transport_rebind.py tools/verify_object_hinge_successor002_godot_transport.py
          python -m unittest discover -s tests -v
          mkdir -p rigid-proof/generated rigid-proof/successor002-owner
          git rev-parse HEAD > rigid-proof/successor002-owner/exact-technical-art-head.txt

      - name: Checkout exact source and shared machinery owners
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.HARD_SURFACE_HEAD }}
          path: .hard-surface
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.GEOMETRY_HEAD }}
          path: .geometry
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: ${{ env.CURRENT_UC_HEAD }}
          path: .uc
          fetch-depth: 1

      - name: Rebuild exact Hard Surface successor002 and Geometry topology receipt
        run: |
          set -euo pipefail
          root=rigid-proof/successor002-owner
          test "$(git -C .hard-surface rev-parse HEAD)" = "$HARD_SURFACE_HEAD"
          test "$(git -C .geometry rev-parse HEAD)" = "$GEOMETRY_HEAD"
          test "$(git -C .uc rev-parse HEAD)" = "$CURRENT_UC_HEAD"
          git -C .hard-surface rev-parse HEAD > "$root/exact-hard-surface-head.txt"
          git -C .geometry rev-parse HEAD > "$root/exact-geometry-head.txt"
          git -C .uc rev-parse HEAD > "$root/exact-current-uc-head.txt"

          PYTHONPATH=.hard-surface python .hard-surface/tools/verify_hinge_bored_knuckle_phase_invariant_successor.py \
            --host .hard-surface/assets/modular-equipment-case-001/source.json \
            --bore-contract .hard-surface/assets/modular-equipment-case-001/hinge-pin-bore-clearance-001.json \
            --annular-contract .hard-surface/assets/modular-equipment-case-001/hinge-pin-annular-mesh-001.json \
            --owner-contract .hard-surface/assets/modular-equipment-case-001/hinge-knuckle-owner-stack-001.json \
            --predecessor-successor-contract .hard-surface/assets/modular-equipment-case-001/hinge-bored-knuckle-source-successor-001.json \
            --phase-invariant-successor-contract .hard-surface/assets/modular-equipment-case-001/hinge-bored-knuckle-phase-invariant-source-successor-002.json \
            --out "$root/hard-surface"

          PYTHONPATH=.geometry python .geometry/tools/verify_hinge_phase_invariant_bored_knuckle_topology_rebind.py \
            --host .geometry/assets/modular-equipment-case-001/source.json \
            --annular-contract .geometry/assets/modular-equipment-case-001/hinge-pin-annular-mesh-001.json \
            --successor-contract .geometry/assets/modular-equipment-case-001/hinge-bored-knuckle-phase-invariant-source-successor-002.json \
            --topology-contract .geometry/assets/modular-equipment-case-001/hinge-phase-invariant-bored-knuckle-topology-rebind-002.json \
            --annular-builder .geometry/tools/build_hinge_pin_annular_mesh.py \
            --out "$root/geometry"

          cp .hard-surface/assets/modular-equipment-case-001/hinge-bored-knuckle-phase-invariant-source-successor-002.json "$root/"
          sha256sum "$root/hard-surface/hinge-bored-knuckle-phase-invariant-source-successor.obj" | awk '{print $1}' > "$root/successor-obj-sha256.txt"

      - name: Download and bind exact Rigging successor002 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=rigid-proof/successor002-owner
          mkdir -p "$root/rigging-artifact"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RIGGING_ARTIFACT_ID}/zip" \
            -o "$root/rigging-artifact.zip"
          echo "$RIGGING_ARTIFACT_SHA256  $root/rigging-artifact.zip" | sha256sum --check --strict
          unzip -q "$root/rigging-artifact.zip" -d "$root/rigging-artifact"
          python - <<'PY'
          import json, os, pathlib, shutil
          root=pathlib.Path('rigid-proof/successor002-owner')
          wanted=os.environ['RIGGING_RESULT']
          matches=[]
          for p in root.joinpath('rigging-artifact').rglob('*.json'):
              try: value=json.loads(p.read_text())
              except Exception: continue
              if isinstance(value,dict) and value.get('result')==wanted:
                  matches.append(p)
          if len(matches)!=1:
              raise SystemExit(f'expected one exact Rigging receipt, got {matches}')
          receipt=json.loads(matches[0].read_text())
          if receipt.get('source_successor',{}).get('head') != os.environ['HARD_SURFACE_HEAD']:
              raise SystemExit('Rigging receipt source-successor head drift')
          shutil.copy2(matches[0], root/'rigging-successor002-receipt.json')
          (root/'exact-rigging-head.txt').write_text(os.environ['RIGGING_HEAD']+'\n')
          PY

      - name: Rebuild predecessor Technical Art scene on current UC and apply only successor hinge geometry
        run: |
          set -euo pipefail
          root=rigid-proof/successor002-owner
          out=rigid-proof/generated
          rm -rf "$out"
          mkdir -p "$out"
          PYTHONPATH=.uc/src python tools/build_object_uc_rigid_scene_handoff.py \
            --uc-root .uc \
            --expected-uc-commit "$CURRENT_UC_HEAD" \
            --out "$out"
          expected_obj_sha=$(cat "$root/successor-obj-sha256.txt")
          PYTHONPATH=tools:.uc/src python tools/build_object_hinge_successor002_ta_transport_rebind.py \
            --contract contracts/object_hinge_successor002_ta_transport_rebind.json \
            --baseline-surface "$out/object-rigid-components.surface.json" \
            --baseline-manifest "$out/object-rigid-scene-graph.json" \
            --baseline-receipt "$out/uc-rigid-scene-handoff-receipt.json" \
            --successor-obj "$root/hard-surface/hinge-bored-knuckle-phase-invariant-source-successor.obj" \
            --expected-successor-obj-sha256 "$expected_obj_sha" \
            --hard-surface-receipt "$root/hard-surface/hinge-bored-knuckle-phase-invariant-source-successor.receipt.json" \
            --geometry-receipt "$root/geometry/hinge-phase-invariant-bored-knuckle-topology-rebind-receipt.json" \
            --rigging-receipt "$root/rigging-successor002-receipt.json" \
            --uc-root .uc \
            --out "$out"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('rigid-proof/generated/object-hinge-successor002-ta-transport-rebind-receipt.json').read_text())
          assert r['result']=='PASS_OBJECT_HINGE_SUCCESSOR002_TA_SCENE_REBIND_TO_CURRENT_UC__HOLD_DEFAULT_RUNTIME_VISUAL',r
          assert r['hard_surface_head']=='a6d18b9fe729304dc4d95d962ed27527adce211f',r
          assert r['geometry_head']=='96abb2830ddabca9ed270b42a9447534d007ce64',r
          assert r['rigging_head']=='cf377074f70ce7f7e386f1378c51705b3db4d305',r
          assert r['uc_head']=='9609998db6677391766e9ee7ff53a5b9b08a3cb9',r
          assert r['successor_hinge_triangles']==480,r
          assert r['unrelated_primitives_byte_semantics_preserved'] is True,r
          assert r['closed_static_localization_max_error_m']<=1e-12,r
          assert r['truth_boundary']['source_successor_default_adopted'] is False,r
          assert r['truth_boundary']['uc_domain_policy_added'] is False,r
          print(json.dumps(r,indent=2))
          PY

      - name: Prove successor byte drift and authority inflation fail closed
        run: |
          set -euo pipefail
          root=rigid-proof/successor002-owner
          out=rigid-proof/generated
          expected_obj_sha=$(cat "$root/successor-obj-sha256.txt")
          cp "$root/hard-surface/hinge-bored-knuckle-phase-invariant-source-successor.obj" /tmp/mutated.obj
          printf '\n# deliberate Technical Art successor byte drift\n' >> /tmp/mutated.obj
          if PYTHONPATH=tools:.uc/src python tools/build_object_hinge_successor002_ta_transport_rebind.py \
            --contract contracts/object_hinge_successor002_ta_transport_rebind.json \
            --baseline-surface "$out/object-rigid-components.surface.json" --baseline-manifest "$out/object-rigid-scene-graph.json" --baseline-receipt "$out/uc-rigid-scene-handoff-receipt.json" \
            --successor-obj /tmp/mutated.obj --expected-successor-obj-sha256 "$expected_obj_sha" \
            --hard-surface-receipt "$root/hard-surface/hinge-bored-knuckle-phase-invariant-source-successor.receipt.json" \
            --geometry-receipt "$root/geometry/hinge-phase-invariant-bored-knuckle-topology-rebind-receipt.json" \
            --rigging-receipt "$root/rigging-successor002-receipt.json" --uc-root .uc --out /tmp/should-not-pass; then
            echo 'ERROR: mutated successor OBJ unexpectedly passed' >&2; exit 1
          fi
          echo PASS_SUCCESSOR_OBJ_BYTE_DRIFT_REJECTED > "$root/negative-successor-byte-drift.txt"

          python - <<'PY'
          import json
          p='contracts/object_hinge_successor002_ta_transport_rebind.json'
          v=json.load(open(p)); v['authority']['automatic_downstream_adoption']=True
          json.dump(v,open('/tmp/inflated-contract.json','w'),indent=2,sort_keys=True)
          PY
          if PYTHONPATH=tools:.uc/src python tools/build_object_hinge_successor002_ta_transport_rebind.py \
            --contract /tmp/inflated-contract.json \
            --baseline-surface "$out/object-rigid-components.surface.json" --baseline-manifest "$out/object-rigid-scene-graph.json" --baseline-receipt "$out/uc-rigid-scene-handoff-receipt.json" \
            --successor-obj "$root/hard-surface/hinge-bored-knuckle-phase-invariant-source-successor.obj" --expected-successor-obj-sha256 "$expected_obj_sha" \
            --hard-surface-receipt "$root/hard-surface/hinge-bored-knuckle-phase-invariant-source-successor.receipt.json" \
            --geometry-receipt "$root/geometry/hinge-phase-invariant-bored-knuckle-topology-rebind-receipt.json" \
            --rigging-receipt "$root/rigging-successor002-receipt.json" --uc-root .uc --out /tmp/should-not-pass-authority; then
            echo 'ERROR: authority-inflated contract unexpectedly passed' >&2; exit 1
          fi
          echo PASS_AUTOMATIC_DOWNSTREAM_ADOPTION_REJECTED > "$root/negative-authority-inflation.txt"

      - name: Download pinned Godot 4.7.2
        if: matrix.python-version == '3.11'
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" -o .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y xvfb; fi

      - name: Import exact successor current-UC GLB in real Godot and verify arrays
        if: matrix.python-version == '3.11'
        run: |
          set -euo pipefail
          rm -f rigid-proof/hinge-successor002-target-receipt.json rigid-proof/hinge-successor002-target-arrays.json rigid-proof/hinge-successor002-target-transport-receipt.json
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 --rendering-method gl_compatibility \
            --path rigid-proof --script successor002_observe.gd
          python tools/verify_object_hinge_successor002_godot_transport.py \
            --surface rigid-proof/generated/object-rigid-components-hinge-successor002.surface.json \
            --ta-receipt rigid-proof/generated/object-hinge-successor002-ta-transport-rebind-receipt.json \
            --target-receipt rigid-proof/hinge-successor002-target-receipt.json \
            --target-arrays rigid-proof/hinge-successor002-target-arrays.json \
            --out rigid-proof/hinge-successor002-target-transport-receipt.json
          python - <<'PY'
          import json
          r=json.load(open('rigid-proof/hinge-successor002-target-transport-receipt.json'))
          assert r['result']=='PASS_OBJECT_HINGE_SUCCESSOR002_CURRENT_UC_GODOT_TRIANGLE_TRANSPORT',r
          assert r['aggregate_triangles']==480,r
          assert r['maximum_position_delta_m']<=1e-6,r
          assert r['index_and_winding_exact_for_all_five_components'] is True,r
          print(json.dumps(r,indent=2))
          PY

      - name: Retain exact successor002 Technical Art evidence
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: object-technical-art-hinge-successor002-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            contracts/object_hinge_successor002_ta_transport_rebind.json
            tools/build_object_hinge_successor002_ta_transport_rebind.py
            tools/verify_object_hinge_successor002_godot_transport.py
            rigid-proof/successor002_observe.gd
            rigid-proof/successor002-owner/
            rigid-proof/generated/object-rigid-components.surface.json
            rigid-proof/generated/object-rigid-scene-graph.json
            rigid-proof/generated/uc-rigid-scene-handoff-receipt.json
            rigid-proof/generated/object-rigid-components-hinge-successor002.surface.json
            rigid-proof/generated/object-rigid-scene-graph-hinge-successor002.json
            rigid-proof/generated/object-rigid-components-hinge-successor002-flat.glb
            rigid-proof/generated/object-rigid-components-hinge-successor002-rebound.glb
            rigid-proof/generated/object-hinge-successor002-ta-transport-rebind-receipt.json
            rigid-proof/hinge-successor002-target-receipt.json
            rigid-proof/hinge-successor002-target-arrays.json
            rigid-proof/hinge-successor002-target-transport-receipt.json
          if-no-files-found: warn
          retention-days: 30
