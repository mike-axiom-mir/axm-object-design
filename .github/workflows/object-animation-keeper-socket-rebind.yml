name: Object Animation keeper-socket motion rebind evidence

on:
  pull_request:
    paths:
      - 'assets/modular-equipment-case-001/lid-keeper-socket-motion-rebind-001.json'
      - 'animation-proof/observe_keeper_socket_motion.gd'
      - '.github/workflows/object-animation-keeper-socket-rebind.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TECHNICAL_ART_HEAD: 965fb2f24dbd0b0cbb748d9f8b8712d62966315f
  UC_HEAD: 6dc465987e01362264f88b7cef4213609ae50763
  KEEPER_RIG_HEAD: 4a743a8c934b72178ef04ae3f55947bdc7f8def0
  OWNERSHIP_HEAD: d3fa10a270faae7925811f44f03381fe5c5d0215
  LID_RIG_HEAD: 4b72c9918c5fc1e89bd18a0be24fb4afac6e7775
  PREVIOUS_RIGGING_HEAD: 9556308c9986f71519bc488badc1b1a63e855e7e
  LATCH_RIG_HEAD: 3b667ff5d30c46ec2fe7da7679518970f8610018
  LATCH_RIG_PLAN_SHA256: 81c27ab7b73ed9a43cb3f554b56c3f4294b893712075e33d13f5b02e008455db

jobs:
  exact-keeper-socket-motion-rebind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Animation PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact Animation head
        run: echo "EXACT_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Checkout exact Technical Art rigid-scene donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.TECHNICAL_ART_HEAD }}
          path: .technical-art

      - name: Checkout exact UC rigid-scene donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: ${{ env.UC_HEAD }}
          path: .uc

      - name: Checkout exact keeper Rigging donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.KEEPER_RIG_HEAD }}
          path: .keeper-rig

      - name: Checkout exact ownership donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.OWNERSHIP_HEAD }}
          path: .ownership

      - name: Checkout exact lid Rigging donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.LID_RIG_HEAD }}
          path: .lid-rig

      - name: Checkout exact historical lower-lever Rigging donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.LATCH_RIG_HEAD }}
          path: .latch-rig

      - name: Set up Python 3.11 and run full Object suite
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Set up Python 3.13 and repeat full Object suite
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Return to Python 3.11 for exact evidence builders
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate exact donor commits and contract pins
        run: |
          set -euo pipefail
          test "$(git -C .technical-art rev-parse HEAD)" = "$TECHNICAL_ART_HEAD"
          test "$(git -C .uc rev-parse HEAD)" = "$UC_HEAD"
          test "$(git -C .keeper-rig rev-parse HEAD)" = "$KEEPER_RIG_HEAD"
          test "$(git -C .ownership rev-parse HEAD)" = "$OWNERSHIP_HEAD"
          test "$(git -C .lid-rig rev-parse HEAD)" = "$LID_RIG_HEAD"
          test "$(git -C .latch-rig rev-parse HEAD)" = "$LATCH_RIG_HEAD"
          python - <<'PY'
          import json, os
          from pathlib import Path
          c=json.loads(Path('assets/modular-equipment-case-001/lid-keeper-socket-motion-rebind-001.json').read_text())
          assert c['schema']=='axm.object-animation-keeper-socket-motion-rebind/v0.1',c
          assert c['host_source_sha256']=='49b1f9ed9865893d6de6f1ec8f069576732df694853fde4e3fcff366de32644a',c
          assert c['sequence']['sequence_id']=='lid-latch-open-hold-close-001',c
          assert c['sequence']['duration_s']==2.5 and c['sequence']['sample_rate_hz']==40 and c['sequence']['endpoint_inclusive_sample_count']==101,c
          assert c['sequence']['base_lid_clip_digest']=='9e149195ab315f83f2d6f7d76f374f4be245567f77402de3e8a1d40ab79ef340',c
          assert c['sequence']['motion_mutation_policy']=='FORBIDDEN_REBIND_ONLY',c
          assert c['keeper_rig_dependency']['exact_head']==os.environ['KEEPER_RIG_HEAD'],c
          assert c['keeper_rig_dependency']['ownership_head']==os.environ['OWNERSHIP_HEAD'],c
          assert c['keeper_rig_dependency']['lid_rig_head']==os.environ['LID_RIG_HEAD'],c
          assert c['keeper_rig_dependency']['previous_rigging_target_binding_head']==os.environ['PREVIOUS_RIGGING_HEAD'],c
          assert c['lower_lever_animation_dependency']['historical_latch_rig_head']==os.environ['LATCH_RIG_HEAD'],c
          assert c['target_host']['technical_art_head']==os.environ['TECHNICAL_ART_HEAD'],c
          assert c['target_host']['uc_head']==os.environ['UC_HEAD'],c
          assert c['evidence_policy']['runtime_controller_acceptance'] is False,c
          assert c['evidence_policy']['gameplay_acceptance'] is False,c
          assert c['evidence_policy']['perceptual_acceptance'] is False,c
          print('exact keeper-socket Animation contract pins PASS')
          PY

      - name: Rebuild exact Technical Art UC rigid-scene donor output
        run: |
          set -euo pipefail
          rm -rf .technical-art/rigid-proof/generated
          mkdir -p .technical-art/rigid-proof/generated
          (
            cd .technical-art
            PYTHONPATH=../.uc/src python tools/build_object_uc_rigid_scene_handoff.py \
              --uc-root ../.uc \
              --expected-uc-commit "$UC_HEAD" \
              --out rigid-proof/generated
          )

      - name: Rebuild unchanged exact lid + lower-lever Animation sequence
        run: |
          set -euo pipefail
          rm -rf /tmp/axm-keeper-lid-motion /tmp/axm-keeper-latch-rig /tmp/axm-keeper-sequence
          python tools/build_lid_motion_evidence.py \
            --source assets/modular-equipment-case-001/source.json \
            --rig .lid-rig/assets/modular-equipment-case-001/articulation.json \
            --clip assets/modular-equipment-case-001/lid-motion-clip.json \
            --out /tmp/axm-keeper-lid-motion \
            --exact-head "$EXACT_HEAD_SHA"
          PYTHONPATH=".latch-rig/tools" python .latch-rig/tools/verify_front_latch_articulation.py \
            --host assets/modular-equipment-case-001/source.json \
            --ownership .ownership/assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --plan .latch-rig/assets/modular-equipment-case-001/front-latch-articulation-001.json \
            --out /tmp/axm-keeper-latch-rig
          python tools/build_lid_latch_motion_evidence.py \
            --source assets/modular-equipment-case-001/source.json \
            --sequence assets/modular-equipment-case-001/lid-latch-motion-sequence-001.json \
            --motion-evidence /tmp/axm-keeper-lid-motion/lid-motion-evidence.json \
            --ownership .ownership/assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --rig-receipt /tmp/axm-keeper-latch-rig/front-latch-articulation.receipt.json \
            --rig-head "$LATCH_RIG_HEAD" \
            --rig-plan-sha256 "$LATCH_RIG_PLAN_SHA256" \
            --out /tmp/axm-keeper-sequence \
            --exact-head "$EXACT_HEAD_SHA"

      - name: Rebuild exact current keeper Rigging socket evidence
        run: |
          set -euo pipefail
          rm -rf /tmp/axm-keeper-rig
          PYTHONPATH=".keeper-rig/tools" python .keeper-rig/tools/verify_lid_keeper_socket_binding.py \
            --source assets/modular-equipment-case-001/source.json \
            --ownership .ownership/assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --lid-plan .lid-rig/assets/modular-equipment-case-001/articulation.json \
            --observed-ownership-head "$OWNERSHIP_HEAD" \
            --observed-lid-rig-head "$LID_RIG_HEAD" \
            --observed-previous-rigging-head "$PREVIOUS_RIGGING_HEAD" \
            --out /tmp/axm-keeper-rig
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/axm-keeper-rig/receipt.json').read_text())
          assert r['result']=='PASS_LID_OWNED_KEEPER_SOCKET_BINDING_111_POSES',r
          assert r['socket_binding']['sweep_sample_count']==111,r
          assert r['truth_boundary']['animation_accepted'] is False,r
          assert r['truth_boundary']['runtime_accepted'] is False,r
          print('exact keeper Rigging receipt PASS')
          PY

      - name: Assemble exact target-host keeper-motion inputs
        run: |
          set -euo pipefail
          rm -rf animation-proof/generated
          mkdir -p animation-proof/generated
          cp .technical-art/rigid-proof/generated/object-rigid-components-rebound.glb animation-proof/generated/
          cp .technical-art/rigid-proof/generated/uc-rigid-scene-handoff-receipt.json animation-proof/generated/
          cp /tmp/axm-keeper-sequence/lid-latch-motion-evidence.json animation-proof/generated/
          cp /tmp/axm-keeper-latch-rig/front-latch-articulation.receipt.json animation-proof/generated/
          cp /tmp/axm-keeper-rig/receipt.json animation-proof/generated/lid-keeper-socket-binding.receipt.json
          cp assets/modular-equipment-case-001/lid-keeper-socket-motion-rebind-001.json animation-proof/generated/
          printf '%s\n' "$EXACT_HEAD_SHA" > animation-proof/generated/exact-animation-head.txt
          printf '%s\n' "$KEEPER_RIG_HEAD" > animation-proof/generated/exact-keeper-rig-head.txt
          printf '%s\n' "$TECHNICAL_ART_HEAD" > animation-proof/generated/exact-technical-art-head.txt
          printf '%s\n' "$UC_HEAD" > animation-proof/generated/exact-uc-head.txt

      - name: Validate exact cross-repo identity before Godot motion observation
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('animation-proof/generated')
          t=json.loads((root/'uc-rigid-scene-handoff-receipt.json').read_text())
          s=json.loads((root/'lid-latch-motion-evidence.json').read_text())
          k=json.loads((root/'lid-keeper-socket-binding.receipt.json').read_text())
          c=json.loads((root/'lid-keeper-socket-motion-rebind-001.json').read_text())
          assert t['result']==c['target_host']['required_result'],t
          assert t['source_repository_head']==os.environ['TECHNICAL_ART_HEAD'],t
          assert t['observed_uc_commit']==os.environ['UC_HEAD'],t
          assert s['result']=='PASS_ORDERED_LATCH_RELEASE_LID_CLIP_REENGAGE_SEQUENCE',s
          assert s['exact_receiving_head']==os.environ['EXACT_HEAD_SHA'],s
          assert s['sequence_id']==c['sequence']['sequence_id'],s
          assert s['base_lid_clip_digest']==c['sequence']['base_lid_clip_digest'],s
          assert s['endpoint_inclusive_sample_count']==101 and s['sample_rate_hz']==40 and s['duration_s']==2.5,s
          assert k['result']==c['keeper_rig_dependency']['required_result'],k
          assert k['source_sha256']==c['host_source_sha256']==s['host_source_sha256']==t['source_sha256'],(k,s,t,c)
          assert k['identity']['ownership_head']==os.environ['OWNERSHIP_HEAD'],k
          assert k['identity']['lid_rig_head']==os.environ['LID_RIG_HEAD'],k
          assert k['identity']['previous_rigging_target_binding_head']==os.environ['PREVIOUS_RIGGING_HEAD'],k
          print('cross-repo keeper-motion identity gate PASS')
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Negative control rejects 1 mm Rigging reference drift
        run: |
          set -euo pipefail
          cp animation-proof/generated/lid-keeper-socket-binding.receipt.json /tmp/lid-keeper-socket-binding.original.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('animation-proof/generated/lid-keeper-socket-binding.receipt.json')
          d=json.loads(p.read_text())
          row=next(x for x in d['sweep'] if x['open_angle_deg']==50)
          row['keepers'][0]['center_m'][0]+=0.001
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          rm -f animation-proof/keeper-socket-motion-rebind-receipt.json
          if .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
              --headless \
              --path animation-proof \
              --script observe_keeper_socket_motion.gd; then
            echo 'negative control unexpectedly passed'
            exit 1
          fi
          cp /tmp/lid-keeper-socket-binding.original.json animation-proof/generated/lid-keeper-socket-binding.receipt.json
          rm -f animation-proof/keeper-socket-motion-rebind-receipt.json
          echo '1 mm keeper reference mutation rejected as expected'

      - name: Observe exact keeper sockets through authored samples and capture-free play path
        run: |
          set -euo pipefail
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path animation-proof \
            --script observe_keeper_socket_motion.gd

      - name: Validate retained keeper-socket target-host receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('animation-proof/keeper-socket-motion-rebind-receipt.json')
          r=json.loads(p.read_text())
          assert r['state']=='PASS_TARGET_HOST_KEEPER_SOCKET_MOTION_REBIND_101_SAMPLES',r
          assert r['keeper_rig_head']==os.environ['KEEPER_RIG_HEAD'],r
          assert r['technical_art_head']==os.environ['TECHNICAL_ART_HEAD'],r
          assert r['uc_head']==os.environ['UC_HEAD'],r
          assert r['sequence_id']=='lid-latch-open-hold-close-001',r
          assert r['base_lid_clip_digest']=='9e149195ab315f83f2d6f7d76f374f4be245567f77402de3e8a1d40ab79ef340',r
          assert r['duration_s']==2.5 and r['sample_rate_hz']==40 and r['authored_sample_count']==101,r
          assert r['animationplayer_track_count']==3 and r['animationplayer_key_counts']==[101,101,101],r
          assert r['max_lid_sample_seek_error_deg']<=1e-5,r
          assert r['max_latch_sample_seek_error_deg']<=1e-5,r
          assert r['max_keeper_lid_local_socket_drift_m']<=1e-6,r
          assert r['max_keeper_rig_reference_center_error_m']<=1e-6,r
          assert r['rig_reference_hits']['0']>=2 and r['rig_reference_hits']['50']>=2 and r['rig_reference_hits']['100']>=2,r
          assert r['peak_min_keeper_world_move_m']>=0.03,r
          assert r['capture_free_play_path_frames']>=2,r
          assert r['capture_free_play_path_max_lid_rotation_deg']>=80.0,r
          assert r['capture_free_play_path_max_keeper_local_socket_drift_m']<=1e-6,r
          assert r['endpoint_keeper_world_drift_m']<=1e-6 and r['endpoint_lever_world_drift_m']<=1e-6,r
          assert r['motion_mutation']=='NONE',r
          assert r['truth_boundary']['runtime_controller_or_state_machine'] is False,r
          assert r['truth_boundary']['gameplay_acceptance'] is False,r
          assert r['truth_boundary']['scheduler_delivery_certified'] is False,r
          assert r['truth_boundary']['physics_or_latch_mechanism_accepted'] is False,r
          assert r['truth_boundary']['perceptual_acceptance'] is False,r
          print(json.dumps(r,indent=2))
          PY

      - name: Retain exact keeper-socket Animation rebind evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-animation-keeper-socket-rebind-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            assets/modular-equipment-case-001/lid-keeper-socket-motion-rebind-001.json
            animation-proof/generated/object-rigid-components-rebound.glb
            animation-proof/generated/uc-rigid-scene-handoff-receipt.json
            animation-proof/generated/lid-latch-motion-evidence.json
            animation-proof/generated/front-latch-articulation.receipt.json
            animation-proof/generated/lid-keeper-socket-binding.receipt.json
            animation-proof/generated/exact-animation-head.txt
            animation-proof/generated/exact-keeper-rig-head.txt
            animation-proof/generated/exact-technical-art-head.txt
            animation-proof/generated/exact-uc-head.txt
            animation-proof/keeper-socket-motion-rebind-receipt.json
          if-no-files-found: warn
          retention-days: 30
