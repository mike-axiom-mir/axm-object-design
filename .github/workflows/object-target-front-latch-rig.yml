name: Object target front-latch rig evidence

on:
  pull_request:
    paths:
      - "tools/build_object_target_front_latch_rig_binding.py"
      - "tests/test_object_target_front_latch_rig_binding.py"
      - "latch-rig-target-proof/**"
      - ".github/workflows/object-target-front-latch-rig.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_RIG_HEAD: 3a17a02528918ec63a46e954e883179f752c8151
  SOURCE_RIG_BINDING_BLOB: 0331d30528f58d353fa9396d7ca129a020e8c6ce
  SOURCE_MECHANICAL_AUTHORITY_HEAD: 56aaaecb45b520fdff9e08fe2d4ea42562f5690f
  HISTORICAL_RIGGING_HEAD: 3b667ff5d30c46ec2fe7da7679518970f8610018
  TECH_ART_HEAD: b9848c62b2adde84e9e0afc219088113216799d6
  HISTORICAL_TECH_ART_HEAD: 965fb2f24dbd0b0cbb748d9f8b8712d62966315f
  UC_HEAD: 6dc465987e01362264f88b7cef4213609ae50763

jobs:
  target-front-latch-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact Rigging candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout exact current source Rigging donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.SOURCE_RIG_HEAD }}
          path: .source-rig
          fetch-depth: 0

      - name: Checkout exact Technical Art rigid-scene donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.TECH_ART_HEAD }}
          path: .tech-art

      - name: Checkout exact Universal Creation rigid-scene donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: ${{ env.UC_HEAD }}
          path: .uc

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and run complete current Object tests
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Rebuild exact current source-owned latch Rigging evidence
        run: |
          set -euo pipefail
          cd .source-rig
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v
          test "$(git rev-parse HEAD)" = "$SOURCE_RIG_HEAD"
          test "$(git hash-object assets/modular-equipment-case-001/front-latch-source-rig-binding-003.json)" = "$SOURCE_RIG_BINDING_BLOB"
          git fetch --no-tags origin "$SOURCE_MECHANICAL_AUTHORITY_HEAD" "$HISTORICAL_RIGGING_HEAD"
          git show "$HISTORICAL_RIGGING_HEAD:assets/modular-equipment-case-001/front-latch-articulation-001.json" > /tmp/front-latch-articulation-001.json
          git show "$SOURCE_MECHANICAL_AUTHORITY_HEAD:assets/modular-equipment-case-001/front-latch-pivot-interface-001.json" > /tmp/front-latch-pivot-interface-current.json
          git show "$SOURCE_MECHANICAL_AUTHORITY_HEAD:assets/modular-equipment-case-001/front-latch-capture-envelope-001.json" > /tmp/front-latch-capture-envelope-current.json
          git show "$SOURCE_MECHANICAL_AUTHORITY_HEAD:tools/verify_front_latch_capture_envelope.py" > /tmp/verify_front_latch_capture_envelope.py
          rm -rf /tmp/source-capture-evidence /tmp/source-rig-evidence
          PYTHONPATH="$PWD/tools" python /tmp/verify_front_latch_capture_envelope.py \
            --host assets/modular-equipment-case-001/source.json \
            --interface /tmp/front-latch-pivot-interface-current.json \
            --policy /tmp/front-latch-capture-envelope-current.json \
            --out /tmp/source-capture-evidence
          python tools/verify_front_latch_source_rig_binding.py \
            --host assets/modular-equipment-case-001/source.json \
            --ownership assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --interface /tmp/front-latch-pivot-interface-current.json \
            --historical-plan /tmp/front-latch-articulation-001.json \
            --capture-policy /tmp/front-latch-capture-envelope-current.json \
            --capture-receipt /tmp/source-capture-evidence/receipt.json \
            --binding assets/modular-equipment-case-001/front-latch-source-rig-binding-003.json \
            --out /tmp/source-rig-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/source-rig-evidence/front-latch-source-rig-binding-evidence.json').read_text())
          assert r['result']=='PASS_SOURCE_OWNED_FRONT_LATCH_RIG_CAPTURE_ENVELOPE_REBIND',r
          assert r['pose_samples_deg']==[0.0,9.25,9.30,25.0,48.65,48.70,50.0],r
          assert r['source_capture_transition_deg']==9.264790333551197,r
          assert r['z_aabb_only_transition_deg']==48.66480246428277,r
          assert r['maximum_pivot_drift_m']<=1e-12,r
          assert r['maximum_rigid_pairwise_distance_drift_m']<=1e-12,r
          PY

      - name: Rebuild exact Technical Art target hierarchy
        run: |
          cd .tech-art
          rm -rf rigid-proof/generated
          mkdir -p rigid-proof/generated
          PYTHONPATH=../.uc/src python tools/build_object_uc_rigid_scene_handoff.py \
            --uc-root ../.uc \
            --expected-uc-commit "$UC_HEAD" \
            --out rigid-proof/generated

      - name: Build exact target front-latch rig boundary binding
        run: |
          set -euo pipefail
          rm -rf latch-rig-target-proof/generated
          mkdir -p latch-rig-target-proof/generated
          OBSERVED_SOURCE_RIG_HEAD="$(git -C .source-rig rev-parse HEAD)"
          OBSERVED_TECH_ART_HEAD="$(git -C .tech-art rev-parse HEAD)"
          OBSERVED_UC_HEAD="$(git -C .uc rev-parse HEAD)"
          python tools/build_object_target_front_latch_rig_binding.py \
            --source-rig-binding .source-rig/assets/modular-equipment-case-001/front-latch-source-rig-binding-003.json \
            --interface /tmp/front-latch-pivot-interface-current.json \
            --tech-receipt .tech-art/rigid-proof/generated/uc-rigid-scene-handoff-receipt.json \
            --rebound-glb .tech-art/rigid-proof/generated/object-rigid-components-rebound.glb \
            --observed-source-rig-head "$OBSERVED_SOURCE_RIG_HEAD" \
            --observed-tech-art-head "$OBSERVED_TECH_ART_HEAD" \
            --observed-uc-head "$OBSERVED_UC_HEAD" \
            --out latch-rig-target-proof/generated/target-front-latch-rig-binding.json
          cp .tech-art/rigid-proof/generated/object-rigid-components-rebound.glb latch-rig-target-proof/generated/
          cp .source-rig/assets/modular-equipment-case-001/front-latch-source-rig-binding-003.json latch-rig-target-proof/generated/source-rig-binding.json
          cp /tmp/front-latch-pivot-interface-current.json latch-rig-target-proof/generated/source-pivot-interface.json
          cp /tmp/front-latch-capture-envelope-current.json latch-rig-target-proof/generated/source-capture-envelope.json
          cp /tmp/source-capture-evidence/receipt.json latch-rig-target-proof/generated/source-capture-evidence.json
          cp /tmp/source-rig-evidence/front-latch-source-rig-binding-evidence.json latch-rig-target-proof/generated/source-rig-evidence.json
          git rev-parse HEAD > latch-rig-target-proof/generated/exact-candidate-head.txt
          printf '%s\n' "$OBSERVED_SOURCE_RIG_HEAD" > latch-rig-target-proof/generated/exact-source-rig-head.txt
          printf '%s\n' "$OBSERVED_TECH_ART_HEAD" > latch-rig-target-proof/generated/exact-technical-art-head.txt
          printf '%s\n' "$HISTORICAL_TECH_ART_HEAD" > latch-rig-target-proof/generated/historical-technical-art-head.txt
          printf '%s\n' "$OBSERVED_UC_HEAD" > latch-rig-target-proof/generated/exact-uc-head.txt

      - name: Validate binding identity and fail-closed semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('latch-rig-target-proof/generated/target-front-latch-rig-binding.json')
          b=json.loads(p.read_text())
          assert b['result']=='PASS_SOURCE_OWNED_FRONT_LATCH_CAPTURE_ENVELOPE_TO_UC_TARGET_BINDING_READY',b
          assert b['source_rig_donor_head']=='3a17a02528918ec63a46e954e883179f752c8151',b
          assert b['source_mechanical_authority_head']=='56aaaecb45b520fdff9e08fe2d4ea42562f5690f',b
          assert b['technical_art_donor_head']=='b9848c62b2adde84e9e0afc219088113216799d6',b
          assert b['technical_art_historical_donor_head']=='965fb2f24dbd0b0cbb748d9f8b8712d62966315f',b
          assert b['technical_art_provenance_rebind']['historical_receipts_reused_as_current_evidence'] is False,b
          assert b['technical_art_provenance_rebind']['current_receipt_rebuilt_from_current_head'] is True,b
          assert b['uc_donor_head']=='6dc465987e01362264f88b7cef4213609ae50763',b
          assert b['representative_source_angles_deg']==[0.0,9.25,9.30,25.0,48.65,48.70,50.0],b
          assert b['representative_target_angles_deg']==[-0.0,-9.25,-9.30,-25.0,-48.65,-48.70,-50.0],b
          assert b['source_capture_transition_bracket_deg']==[9.25,9.30],b
          assert b['target_capture_transition_bracket_x_deg']==[-9.30,-9.25],b
          assert b['source_z_aabb_only_transition_bracket_deg']==[48.65,48.70],b
          assert b['target_z_aabb_only_transition_bracket_x_deg']==[-48.70,-48.65],b
          assert [row['pivot_target_m'] for row in b['stations']]==[[-0.22,0.2105,-0.258],[0.22,0.2105,-0.258]],b
          assert b['truth_boundary']['proof_volume_capture_and_z_aabb_broad_phase_kept_distinct'] is True,b
          assert b['truth_boundary']['animation_timing_or_clip_acceptance'] is False,b
          assert b['truth_boundary']['runtime_controller_or_state_machine_acceptance'] is False,b
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('.source-rig/assets/modular-equipment-case-001/front-latch-source-rig-binding-003.json')
          bad=json.loads(src.read_text())
          bad['required_capture_transition_bracket_deg']=bad['required_z_aabb_only_transition_bracket_deg']
          Path('/tmp/bad-source-rig-binding.json').write_text(json.dumps(bad,indent=2)+'\n')
          PY
          if python tools/build_object_target_front_latch_rig_binding.py \
            --source-rig-binding /tmp/bad-source-rig-binding.json \
            --interface /tmp/front-latch-pivot-interface-current.json \
            --tech-receipt .tech-art/rigid-proof/generated/uc-rigid-scene-handoff-receipt.json \
            --rebound-glb .tech-art/rigid-proof/generated/object-rigid-components-rebound.glb \
            --observed-source-rig-head "$SOURCE_RIG_HEAD" \
            --observed-tech-art-head "$TECH_ART_HEAD" \
            --observed-uc-head "$UC_HEAD" \
            --out /tmp/should-not-pass.json; then
            echo "capture/Z-AABB semantic collapse unexpectedly passed" >&2
            exit 1
          fi
          printf '%s\n' 'PASS_REJECTED_CAPTURE_Z_AABB_SEMANTIC_COLLAPSE' > latch-rig-target-proof/generated/negative-control.txt

      - name: Download pinned Godot 4.7.2
        if: matrix.python-version == '3.11'
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        if: matrix.python-version == '3.11'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Exercise exact current source-owned boundary poses on real target hierarchy
        if: matrix.python-version == '3.11'
        run: |
          rm -f latch-rig-target-proof/target-front-latch-rig-receipt.json latch-rig-target-proof/latch-pose-*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path latch-rig-target-proof \
            --script observe.gd

      - name: Validate target-host latch rig receipt
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('latch-rig-target-proof')
          b=json.loads((root/'generated/target-front-latch-rig-binding.json').read_text())
          r=json.loads((root/'target-front-latch-rig-receipt.json').read_text())
          assert r['state']=='PASS_CURRENT_SOURCE_CAPTURE_ENVELOPE_RIG_ON_UC_TARGET_HIERARCHY',r
          assert r['glb_sha256']==b['technical_art_rebound_glb_sha256'],(b,r)
          assert r['technical_art_donor_head']==b['technical_art_donor_head']=='b9848c62b2adde84e9e0afc219088113216799d6',r
          assert r['technical_art_historical_donor_head']==b['technical_art_historical_donor_head']=='965fb2f24dbd0b0cbb748d9f8b8712d62966315f',r
          assert [row['source_angle_deg'] for row in r['representative_poses']]==[0.0,9.25,9.30,25.0,48.65,48.70,50.0],r
          assert [row['target_rotation_x_deg'] for row in r['representative_poses']]==[-0.0,-9.25,-9.30,-25.0,-48.65,-48.70,-50.0],r
          assert r['source_capture_transition_bracket_deg']==[9.25,9.30],r
          assert r['source_z_aabb_only_transition_bracket_deg']==[48.65,48.70],r
          assert r['maximum_expected_transform_residual']<=1e-6,r
          assert r['maximum_pivot_drift_m']<=1e-6,r
          assert r['maximum_rigid_pairwise_signature_drift_m']<=1e-6,r
          assert r['maximum_fixed_component_center_drift_m']<=1e-6,r
          assert r['maximum_bilateral_center_movement_residual_m']<=1e-6,r
          assert r['maximum_neutral_return_transform_drift']<=1e-6,r
          assert r['truth_boundary']['target_host_independently_proves_capture_contact'] is False,r
          assert r['truth_boundary']['continuous_between_pose_motion_accepted'] is False,r
          assert r['truth_boundary']['animationplayer_acceptance'] is False,r
          assert r['truth_boundary']['runtime_controller_or_state_machine_acceptance'] is False,r
          for name in ['latch-pose-00.png','latch-pose-01.png','latch-pose-02.png','latch-pose-03.png','latch-pose-04.png','latch-pose-05.png','latch-pose-06.png','latch-pose-return-00.png']:
              assert (root/name).stat().st_size>3000,name
          print(json.dumps(r,indent=2))
          PY

      - name: Retain exact target latch rig evidence
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: object-target-front-latch-rig-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            latch-rig-target-proof/generated/target-front-latch-rig-binding.json
            latch-rig-target-proof/generated/object-rigid-components-rebound.glb
            latch-rig-target-proof/generated/source-rig-binding.json
            latch-rig-target-proof/generated/source-pivot-interface.json
            latch-rig-target-proof/generated/source-capture-envelope.json
            latch-rig-target-proof/generated/source-capture-evidence.json
            latch-rig-target-proof/generated/source-rig-evidence.json
            latch-rig-target-proof/generated/negative-control.txt
            latch-rig-target-proof/generated/exact-candidate-head.txt
            latch-rig-target-proof/generated/exact-source-rig-head.txt
            latch-rig-target-proof/generated/exact-technical-art-head.txt
            latch-rig-target-proof/generated/historical-technical-art-head.txt
            latch-rig-target-proof/generated/exact-uc-head.txt
            latch-rig-target-proof/target-front-latch-rig-receipt.json
            latch-rig-target-proof/latch-pose-*.png
          if-no-files-found: warn
          retention-days: 30
