name: Object Runtime AnimationPlayer key budget evidence

on:
  pull_request:
    paths:
      - 'animation-proof/observe_runtime_key_budget.gd'
      - '.github/workflows/object-runtime-animation-key-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIOR_ANIMATION_HEAD: 5cb073f9fcf825014556ed165ee081e1eca71cdc
  CURRENT_ANIMATION_HEAD: 6c81740c7895c90d6bb3a617d74f0863c52053f6
  TECHNICAL_ART_HEAD: 965fb2f24dbd0b0cbb748d9f8b8712d62966315f
  UC_HEAD: 6dc465987e01362264f88b7cef4213609ae50763
  LID_RIG_HEAD: 4b72c9918c5fc1e89bd18a0be24fb4afac6e7775
  LATCH_RIG_HEAD: 3b667ff5d30c46ec2fe7da7679518970f8610018
  LATCH_OWNERSHIP_HEAD: d3fa10a270faae7925811f44f03381fe5c5d0215
  SOURCE_RIG_HEAD: a1acd2bcb2074f41e536562f2673508e2cb0a4d5
  SOURCE_INTERFACE_HEAD: 6086f39a3da344c57a68653f90d040e03e04cec2
  SOURCE_INTERFACE_SHA256: bcbbe098371eb702bc9289a97370744093105925202eda6036bdced6e25e34d3
  SOURCE_RIG_BINDING_SHA256: 615f8ff34cc0897fd399345301efce1ca9cb0aa58e86caca92b914049b89adce
  LATCH_RIG_PLAN_SHA256: 81c27ab7b73ed9a43cb3f554b56c3f4294b893712075e33d13f5b02e008455db
  LATCH_OWNERSHIP_SHA256: 0702e4180f858d29c42ff8c38a61eaa16278d6848c8ce6f3ecfae172969ca8ae

jobs:
  exact-animation-key-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Runtime PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact Runtime head
        run: echo "EXACT_RUNTIME_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Checkout exact prior Animation choreography donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.PRIOR_ANIMATION_HEAD }}
          path: .animation
      - name: Checkout exact current Animation source-authority donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.CURRENT_ANIMATION_HEAD }}
          path: .current-animation
      - name: Checkout exact current source-rig authority donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.SOURCE_RIG_HEAD }}
          path: .source-rig
      - name: Checkout exact Technical Art rigid-scene donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.TECHNICAL_ART_HEAD }}
          path: .technical-art
      - name: Checkout exact UC rigid-scene donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: ${{ env.UC_HEAD }}
          path: .uc
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact Runtime branch structural suite
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v
      - name: Validate exact donor heads and current authority files
        run: |
          set -euo pipefail
          test "$(git -C .animation rev-parse HEAD)" = "$PRIOR_ANIMATION_HEAD"
          test "$(git -C .current-animation rev-parse HEAD)" = "$CURRENT_ANIMATION_HEAD"
          test "$(git -C .source-rig rev-parse HEAD)" = "$SOURCE_RIG_HEAD"
          test "$(git -C .technical-art rev-parse HEAD)" = "$TECHNICAL_ART_HEAD"
          test "$(git -C .uc rev-parse HEAD)" = "$UC_HEAD"
          echo "$SOURCE_INTERFACE_SHA256  .source-rig/assets/modular-equipment-case-001/front-latch-pivot-interface-001.json" | sha256sum -c -
          echo "$SOURCE_RIG_BINDING_SHA256  .source-rig/assets/modular-equipment-case-001/front-latch-source-rig-binding-002.json" | sha256sum -c -
      - name: Rebuild exact Technical Art UC rigid-scene donor output
        run: |
          set -euo pipefail
          rm -rf .technical-art/rigid-proof/generated
          mkdir -p .technical-art/rigid-proof/generated
          (
            cd .technical-art
            PYTHONPATH=../.uc/src python tools/build_object_uc_rigid_scene_handoff.py \
              --uc-root ../.uc \
              --expected-uc-commit "$UC_HEAD" \
              --out rigid-proof/generated
          )
      - name: Materialize exact historical lid/latch donors
        run: |
          set -euo pipefail
          rm -rf /tmp/axm-runtime-key-budget-donors /tmp/axm-runtime-latch-rig /tmp/axm-runtime-lid-motion /tmp/axm-runtime-lid-latch /tmp/axm-runtime-source-rig /tmp/axm-runtime-animation-authority
          mkdir -p /tmp/axm-runtime-key-budget-donors/tools /tmp/axm-runtime-key-budget-donors/assets/modular-equipment-case-001
          curl -fsSL "https://raw.githubusercontent.com/mike-axiom-mir/axm-object-design/${LID_RIG_HEAD}/assets/modular-equipment-case-001/articulation.json" -o /tmp/axm-runtime-key-budget-donors/assets/modular-equipment-case-001/articulation.json
          ownership_base="https://raw.githubusercontent.com/mike-axiom-mir/axm-object-design/${LATCH_OWNERSHIP_HEAD}"
          rig_base="https://raw.githubusercontent.com/mike-axiom-mir/axm-object-design/${LATCH_RIG_HEAD}"
          curl -fsSL "$ownership_base/assets/modular-equipment-case-001/front-latch-ownership-001.json" -o /tmp/axm-runtime-key-budget-donors/assets/modular-equipment-case-001/front-latch-ownership-001.json
          curl -fsSL "$ownership_base/tools/verify_front_latch_ownership.py" -o /tmp/axm-runtime-key-budget-donors/tools/verify_front_latch_ownership.py
          curl -fsSL "$rig_base/assets/modular-equipment-case-001/front-latch-articulation-001.json" -o /tmp/axm-runtime-key-budget-donors/assets/modular-equipment-case-001/front-latch-articulation-001.json
          curl -fsSL "$rig_base/tools/verify_front_latch_articulation.py" -o /tmp/axm-runtime-key-budget-donors/tools/verify_front_latch_articulation.py
          echo "$LATCH_OWNERSHIP_SHA256  /tmp/axm-runtime-key-budget-donors/assets/modular-equipment-case-001/front-latch-ownership-001.json" | sha256sum -c -
          echo "$LATCH_RIG_PLAN_SHA256  /tmp/axm-runtime-key-budget-donors/assets/modular-equipment-case-001/front-latch-articulation-001.json" | sha256sum -c -
      - name: Rebuild exact prior Animation choreography sequence
        run: |
          set -euo pipefail
          (
            cd .animation
            python tools/build_lid_motion_evidence.py \
              --source assets/modular-equipment-case-001/source.json \
              --rig /tmp/axm-runtime-key-budget-donors/assets/modular-equipment-case-001/articulation.json \
              --clip assets/modular-equipment-case-001/lid-motion-clip.json \
              --out /tmp/axm-runtime-lid-motion \
              --exact-head "$PRIOR_ANIMATION_HEAD"
          )
          PYTHONPATH="$PWD/.animation/tools" python /tmp/axm-runtime-key-budget-donors/tools/verify_front_latch_articulation.py \
            --host .animation/assets/modular-equipment-case-001/source.json \
            --ownership /tmp/axm-runtime-key-budget-donors/assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --plan /tmp/axm-runtime-key-budget-donors/assets/modular-equipment-case-001/front-latch-articulation-001.json \
            --out /tmp/axm-runtime-latch-rig
          (
            cd .animation
            python tools/build_lid_latch_motion_evidence.py \
              --source assets/modular-equipment-case-001/source.json \
              --sequence assets/modular-equipment-case-001/lid-latch-motion-sequence-001.json \
              --motion-evidence /tmp/axm-runtime-lid-motion/lid-motion-evidence.json \
              --ownership /tmp/axm-runtime-key-budget-donors/assets/modular-equipment-case-001/front-latch-ownership-001.json \
              --rig-receipt /tmp/axm-runtime-latch-rig/front-latch-articulation.receipt.json \
              --rig-head "$LATCH_RIG_HEAD" \
              --rig-plan-sha256 "$LATCH_RIG_PLAN_SHA256" \
              --out /tmp/axm-runtime-lid-latch \
              --exact-head "$PRIOR_ANIMATION_HEAD"
          )
      - name: Rebuild current source-owned Rigging authority
        run: |
          set -euo pipefail
          PYTHONPATH=".source-rig/tools" python .source-rig/tools/verify_front_latch_source_rig_binding.py \
            --host .current-animation/assets/modular-equipment-case-001/source.json \
            --ownership /tmp/axm-runtime-key-budget-donors/assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --interface .source-rig/assets/modular-equipment-case-001/front-latch-pivot-interface-001.json \
            --historical-plan /tmp/axm-runtime-key-budget-donors/assets/modular-equipment-case-001/front-latch-articulation-001.json \
            --binding .source-rig/assets/modular-equipment-case-001/front-latch-source-rig-binding-002.json \
            --out /tmp/axm-runtime-source-rig
      - name: Prove current Animation authority over unchanged choreography
        run: |
          set -euo pipefail
          PYTHONPATH=".current-animation/tools" python .current-animation/tools/verify_animation_source_authority_rebind.py \
            --host .current-animation/assets/modular-equipment-case-001/source.json \
            --contract .current-animation/assets/modular-equipment-case-001/source-authority-motion-rebind-002.json \
            --prior-sequence-evidence /tmp/axm-runtime-lid-latch/lid-latch-motion-evidence.json \
            --source-interface .source-rig/assets/modular-equipment-case-001/front-latch-pivot-interface-001.json \
            --source-rig-receipt /tmp/axm-runtime-source-rig/front-latch-source-rig-binding-evidence.json \
            --exact-head "$CURRENT_ANIMATION_HEAD" \
            --out /tmp/axm-runtime-animation-authority
      - name: Assemble exact Runtime target-host inputs
        run: |
          set -euo pipefail
          rm -rf animation-proof/generated
          mkdir -p animation-proof/generated
          cp .technical-art/rigid-proof/generated/object-rigid-components-rebound.glb animation-proof/generated/
          cp .technical-art/rigid-proof/generated/uc-rigid-scene-handoff-receipt.json animation-proof/generated/
          cp /tmp/axm-runtime-lid-latch/lid-latch-motion-evidence.json animation-proof/generated/
          cp /tmp/axm-runtime-latch-rig/front-latch-articulation.receipt.json animation-proof/generated/
          cp /tmp/axm-runtime-source-rig/front-latch-source-rig-binding-evidence.json animation-proof/generated/
          cp /tmp/axm-runtime-animation-authority/animation-source-authority-rebind-evidence.json animation-proof/generated/
          printf '%s\n' "$PRIOR_ANIMATION_HEAD" > animation-proof/generated/exact-prior-animation-donor-head.txt
          printf '%s\n' "$CURRENT_ANIMATION_HEAD" > animation-proof/generated/exact-current-animation-authority-head.txt
          printf '%s\n' "$EXACT_RUNTIME_HEAD" > animation-proof/generated/exact-runtime-head.txt
      - name: Validate exact dependency identity before target host
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('animation-proof/generated')
          t=json.loads((root/'uc-rigid-scene-handoff-receipt.json').read_text())
          s=json.loads((root/'lid-latch-motion-evidence.json').read_text())
          r=json.loads((root/'front-latch-articulation.receipt.json').read_text())
          sr=json.loads((root/'front-latch-source-rig-binding-evidence.json').read_text())
          a=json.loads((root/'animation-source-authority-rebind-evidence.json').read_text())
          assert t['result']=='PASS_OBJECT_SOURCE_OWNED_RIGID_PARTS_THROUGH_UC_SCENE_GRAPH',t
          assert t['source_repository_head']==os.environ['TECHNICAL_ART_HEAD'],t
          assert t['observed_uc_commit']==os.environ['UC_HEAD'],t
          assert s['result']=='PASS_ORDERED_LATCH_RELEASE_LID_CLIP_REENGAGE_SEQUENCE',s
          assert s['exact_receiving_head']==os.environ['PRIOR_ANIMATION_HEAD'],s
          assert s['host_source_sha256']==t['source_sha256'],(s,t)
          assert s['latch_rig_dependency_head']==os.environ['LATCH_RIG_HEAD'],s
          assert r['result']=='PASS_BOUNDED_FRONT_LATCH_LEVER_ARTICULATION',r
          assert r['host_source_sha256']==s['host_source_sha256'],(r,s)
          assert sr['result']=='PASS_SOURCE_OWNED_FRONT_LATCH_RIG_REBIND',sr
          assert sr['source_interface_head']==os.environ['SOURCE_INTERFACE_HEAD'],sr
          assert a['result']=='PASS_ANIMATION_SOURCE_AUTHORITY_REBIND_MOTION_EQUIVALENCE',a
          assert a['exact_receiving_head']==os.environ['CURRENT_ANIMATION_HEAD'],a
          assert a['prior_animation_head']==os.environ['PRIOR_ANIMATION_HEAD'],a
          assert a['prior_sequence_digest']==s['sequence_digest'],(a,s)
          assert a['current_source_interface_head']==os.environ['SOURCE_INTERFACE_HEAD'],a
          assert a['current_source_rig_head']==os.environ['SOURCE_RIG_HEAD'],a
          assert a['motion_change'] is False and a['retimed'] is False and a['retargeted'] is False and a['key_count_changed'] is False,a
          assert s['endpoint_inclusive_sample_count']==101 and s['sample_rate_hz']==40 and s['duration_s']==2.5,s
          print('exact Runtime dependency + current Animation source-authority gate PASS')
          PY
      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Measure dense versus lossless constant-span Animation key budget
        run: |
          set -euo pipefail
          rm -f animation-proof/runtime-animation-key-budget-receipt.json \
                animation-proof/runtime-animation-current-authority-budget-rebind.json \
                animation-proof/runtime-animation-dense-control.tres \
                animation-proof/runtime-animation-constant-span-compact.tres \
                animation-proof/runtime-key-budget-*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path animation-proof \
            --script observe_runtime_key_budget.gd
      - name: Compose current-authority Runtime budget receipt and fail-closed controls
        run: |
          python - <<'PY'
          import copy, json, os
          from pathlib import Path
          proof=Path('animation-proof')
          generated=proof/'generated'
          r=json.loads((proof/'runtime-animation-key-budget-receipt.json').read_text())
          a=json.loads((generated/'animation-source-authority-rebind-evidence.json').read_text())
          s=json.loads((generated/'lid-latch-motion-evidence.json').read_text())
          def compose(authority, target, sequence):
              assert authority['result']=='PASS_ANIMATION_SOURCE_AUTHORITY_REBIND_MOTION_EQUIVALENCE'
              assert authority['exact_receiving_head']==os.environ['CURRENT_ANIMATION_HEAD']
              assert authority['prior_animation_head']==os.environ['PRIOR_ANIMATION_HEAD']
              assert authority['prior_sequence_digest']==sequence['sequence_digest']==target['sequence_digest']
              assert authority['current_source_interface_head']==os.environ['SOURCE_INTERFACE_HEAD']
              assert authority['current_source_rig_head']==os.environ['SOURCE_RIG_HEAD']
              assert authority['motion_change'] is False and authority['retimed'] is False and authority['retargeted'] is False and authority['key_count_changed'] is False
              assert target['state']=='PASS_LOSSLESS_CONSTANT_SPAN_ANIMATION_KEY_COMPACTION'
              assert target['animation_sequence_head']==os.environ['PRIOR_ANIMATION_HEAD']
              assert target['sample_rate_hz']==40 and target['duration_s']==2.5 and target['endpoint_inclusive_sample_count']==101
              assert target['dense_key_counts']==[101,101,101] and target['compact_key_counts']==[64,22,22]
              assert target['dense_total_keys']==303 and target['compact_total_keys']==108 and target['keys_removed']==195
              assert target['comparison_time_count']==201
              assert target['max_rotation_delta_deg']<=1e-4 and target['max_world_mesh_center_delta_m']<=1e-6
              assert target['matched_capture_count']==5 and all(row['byte_identical_png'] for row in target['captures'])
              return {
                  'schema':'axm.object-runtime-animation-authority-key-budget-rebind/v0.1',
                  'result':'PASS_LOSSLESS_CONSTANT_SPAN_ANIMATION_KEY_COMPACTION_OVER_CURRENT_SOURCE_AUTHORITY',
                  'exact_runtime_head':os.environ['EXACT_RUNTIME_HEAD'],
                  'current_animation_authority_head':authority['exact_receiving_head'],
                  'prior_choreography_head':authority['prior_animation_head'],
                  'current_source_interface_head':authority['current_source_interface_head'],
                  'current_source_rig_head':authority['current_source_rig_head'],
                  'sequence_id':sequence['sequence_id'],
                  'sequence_digest':sequence['sequence_digest'],
                  'motion_change':False,
                  'retimed':False,
                  'retargeted':False,
                  'dense_total_keys':target['dense_total_keys'],
                  'compact_total_keys':target['compact_total_keys'],
                  'keys_removed':target['keys_removed'],
                  'key_reduction_percent':target['key_reduction_percent'],
                  'dense_serialized_resource_bytes':target['dense_serialized_resource_bytes'],
                  'compact_serialized_resource_bytes':target['compact_serialized_resource_bytes'],
                  'serialized_resource_bytes_removed':target['serialized_resource_bytes_removed'],
                  'serialized_resource_reduction_percent':target['serialized_resource_reduction_percent'],
                  'comparison_time_count':target['comparison_time_count'],
                  'max_rotation_delta_deg':target['max_rotation_delta_deg'],
                  'max_world_mesh_center_delta_m':target['max_world_mesh_center_delta_m'],
                  'matched_capture_count':target['matched_capture_count'],
                  'visual_tradeoff':target['visual_tradeoff'],
                  'target_host':'Godot 4.7.2 GL Compatibility',
                  'authority_binding_method':'CURRENT_ANIMATION_AUTHORITY_RECEIPT_PLUS_IDENTICAL_SEQUENCE_DIGEST_OVER_HISTORICAL_TARGET_REPRESENTATION',
                  'truth_boundary':{
                      'current_source_authority_proven':True,
                      'historical_target_representation_retained_not_relabelled':True,
                      'optimization_remeasured_on_exact_target_host':True,
                      'runtime_heap_or_vram_memory_measured':False,
                      'wall_clock_playback_or_scheduler_profiled':False,
                      'target_device_fps_or_gpu_time_measured':False,
                      'controller_or_gameplay_acceptance':False,
                      'final_animation_or_art_direction_acceptance':False
                  }
              }
          report=compose(a,r,s)
          bad=copy.deepcopy(a); bad['prior_sequence_digest']='0'*64
          try: compose(bad,r,s)
          except AssertionError: pass
          else: raise AssertionError('sequence-authority drift negative control did not fail')
          bad=copy.deepcopy(a); bad['current_source_rig_head']='0'*40
          try: compose(bad,r,s)
          except AssertionError: pass
          else: raise AssertionError('source-rig authority drift negative control did not fail')
          (proof/'runtime-animation-current-authority-budget-rebind.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Validate exact Runtime key-budget receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('animation-proof')
          r=json.loads((root/'runtime-animation-key-budget-receipt.json').read_text())
          c=json.loads((root/'runtime-animation-current-authority-budget-rebind.json').read_text())
          assert r['state']=='PASS_LOSSLESS_CONSTANT_SPAN_ANIMATION_KEY_COMPACTION',r
          assert r['technical_art_object_head']==os.environ['TECHNICAL_ART_HEAD'],r
          assert r['uc_commit']==os.environ['UC_HEAD'],r
          assert r['animation_sequence_head']==os.environ['PRIOR_ANIMATION_HEAD'],r
          assert r['sample_rate_hz']==40 and r['duration_s']==2.5 and r['endpoint_inclusive_sample_count']==101,r
          assert r['dense_key_counts']==[101,101,101],r
          assert r['compact_key_counts']==[64,22,22],r
          assert r['dense_total_keys']==303 and r['compact_total_keys']==108 and r['keys_removed']==195,r
          assert r['key_reduction_percent'] > 64.0,r
          assert r['dense_serialized_resource_bytes'] > r['compact_serialized_resource_bytes'] > 0,r
          assert r['serialized_resource_bytes_removed'] > 0,r
          assert r['comparison_time_count']==201,r
          assert r['max_rotation_delta_deg']<=1e-4,r
          assert r['max_world_mesh_center_delta_m']<=1e-6,r
          assert r['neutral_pivot_wrapper_max_drift_m']<=1e-6,r
          assert r['matched_capture_count']==5,r
          assert all(row['byte_identical_png'] for row in r['captures']),r
          assert r['visual_tradeoff']=='NONE_OBSERVED_FIVE_MATCHED_PNG_PAIRS_BYTE_IDENTICAL',r
          assert c['result']=='PASS_LOSSLESS_CONSTANT_SPAN_ANIMATION_KEY_COMPACTION_OVER_CURRENT_SOURCE_AUTHORITY',c
          assert c['current_animation_authority_head']==os.environ['CURRENT_ANIMATION_HEAD'],c
          assert c['current_source_interface_head']==os.environ['SOURCE_INTERFACE_HEAD'],c
          assert c['current_source_rig_head']==os.environ['SOURCE_RIG_HEAD'],c
          assert r['truth_boundary']['runtime_heap_or_vram_memory_measured'] is False,r
          assert r['truth_boundary']['wall_clock_playback_or_scheduler_profiled'] is False,r
          assert r['truth_boundary']['target_device_fps_or_gpu_time_measured'] is False,r
          for i in range(5):
              a=root/f'runtime-key-budget-dense-{i:02d}.png'
              b=root/f'runtime-key-budget-compact-{i:02d}.png'
              assert a.stat().st_size>3000 and b.stat().st_size>3000,(a,b)
              assert a.read_bytes()==b.read_bytes(),(a,b)
          print(json.dumps(c,indent=2))
          PY
      - name: Retain exact Runtime Animation key-budget evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-runtime-animation-key-budget-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            animation-proof/generated/object-rigid-components-rebound.glb
            animation-proof/generated/uc-rigid-scene-handoff-receipt.json
            animation-proof/generated/lid-latch-motion-evidence.json
            animation-proof/generated/front-latch-articulation.receipt.json
            animation-proof/generated/front-latch-source-rig-binding-evidence.json
            animation-proof/generated/animation-source-authority-rebind-evidence.json
            animation-proof/generated/exact-prior-animation-donor-head.txt
            animation-proof/generated/exact-current-animation-authority-head.txt
            animation-proof/generated/exact-runtime-head.txt
            animation-proof/runtime-animation-key-budget-receipt.json
