name: Object Animation hinge parent debug
on:
  pull_request:
    paths:
      - '.github/workflows/object-animation-hinge-parent-debug.yml'
      - 'animation-proof/observe_hinge_knuckle_parent_motion.gd'
permissions:
  contents: read
  actions: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download prior structural evidence
        uses: actions/download-artifact@v4
        with:
          name: object-animation-hinge-knuckle-parent-motion-v2-bef1ea96c7fcdf734d7a9902bc86c964cadbce16
          path: prior
          run-id: 35292218205
          github-token: ${{ github.token }}
      - name: Restore generated Godot input
        run: |
          mkdir -p animation-proof/generated/hinge-knuckle-parent-motion
          cp prior/animation-proof/generated/hinge-knuckle-parent-motion/godot-input.json animation-proof/generated/hinge-knuckle-parent-motion/godot-input.json
      - name: Download pinned Godot
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          mkdir -p .godot-bin
          curl --fail --location "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum -c -
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Print negative-control Godot output
        run: |
          code=0
          (cd animation-proof && AXM_MUTATE_PARENT=b1 ../.godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script observe_hinge_knuckle_parent_motion.gd) > /tmp/negative.log 2>&1 || code=$?
          cat /tmp/negative.log
          echo "NEGATIVE_EXIT=$code"
          exit 0
      - name: Print positive Godot output
        run: |
          code=0
          rm -f animation-proof/hinge-knuckle-parent-motion-godot-receipt.json
          (cd animation-proof && ../.godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script observe_hinge_knuckle_parent_motion.gd) > /tmp/positive.log 2>&1 || code=$?
          cat /tmp/positive.log
          echo "POSITIVE_EXIT=$code"
          cat animation-proof/hinge-knuckle-parent-motion-godot-receipt.json 2>/dev/null || true
          exit 0
