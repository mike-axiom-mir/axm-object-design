name: Object service-surface rig frame binding

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-surface-rig-frame-binding:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact receiving Rigging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: object
          fetch-depth: 0

      - name: Preserve previous Rigging ancestry
        working-directory: object
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ab0391f2e85ba80c8731af118bcfda2424215f9c HEAD

      - name: Checkout exact Hard-Surface service-frame donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: 6a9593b942e7cda4befe8106bfb8cc260e3e6b5f
          path: hard-surface-donor

      - name: Checkout exact historical lid-articulation donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: 4b72c9918c5fc1e89bd18a0be24fb4afac6e7775
          path: lid-rig-donor

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify exact donor identities
        run: |
          set -euo pipefail
          test "$(git -C hard-surface-donor rev-parse HEAD)" = "6a9593b942e7cda4befe8106bfb8cc260e3e6b5f"
          test "$(git -C hard-surface-donor hash-object assets/modular-equipment-case-001/service-surface-reference-frames-001.json)" = "ffb0671eac025f0d39eeb412b58e0ae017e21d99"
          test "$(git -C lid-rig-donor rev-parse HEAD)" = "4b72c9918c5fc1e89bd18a0be24fb4afac6e7775"

      - name: Compile and run full Object regression suite
        working-directory: object
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Build exact service-surface rig-frame evidence
        if: matrix.python-version == '3.11'
        working-directory: object
        env:
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -rf evidence/service-surface-rig-frame-binding-001
          python tools/verify_service_surface_rig_frame_binding.py \
            --source assets/modular-equipment-case-001/source.json \
            --reference-frames ../hard-surface-donor/assets/modular-equipment-case-001/service-surface-reference-frames-001.json \
            --lid-plan ../lid-rig-donor/assets/modular-equipment-case-001/articulation.json \
            --observed-reference-frame-head 6a9593b942e7cda4befe8106bfb8cc260e3e6b5f \
            --observed-reference-frame-blob ffb0671eac025f0d39eeb412b58e0ae017e21d99 \
            --observed-lid-rig-head 4b72c9918c5fc1e89bd18a0be24fb4afac6e7775 \
            --observed-previous-rigging-head ab0391f2e85ba80c8731af118bcfda2424215f9c \
            --out evidence/service-surface-rig-frame-binding-001
          printf '%s\n' "$CURRENT_HEAD" > evidence/service-surface-rig-frame-binding-001/exact-head.txt
          printf '%s\n' '6a9593b942e7cda4befe8106bfb8cc260e3e6b5f' > evidence/service-surface-rig-frame-binding-001/hard-surface-reference-frame-head.txt
          printf '%s\n' 'ffb0671eac025f0d39eeb412b58e0ae017e21d99' > evidence/service-surface-rig-frame-binding-001/hard-surface-reference-frame-blob.txt
          printf '%s\n' '4b72c9918c5fc1e89bd18a0be24fb4afac6e7775' > evidence/service-surface-rig-frame-binding-001/lid-rig-head.txt
          printf '%s\n' 'ab0391f2e85ba80c8731af118bcfda2424215f9c' > evidence/service-surface-rig-frame-binding-001/previous-rigging-head.txt
          cp ../hard-surface-donor/assets/modular-equipment-case-001/service-surface-reference-frames-001.json evidence/service-surface-rig-frame-binding-001/service-surface-reference-frames.json
          cp ../lid-rig-donor/assets/modular-equipment-case-001/articulation.json evidence/service-surface-rig-frame-binding-001/lid-articulation-plan.json

      - name: Prove fail-closed one-millimetre posed-frame drift
        if: matrix.python-version == '3.11'
        working-directory: object
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from verify_service_surface_rig_frame_binding import verify, sha256_file

          source_path = Path('assets/modular-equipment-case-001/source.json')
          frame_path = Path('../hard-surface-donor/assets/modular-equipment-case-001/service-surface-reference-frames-001.json')
          plan_path = Path('../lid-rig-donor/assets/modular-equipment-case-001/articulation.json')
          source = json.loads(source_path.read_text())
          frames = json.loads(frame_path.read_text())
          plan = json.loads(plan_path.read_text())
          try:
              verify(
                  source,
                  frames,
                  plan,
                  source_sha256=sha256_file(source_path),
                  observed_reference_frame_head='6a9593b942e7cda4befe8106bfb8cc260e3e6b5f',
                  observed_reference_frame_blob='ffb0671eac025f0d39eeb412b58e0ae017e21d99',
                  observed_lid_rig_head='4b72c9918c5fc1e89bd18a0be24fb4afac6e7775',
                  observed_previous_rigging_head='ab0391f2e85ba80c8731af118bcfda2424215f9c',
                  pose_origin_delta_override={
                      'angle': 60,
                      'surface_id': 'lid_inner_service_surface',
                      'delta_m': [0.001, 0.0, 0.0],
                  },
              )
          except AssertionError as exc:
              text = str(exc)
              assert 'lid frame origin local recovery drift' in text
              Path('evidence/service-surface-rig-frame-binding-001/negative-control.txt').write_text(
                  'PASS_FAILS_CLOSED_ON_1MM_POSED_LID_FRAME_ORIGIN_DRIFT\n' + text + '\n'
              )
          else:
              raise SystemExit('negative control unexpectedly passed')
          PY

      - name: Assert truth boundary remains explicit
        if: matrix.python-version == '3.11'
        working-directory: object
        run: |
          grep -q 'PASS_SOURCE_OWNED_SERVICE_SURFACE_RIG_FRAME_BINDING_111_POSES' evidence/service-surface-rig-frame-binding-001/receipt.json
          grep -q '"animation_accepted": false' evidence/service-surface-rig-frame-binding-001/receipt.json
          grep -q '"runtime_accepted": false' evidence/service-surface-rig-frame-binding-001/receipt.json
          grep -q '"technical_art_transport_accepted": false' evidence/service-surface-rig-frame-binding-001/receipt.json
          grep -q '"production_uv_adopted": false' evidence/service-surface-rig-frame-binding-001/receipt.json
          grep -q 'PASS_FAILS_CLOSED_ON_1MM_POSED_LID_FRAME_ORIGIN_DRIFT' evidence/service-surface-rig-frame-binding-001/negative-control.txt

      - name: Upload exact Rigging evidence
        if: ${{ always() && matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: object-service-surface-rig-frame-binding-${{ github.event.pull_request.head.sha || github.sha }}
          path: object/evidence/service-surface-rig-frame-binding-001
          if-no-files-found: error
          retention-days: 30
