name: Object front service-panel UV source-identity rebind evidence

on:
  push:
    branches: [studio/materials-object-functional-surface-001]
    paths:
      - "lookdev/front_service_panel_uv_source_identity_rebind_001.json"
      - "tools/verify_front_service_panel_uv_source_identity_rebind.py"
      - ".github/workflows/object-front-service-panel-uv-source-rebind.yml"
      - "lookdev/front_service_panel_uv_review_001.json"
      - "tools/build_object_front_service_panel_uv_evidence.py"
      - "lookdev-proof/front_service_panel_uv_observe.gd"
  pull_request:
    paths:
      - "lookdev/front_service_panel_uv_source_identity_rebind_001.json"
      - "tools/verify_front_service_panel_uv_source_identity_rebind.py"
      - ".github/workflows/object-front-service-panel-uv-source-rebind.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-identity-rebind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact Materials head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact Materials head
        run: |
          mkdir -p lookdev-proof/generated
          git rev-parse HEAD > lookdev-proof/generated/front-service-panel-uv-source-rebind-exact-head.txt
          test "$(cat lookdev-proof/generated/front-service-panel-uv-source-rebind-exact-head.txt)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and run complete Object suite
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Materialize exact Hard-Surface surface-identity donor
        run: |
          set -euo pipefail
          DONOR_HEAD=fcae744a8bdbcb765c32758e9da03fe54ffe4dbc
          DONOR_PATH=assets/modular-equipment-case-001/front-service-panel-outer-surface-identity-001.json
          DONOR_BLOB=503b0179f20351a66668cbad3122e5dea26957b9
          DONOR_SHA256=031352b65fd497f6d62f20bc61236a78196819d74383b52c607d05ba5601a908
          git fetch origin "$DONOR_HEAD" --depth=1
          git cat-file -e "$DONOR_HEAD^{commit}"
          observed_blob="$(git rev-parse "$DONOR_HEAD:$DONOR_PATH")"
          test "$observed_blob" = "$DONOR_BLOB"
          git show "$DONOR_HEAD:$DONOR_PATH" > /tmp/front-service-panel-outer-surface-identity-001.json
          echo "$DONOR_SHA256  /tmp/front-service-panel-outer-surface-identity-001.json" | sha256sum --check --strict
          cp /tmp/front-service-panel-outer-surface-identity-001.json lookdev-proof/generated/front-service-panel-outer-surface-identity-donor.json
          printf '%s\n' "$DONOR_HEAD" > lookdev-proof/generated/front-service-panel-surface-owner-head.txt
          printf '%s\n' "$DONOR_BLOB" > lookdev-proof/generated/front-service-panel-surface-owner-blob.txt

      - name: Verify exact source-owned UV rebind
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/verify_front_service_panel_uv_source_identity_rebind.py \
            --surface-contract /tmp/front-service-panel-outer-surface-identity-001.json \
            --exact-head "$HEAD_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('lookdev-proof/generated/front_service_panel_uv_source_identity_rebind_receipt.json')
          r=json.loads(p.read_text())
          assert r['result']=='PASS_OBJECT_FRONT_SERVICE_PANEL_UV_SOURCE_IDENTITY_REBIND',r
          assert r['exact_materials_head']==os.environ['HEAD_SHA'],r
          assert r['historical_materials_review_head']=='04c521a5a7e31bef54093c818108fd6c2080ca0e',r
          assert r['surface_owner_head']=='fcae744a8bdbcb765c32758e9da03fe54ffe4dbc',r
          assert r['surface_owner_blob']=='503b0179f20351a66668cbad3122e5dea26957b9',r
          assert r['surface_contract_sha256']=='031352b65fd497f6d62f20bc61236a78196819d74383b52c607d05ba5601a908',r
          assert r['source_surface_id']=='front_service_panel_outer_service_surface',r
          assert r['selector']=='source_local_min_y_face',r
          assert r['surface_triangle_count']==2,r
          assert r['surface_unique_vertex_count']==4,r
          assert r['candidate_meters_per_uv_unit']==[0.05,0.05],r
          assert r['historical_review_preserved_selector_only'] is True,r
          assert r['source_surface_identity_now_available'] is True,r
          assert r['materials_authors_surface_identity'] is False,r
          assert r['source_material_assignment']=='UNASSIGNED',r
          assert r['source_uv_assignment']=='UNASSIGNED',r
          assert r['production_uv_adopted'] is False,r
          assert r['material_scalars_changed'] is False,r
          print(json.dumps(r,indent=2))
          PY

      - name: Fail closed on source-surface identity drift
        if: matrix.python-version == '3.11'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('/tmp/front-service-panel-outer-surface-identity-001.json')
          data=json.loads(src.read_text())
          data['surface_id']='front_service_panel_outer_service_surface_DRIFT'
          Path('/tmp/front-service-panel-outer-surface-identity-bad.json').write_text(json.dumps(data))
          PY
          if python tools/verify_front_service_panel_uv_source_identity_rebind.py \
            --surface-contract /tmp/front-service-panel-outer-surface-identity-bad.json \
            --exact-head "$HEAD_SHA" \
            --out /tmp/bad-rebind-receipt.json; then
            echo "source-surface identity drift unexpectedly passed" >&2
            exit 1
          fi

      - name: Rebuild unchanged historical UV diagnostic packet
        if: matrix.python-version == '3.11'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/build_object_front_service_panel_uv_evidence.py --exact-head "$HEAD_SHA"

      - name: Download pinned Godot 4.7.2
        if: matrix.python-version == '3.11'
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        if: matrix.python-version == '3.11'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Rerender source-rebound UV control candidate and anisotropic negative
        if: matrix.python-version == '3.11'
        run: |
          set -euo pipefail
          rm -f lookdev-proof/front-service-panel-uv-runtime-receipt.json lookdev-proof/front-service-panel-uv-*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path lookdev-proof \
            --script front_service_panel_uv_observe.gd

      - name: Validate real target-host recheck
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          root=Path('lookdev-proof')
          r=json.loads((root/'front-service-panel-uv-runtime-receipt.json').read_text())
          assert r['state']=='PASS_TARGET_HOST_FRONT_SERVICE_PANEL_ISOTROPIC_UV_DIAGNOSTIC_CAPTURED',r
          assert r['promotion_effect']=='NONE',r
          assert r['candidate_visible_contexts']==3,r
          assert r['negative_control_visible_contexts']==3,r
          assert math.isclose(r['uv_candidate']['density_anisotropy'],1.0,abs_tol=1e-12),r
          assert math.isclose(r['negative_control']['density_anisotropy'],3.0,abs_tol=1e-12),r
          assert set(r['contexts'])=={'front_service','three_quarter','grazing_service'},r
          for context,row in r['contexts'].items():
              for mode in ('legacy_uniform','split_uniform','uv_candidate','uv_negative_stretched'):
                  assert row[mode]['state']=='PASS',(context,mode,row)
                  path=root/f'front-service-panel-uv-{context}-{mode}.png'
                  assert path.stat().st_size>2000,path
              assert row['split_representation_difference']['changed_fraction']<=0.001,(context,row)
              assert row['candidate_diagnostic_difference']['changed_pixels']>0,(context,row)
              assert row['negative_control_difference']['changed_pixels']>0,(context,row)
          assert r['truth_boundary']['production_uv_authored'] is False,r
          assert r['truth_boundary']['texture_asset_authored'] is False,r
          assert r['truth_boundary']['material_scalars_changed'] is False,r
          assert r['truth_boundary']['art_direction_accepted'] is False,r
          assert r['truth_boundary']['visual_qa_accepted'] is False,r
          print(json.dumps(r,indent=2))
          PY

      - name: Retain exact source-identity rebind evidence
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: object-front-service-panel-uv-source-rebind-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lookdev/front_service_panel_uv_source_identity_rebind_001.json
            lookdev/front_service_panel_uv_review_001.json
            lookdev/object_material_profile_001.json
            assets/modular-equipment-case-001/source.json
            tools/verify_front_service_panel_uv_source_identity_rebind.py
            lookdev-proof/front_service_panel_uv_observe.gd
            lookdev-proof/generated/front-service-panel-uv-source-rebind-exact-head.txt
            lookdev-proof/generated/front-service-panel-surface-owner-head.txt
            lookdev-proof/generated/front-service-panel-surface-owner-blob.txt
            lookdev-proof/generated/front-service-panel-outer-surface-identity-donor.json
            lookdev-proof/generated/front_service_panel_uv_source_identity_rebind_receipt.json
            lookdev-proof/generated/front_service_panel_uv_payload.json
            lookdev-proof/generated/front_service_panel_uv_build_receipt.json
            lookdev-proof/front-service-panel-uv-runtime-receipt.json
            lookdev-proof/front-service-panel-uv-*.png
          if-no-files-found: warn
          retention-days: 30
