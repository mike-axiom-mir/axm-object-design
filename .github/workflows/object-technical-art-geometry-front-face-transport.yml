name: Object Technical Art Geometry front-face transport

on:
  pull_request:
    paths:
      - "tools/build_object_geometry_front_face_transport.py"
      - "rigid-proof/front_face_transport_observe.gd"
      - ".github/workflows/object-technical-art-geometry-front-face-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  front-face-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact Technical Art receiving head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout exact Geometry orientation owner
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: 606d8189a3bf4502141d8038f08d35d421829dde
          path: .geometry
          fetch-depth: 1

      - name: Checkout exact Hard Surface exterior-intent owner
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: 77a4058b305fab7fd04dab94781b9460f089727e
          path: .hard-surface
          fetch-depth: 1

      - name: Checkout exact current Universal Creation
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: 7be1a28c43a88c7e40f7d0c039aefd753d5e70d9
          path: .uc
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and run complete Technical Art branch Object suite
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Rebuild exact Geometry candidate and source-owner exterior intent
        run: |
          rm -rf rigid-proof/front-face-generated
          mkdir -p rigid-proof/front-face-generated
          PYTHONPATH=.geometry python .geometry/tools/verify_rigid_shell_orientation.py \
            --source .geometry/assets/modular-equipment-case-001/source.json \
            --policy .geometry/assets/modular-equipment-case-001/rigid-shell-orientation-review-001.json \
            --receipt rigid-proof/front-face-generated/geometry-orientation-receipt.json \
            --obj rigid-proof/front-face-generated/geometry33-orientation-candidate.obj
          PYTHONPATH=.hard-surface python .hard-surface/tools/verify_rigid_shell_exterior_intent.py \
            --source .hard-surface/assets/modular-equipment-case-001/source.json \
            --contract .hard-surface/assets/modular-equipment-case-001/rigid-shell-exterior-intent-001.json \
            --builder .hard-surface/tools/build_modular_case.py \
            --geometry-candidate-obj rigid-proof/front-face-generated/geometry33-orientation-candidate.obj \
            --geometry-head 606d8189a3bf4502141d8038f08d35d421829dde \
            --receipt rigid-proof/front-face-generated/hard-surface-exterior-intent-receipt.json

      - name: Build parity-correct and fail-closed current-UC GLBs
        env:
          PYTHONPATH: .:.uc/src
        run: |
          python tools/build_object_geometry_front_face_transport.py \
            --geometry-candidate-obj rigid-proof/front-face-generated/geometry33-orientation-candidate.obj \
            --geometry-receipt rigid-proof/front-face-generated/geometry-orientation-receipt.json \
            --hard-surface-receipt rigid-proof/front-face-generated/hard-surface-exterior-intent-receipt.json \
            --uc-root .uc \
            --expected-uc-commit 7be1a28c43a88c7e40f7d0c039aefd753d5e70d9 \
            --out rigid-proof/front-face-generated
          git rev-parse HEAD > rigid-proof/front-face-generated/exact-technical-art-head.txt
          git -C .uc rev-parse HEAD > rigid-proof/front-face-generated/exact-uc-head.txt
          git -C .geometry rev-parse HEAD > rigid-proof/front-face-generated/exact-geometry-head.txt
          git -C .hard-surface rev-parse HEAD > rigid-proof/front-face-generated/exact-hard-surface-head.txt

      - name: Validate exact transport receipt and negative
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("rigid-proof/front-face-generated")
          r=json.loads((root/"front-face-transport-receipt.json").read_text())
          assert r["result"]=="PASS_OBJECT_GEOMETRY33_SOURCE_EXTERIOR_TO_CURRENT_UC_GLTF_PARITY_BRIDGE_READY",r
          assert r["geometry_exact_head"]==(root/"exact-geometry-head.txt").read_text().strip()=="606d8189a3bf4502141d8038f08d35d421829dde",r
          assert r["hard_surface_exact_head"]==(root/"exact-hard-surface-head.txt").read_text().strip()=="77a4058b305fab7fd04dab94781b9460f089727e",r
          assert r["uc_exact_head"]==(root/"exact-uc-head.txt").read_text().strip()=="7be1a28c43a88c7e40f7d0c039aefd753d5e70d9",r
          assert r["technical_art_repository_head"]==(root/"exact-technical-art-head.txt").read_text().strip(),r
          assert r["hard_surface_geometry_faces_matching_exterior_intent"]==812,r
          assert r["hard_surface_geometry_face_mismatches"]==0,r
          assert r["corrected_transport"]["source_to_uc_position_map_determinant"]==-1,r
          assert r["corrected_transport"]["winding_reversal_faces"]==812,r
          assert r["corrected_transport"]["minimum_face_normal_alignment_to_mapped_source_exterior"]>=1.0-1e-12,r
          assert r["unadapted_negative_control"]["winding_reversal_faces"]==0,r
          assert r["unadapted_negative_control"]["maximum_face_normal_alignment_to_mapped_source_exterior"]<=-1.0+1e-12,r
          assert r["corrected_transport"]["closed_static_localization_max_error_m"]<=1e-12,r
          assert r["unadapted_negative_control"]["closed_static_localization_max_error_m"]<=1e-12,r
          assert r["truth_boundary"]["uc_modified"] is False,r
          assert r["target_host_observed"] is False,r
          print(json.dumps(r,indent=2))
          PY

      - name: Download pinned Godot 4.7.2
        if: matrix.python-version == '3.11'
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        if: matrix.python-version == '3.11'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Observe exact current-UC GLBs through real Godot front-face culling
        if: matrix.python-version == '3.11'
        run: |
          rm -f rigid-proof/front-face-target-receipt.json rigid-proof/front-face-*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path rigid-proof \
            --script front_face_transport_observe.gd

      - name: Validate real target front-face result
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("rigid-proof/front-face-target-receipt.json")
          r=json.loads(p.read_text())
          assert r["state"]=="PASS_EVIDENCE",r
          assert r["result"]=="PASS_OBJECT_GEOMETRY33_CURRENT_UC_GLTF_GODOT_FRONT_FACE_PARITY_ADAPTATION",r
          assert r["two_sided_spatial_identity_all_contexts"] is True,r
          assert r["corrected_cull_coherence_all_contexts"] is True,r
          assert r["unadapted_negative_detected_all_contexts"] is True,r
          assert r["aggregate_corrected_back_vs_two_sided_gt1"]<=48,r
          assert r["aggregate_unadapted_back_vs_two_sided_gt1"]>r["aggregate_corrected_back_vs_two_sided_gt1"]+3000,r
          assert r["aggregate_corrected_vs_unadapted_back_gt1"]>3000,r
          assert r["truth_boundary"]["global_renderer_winding_rule_claimed"] is False,r
          assert r["truth_boundary"]["source_geometry_adopted"] is False,r
          print(json.dumps(r,indent=2))
          PY

      - name: Retain exact front-face transport evidence
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: object-technical-art-front-face-transport-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            rigid-proof/front-face-generated/geometry33-orientation-candidate.obj
            rigid-proof/front-face-generated/geometry-orientation-receipt.json
            rigid-proof/front-face-generated/hard-surface-exterior-intent-receipt.json
            rigid-proof/front-face-generated/geometry33-parity-corrected-rebound.glb
            rigid-proof/front-face-generated/geometry33-unadapted-rebound.glb
            rigid-proof/front-face-generated/front-face-transport-receipt.json
            rigid-proof/front-face-generated/transport-manifest.json
            rigid-proof/front-face-generated/exact-technical-art-head.txt
            rigid-proof/front-face-generated/exact-uc-head.txt
            rigid-proof/front-face-generated/exact-geometry-head.txt
            rigid-proof/front-face-generated/exact-hard-surface-head.txt
            rigid-proof/front-face-target-receipt.json
            rigid-proof/front-face-*.png
          if-no-files-found: warn
          retention-days: 30
