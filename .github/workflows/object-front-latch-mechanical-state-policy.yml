name: Object front-latch mechanical-state policy evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_INTERFACE_HEAD: 6086f39a3da344c57a68653f90d040e03e04cec2
  ANIMATION_GUARD_HEAD: 9725eb2ddde3b79c73bfdbbaef7c0e14da6af1a7

jobs:
  regression:
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run full Object regression suite
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

  mechanical-state-policy:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact receiving Hard-Surface head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: object
          fetch-depth: 0

      - name: Checkout exact Animation phase-guard donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.ANIMATION_GUARD_HEAD }}
          path: animation-donor

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind exact receiving and donor identities
        working-directory: object
        run: |
          set -euo pipefail
          echo "EXACT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$SOURCE_INTERFACE_HEAD" HEAD
          test "$(sha256sum assets/modular-equipment-case-001/front-latch-pivot-interface-001.json | awk '{print $1}')" = "bcbbe098371eb702bc9289a97370744093105925202eda6036bdced6e25e34d3"
          test "$(sha256sum ../animation-donor/assets/modular-equipment-case-001/animation-mechanical-phase-guard-001.json | awk '{print $1}')" = "cfc75666bc15eb94301a0dd03743265b37595aab4cd5aebae2c3aed617f80fb0"

      - name: Build exact source-owned mechanical-state evidence
        working-directory: object
        run: |
          set -euo pipefail
          rm -rf evidence/front-latch-mechanical-state-policy-001
          python tools/verify_front_latch_mechanical_state_policy.py \
            --interface assets/modular-equipment-case-001/front-latch-pivot-interface-001.json \
            --animation-guard ../animation-donor/assets/modular-equipment-case-001/animation-mechanical-phase-guard-001.json \
            --policy assets/modular-equipment-case-001/front-latch-mechanical-state-policy-001.json \
            --observed-interface-head "$SOURCE_INTERFACE_HEAD" \
            --observed-animation-head "$ANIMATION_GUARD_HEAD" \
            --out evidence/front-latch-mechanical-state-policy-001
          cp assets/modular-equipment-case-001/front-latch-pivot-interface-001.json evidence/front-latch-mechanical-state-policy-001/source-interface.json
          cp assets/modular-equipment-case-001/front-latch-mechanical-state-policy-001.json evidence/front-latch-mechanical-state-policy-001/mechanical-state-policy.json
          cp ../animation-donor/assets/modular-equipment-case-001/animation-mechanical-phase-guard-001.json evidence/front-latch-mechanical-state-policy-001/animation-phase-guard-donor.json
          printf '%s\n' "$EXACT_HEAD" > evidence/front-latch-mechanical-state-policy-001/exact-head.txt
          printf '%s\n' "$SOURCE_INTERFACE_HEAD" > evidence/front-latch-mechanical-state-policy-001/source-interface-head.txt
          printf '%s\n' "$ANIMATION_GUARD_HEAD" > evidence/front-latch-mechanical-state-policy-001/animation-guard-head.txt

      - name: Prove fail-closed unreleased lid motion with expected signature
        working-directory: object
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('assets/modular-equipment-case-001/front-latch-mechanical-state-policy-001.json')
          bad = json.loads(source.read_text())
          bad['mechanical_states'][0]['lid_motion_allowed'] = True
          Path('/tmp/bad-mechanical-state-policy.json').write_text(json.dumps(bad, indent=2) + '\n')
          PY
          set +e
          python tools/verify_front_latch_mechanical_state_policy.py \
            --interface assets/modular-equipment-case-001/front-latch-pivot-interface-001.json \
            --animation-guard ../animation-donor/assets/modular-equipment-case-001/animation-mechanical-phase-guard-001.json \
            --policy /tmp/bad-mechanical-state-policy.json \
            --observed-interface-head "$SOURCE_INTERFACE_HEAD" \
            --observed-animation-head "$ANIMATION_GUARD_HEAD" \
            --out /tmp/bad-mechanical-state-evidence \
            > /tmp/mechanical-state-negative.stdout 2> /tmp/mechanical-state-negative.stderr
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'negative control unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'UNRELEASED_LID_MOTION_ALLOWED' /tmp/mechanical-state-negative.stderr
          printf '%s\n' 'PASS_FAILS_CLOSED_ON_UNRELEASED_LID_MOTION_WITH_EXPECTED_SIGNATURE' > evidence/front-latch-mechanical-state-policy-001/negative-control.txt
          cp /tmp/mechanical-state-negative.stderr evidence/front-latch-mechanical-state-policy-001/negative-control.stderr.txt

      - name: Assert truth boundary remains explicit
        working-directory: object
        run: |
          set -euo pipefail
          grep -q 'PASS_SOURCE_OWNED_FRONT_LATCH_MECHANICAL_STATE_GUARD' evidence/front-latch-mechanical-state-policy-001/receipt.json
          grep -q '"intentional_neutral_engagement_overlap_preserved": true' evidence/front-latch-mechanical-state-policy-001/receipt.json
          grep -q '"continuous_latch_release_clearance_proven": false' evidence/front-latch-mechanical-state-policy-001/receipt.json
          grep -q '"continuous_latch_reengagement_clearance_proven": false' evidence/front-latch-mechanical-state-policy-001/receipt.json
          grep -q '"animation_timing_owned": false' evidence/front-latch-mechanical-state-policy-001/receipt.json
          grep -q '"runtime_controller_owned": false' evidence/front-latch-mechanical-state-policy-001/receipt.json
          grep -q 'PASS_FAILS_CLOSED_ON_UNRELEASED_LID_MOTION_WITH_EXPECTED_SIGNATURE' evidence/front-latch-mechanical-state-policy-001/negative-control.txt

      - name: Upload exact Hard-Surface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-front-latch-mechanical-state-${{ github.event.pull_request.head.sha || github.sha }}
          path: object/evidence/front-latch-mechanical-state-policy-001
          if-no-files-found: error
          retention-days: 30
