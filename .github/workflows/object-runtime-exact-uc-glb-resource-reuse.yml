name: Object Runtime exact UC GLB moving-resource reuse evidence

on:
  pull_request:
    paths:
      - 'runtime/object_exact_uc_glb_resource_reuse_contract_002.json'
      - 'runtime-proof/exact_uc_glb_resource_reuse_observe.gd'
      - 'runtime-proof/project.godot'
      - 'tools/verify_object_exact_uc_glb_resource_reuse.py'
      - 'tests/test_object_exact_uc_glb_resource_reuse.py'
      - '.github/workflows/object-runtime-exact-uc-glb-resource-reuse.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIOR_RUNTIME_HEAD: 2c1d6005124b2fc1cdb57667b251e5273ee80d27
  TA_RUNTIME_BRIDGE_HEAD: 08142be386016813e9cb10faff8b7aed0239e5b6
  ANIMATION_AUTHORITY_HEAD: 86bdbe9771bf9eb1bc92bd4160442941763fab1d
  PRIOR_TECHNICAL_ART_BRIDGE_HEAD: 8633fdcb367ae4d32146b5696142d0946716fe76
  HISTORICAL_TECHNICAL_ART_HEAD: 965fb2f24dbd0b0cbb748d9f8b8712d62966315f
  TECHNICAL_ART_HEAD: b9848c62b2adde84e9e0afc219088113216799d6
  TECHNICAL_ART_REBOUND_GLB_SHA256: 9788bc7d405b1837961409de20bc9f76d72facae63726cdc7bf7a3ffd2ac3914
  UC_RIGID_HEAD: 6dc465987e01362264f88b7cef4213609ae50763
  UC_RUNTIME_HEAD: dde8d952161788f8bf21118f91edd3163e51277d
  UC_RUNTIME_MODULE_GIT_BLOB_SHA: a5f1bf407eb6c4b5be1c5e7f19bed1001ff94173
  LID_TARGET_RIG_HEAD: f6dab93a342330175a7494274f3f40a4e53d4c85
  LATCH_TARGET_RIG_HEAD: f59e0f205de2d81611cfed0cbf795faa2c3f22b3
  CURRENT_LATCH_SOURCE_RIG_HEAD: 3a17a02528918ec63a46e954e883179f752c8151
  LID_RIG_HEAD: 4b72c9918c5fc1e89bd18a0be24fb4afac6e7775
  LATCH_RIG_HEAD: 3b667ff5d30c46ec2fe7da7679518970f8610018
  LATCH_OWNERSHIP_HEAD: d3fa10a270faae7925811f44f03381fe5c5d0215
  LATCH_RIG_PLAN_SHA256: 81c27ab7b73ed9a43cb3f554b56c3f4294b893712075e33d13f5b02e008455db
  LATCH_OWNERSHIP_SHA256: 0702e4180f858d29c42ff8c38a61eaa16278d6848c8ce6f3ecfae172969ca8ae

jobs:
  exact-uc-glb-moving-resource-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Runtime convergence head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact Object head
        run: echo "EXACT_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Preserve current Animation and prior Technical Art ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags origin 86bdbe9771bf9eb1bc92bd4160442941763fab1d 8633fdcb367ae4d32146b5696142d0946716fe76
          git merge-base --is-ancestor "$ANIMATION_AUTHORITY_HEAD" HEAD
          git merge-base --is-ancestor "$PRIOR_TECHNICAL_ART_BRIDGE_HEAD" HEAD
          git merge-base --is-ancestor "$TA_RUNTIME_BRIDGE_HEAD" HEAD
          git merge-base --is-ancestor "$PRIOR_RUNTIME_HEAD" HEAD
      - name: Checkout exact Technical Art rigid-scene donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.TECHNICAL_ART_HEAD }}
          path: .technical-art
          fetch-depth: 0

      - name: Checkout exact current lid target-Rigging receiver
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.LID_TARGET_RIG_HEAD }}
          path: .lid-target-rig


      - name: Checkout exact current front-latch target-Rigging receiver
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.LATCH_TARGET_RIG_HEAD }}
          path: .latch-target-rig


      - name: Checkout exact current source-Rigging authority
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.CURRENT_LATCH_SOURCE_RIG_HEAD }}
          path: .current-latch-source-rig


      - name: Checkout exact historical lid-motion Rigging donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.LID_RIG_HEAD }}
          path: .lid-rig

      - name: Verify current receiver identities
        run: |
          set -euo pipefail
          test "$(git -C .lid-target-rig rev-parse HEAD)" = "$LID_TARGET_RIG_HEAD"
          test "$(git -C .latch-target-rig rev-parse HEAD)" = "$LATCH_TARGET_RIG_HEAD"
          test "$(git -C .current-latch-source-rig rev-parse HEAD)" = "$CURRENT_LATCH_SOURCE_RIG_HEAD"
          test "$(git -C .lid-rig rev-parse HEAD)" = "$LID_RIG_HEAD"
          test "$(git -C .current-latch-source-rig rev-parse "HEAD:assets/modular-equipment-case-001/front-latch-source-rig-binding-003.json")" = "0331d30528f58d353fa9396d7ca129a020e8c6ce"
          test "$(git -C .lid-rig rev-parse "HEAD:assets/modular-equipment-case-001/articulation.json")" = "0e7f56ae96f17bb2a5b38852aac12fad6854a4d0"

      - name: Checkout exact UC rigid-scene donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: ${{ env.UC_RIGID_HEAD }}
          path: .uc-rigid
      - name: Checkout exact UC animation runtime donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: ${{ env.UC_RUNTIME_HEAD }}
          path: .uc-runtime
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned UC runtime module identity
        run: |
          set -euo pipefail
          test "$(git -C .uc-runtime rev-parse HEAD)" = "$UC_RUNTIME_HEAD"
          test "$(git -C .uc-runtime hash-object src/axm_uc/game_animation_runtime.py)" = "$UC_RUNTIME_MODULE_GIT_BLOB_SHA"
      - name: Run exact Object structural suite
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v
      - name: Rebuild exact Technical Art UC rigid-scene donor output
        run: |
          set -euo pipefail
          rm -rf .technical-art/rigid-proof/generated
          mkdir -p .technical-art/rigid-proof/generated
          (
            cd .technical-art
            PYTHONPATH=../.uc-rigid/src python tools/build_object_uc_rigid_scene_handoff.py \
              --uc-root ../.uc-rigid \
              --expected-uc-commit "$UC_RIGID_HEAD" \
              --out rigid-proof/generated
          )
          test "$(git -C .technical-art rev-parse HEAD)" = "$TECHNICAL_ART_HEAD"
          test "$(git -C .uc-rigid rev-parse HEAD)" = "$UC_RIGID_HEAD"
      - name: Build current target-Rigging receiver contracts
        run: |
          set -euo pipefail
          rm -rf /tmp/axm-current-target-rig
          mkdir -p /tmp/axm-current-target-rig
          python .lid-target-rig/tools/build_object_target_lid_rig_binding.py \
            --source assets/modular-equipment-case-001/source.json \
            --lid-rig-plan .lid-rig/assets/modular-equipment-case-001/articulation.json \
            --tech-receipt .technical-art/rigid-proof/generated/uc-rigid-scene-handoff-receipt.json \
            --rebound-glb .technical-art/rigid-proof/generated/object-rigid-components-rebound.glb \
            --out /tmp/axm-current-target-rig/target-lid-rig-binding.json
          python .latch-target-rig/tools/build_object_target_front_latch_rig_binding.py \
            --source-rig-binding .current-latch-source-rig/assets/modular-equipment-case-001/front-latch-source-rig-binding-003.json \
            --interface .current-latch-source-rig/assets/modular-equipment-case-001/front-latch-pivot-interface-001.json \
            --tech-receipt .technical-art/rigid-proof/generated/uc-rigid-scene-handoff-receipt.json \
            --rebound-glb .technical-art/rigid-proof/generated/object-rigid-components-rebound.glb \
            --observed-source-rig-head "$CURRENT_LATCH_SOURCE_RIG_HEAD" \
            --observed-tech-art-head "$TECHNICAL_ART_HEAD" \
            --observed-uc-head "$UC_RIGID_HEAD" \
            --out /tmp/axm-current-target-rig/target-front-latch-rig-binding.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('/tmp/axm-current-target-rig')
          lid=json.loads((root/'target-lid-rig-binding.json').read_text())
          latch=json.loads((root/'target-front-latch-rig-binding.json').read_text())
          glb=hashlib.sha256(Path('.technical-art/rigid-proof/generated/object-rigid-components-rebound.glb').read_bytes()).hexdigest()
          assert lid['result']=='PASS_EXACT_LID_RIG_TO_UC_TARGET_BINDING_READY',lid
          assert latch['result']=='PASS_SOURCE_OWNED_FRONT_LATCH_CAPTURE_ENVELOPE_TO_UC_TARGET_BINDING_READY',latch
          assert lid['technical_art_donor_head']==latch['technical_art_donor_head']==os.environ['TECHNICAL_ART_HEAD'],(lid,latch)
          assert lid['technical_art_historical_donor_head']==latch['technical_art_historical_donor_head']==os.environ['HISTORICAL_TECHNICAL_ART_HEAD'],(lid,latch)
          assert lid['technical_art_provenance_rebind']['historical_receipts_reused_as_current_evidence'] is False,lid
          assert latch['technical_art_provenance_rebind']['historical_receipts_reused_as_current_evidence'] is False,latch
          assert lid['technical_art_rebound_glb_sha256']==latch['technical_art_rebound_glb_sha256']==glb,(lid,latch,glb)
          assert lid['lid_rig_donor_head']==os.environ['LID_RIG_HEAD'],lid
          assert latch['source_rig_donor_head']==os.environ['CURRENT_LATCH_SOURCE_RIG_HEAD'],latch
          assert lid['target_x_rotation_sign']==1,lid
          assert latch['target_x_rotation_sign']==-1,latch
          assert latch['source_capture_transition_bracket_deg']==[9.25,9.30],latch
          assert latch['source_z_aabb_only_transition_bracket_deg']==[48.65,48.70],latch
          assert lid['truth_boundary']['final_visual_acceptance'] is False,lid
          assert latch['truth_boundary']['final_visual_acceptance'] is False,latch
          print('current target-Rigging receiver gate PASS')
          PY


      - name: Materialize exact lid and latch rig donors
        run: |
          set -euo pipefail
          rm -rf /tmp/axm-uc-runtime-bridge-donors /tmp/axm-latch-rig-evidence /tmp/axm-lid-motion /tmp/axm-lid-latch
          mkdir -p /tmp/axm-uc-runtime-bridge-donors/tools /tmp/axm-uc-runtime-bridge-donors/assets/modular-equipment-case-001
          curl -fsSL "https://raw.githubusercontent.com/mike-axiom-mir/axm-object-design/${LID_RIG_HEAD}/assets/modular-equipment-case-001/articulation.json" -o /tmp/axm-uc-runtime-bridge-donors/assets/modular-equipment-case-001/articulation.json
          ownership_base="https://raw.githubusercontent.com/mike-axiom-mir/axm-object-design/${LATCH_OWNERSHIP_HEAD}"
          rig_base="https://raw.githubusercontent.com/mike-axiom-mir/axm-object-design/${LATCH_RIG_HEAD}"
          curl -fsSL "$ownership_base/assets/modular-equipment-case-001/front-latch-ownership-001.json" -o /tmp/axm-uc-runtime-bridge-donors/assets/modular-equipment-case-001/front-latch-ownership-001.json
          curl -fsSL "$ownership_base/tools/verify_front_latch_ownership.py" -o /tmp/axm-uc-runtime-bridge-donors/tools/verify_front_latch_ownership.py
          curl -fsSL "$rig_base/assets/modular-equipment-case-001/front-latch-articulation-001.json" -o /tmp/axm-uc-runtime-bridge-donors/assets/modular-equipment-case-001/front-latch-articulation-001.json
          curl -fsSL "$rig_base/tools/verify_front_latch_articulation.py" -o /tmp/axm-uc-runtime-bridge-donors/tools/verify_front_latch_articulation.py
          echo "$LATCH_OWNERSHIP_SHA256  /tmp/axm-uc-runtime-bridge-donors/assets/modular-equipment-case-001/front-latch-ownership-001.json" | sha256sum -c -
          echo "$LATCH_RIG_PLAN_SHA256  /tmp/axm-uc-runtime-bridge-donors/assets/modular-equipment-case-001/front-latch-articulation-001.json" | sha256sum -c -
      - name: Rebuild exact authored lid and latch sequence
        run: |
          set -euo pipefail
          python tools/build_lid_motion_evidence.py \
            --source assets/modular-equipment-case-001/source.json \
            --rig /tmp/axm-uc-runtime-bridge-donors/assets/modular-equipment-case-001/articulation.json \
            --clip assets/modular-equipment-case-001/lid-motion-clip.json \
            --out /tmp/axm-lid-motion \
            --exact-head "$EXACT_HEAD_SHA"
          PYTHONPATH="$PWD/tools" python /tmp/axm-uc-runtime-bridge-donors/tools/verify_front_latch_articulation.py \
            --host assets/modular-equipment-case-001/source.json \
            --ownership /tmp/axm-uc-runtime-bridge-donors/assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --plan /tmp/axm-uc-runtime-bridge-donors/assets/modular-equipment-case-001/front-latch-articulation-001.json \
            --out /tmp/axm-latch-rig-evidence
          python tools/build_lid_latch_motion_evidence.py \
            --source assets/modular-equipment-case-001/source.json \
            --sequence assets/modular-equipment-case-001/lid-latch-motion-sequence-001.json \
            --motion-evidence /tmp/axm-lid-motion/lid-motion-evidence.json \
            --ownership /tmp/axm-uc-runtime-bridge-donors/assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --rig-receipt /tmp/axm-latch-rig-evidence/front-latch-articulation.receipt.json \
            --rig-head "$LATCH_RIG_HEAD" \
            --rig-plan-sha256 "$LATCH_RIG_PLAN_SHA256" \
            --out /tmp/axm-lid-latch \
            --exact-head "$EXACT_HEAD_SHA"
      - name: Assemble exact current-target bridge inputs
        run: |
          set -euo pipefail
          rm -rf animation-proof/generated
          mkdir -p animation-proof/generated
          cp .technical-art/rigid-proof/generated/object-rigid-components-rebound.glb animation-proof/generated/
          cp .technical-art/rigid-proof/generated/uc-rigid-scene-handoff-receipt.json animation-proof/generated/
          cp /tmp/axm-lid-latch/lid-latch-motion-evidence.json animation-proof/generated/
          cp /tmp/axm-latch-rig-evidence/front-latch-articulation.receipt.json animation-proof/generated/
          cp /tmp/axm-current-target-rig/target-lid-rig-binding.json animation-proof/generated/
          cp /tmp/axm-current-target-rig/target-front-latch-rig-binding.json animation-proof/generated/
          printf '%s\n' "$EXACT_HEAD_SHA" > animation-proof/generated/exact-receiving-head.txt
          printf '%s\n' "$TECHNICAL_ART_HEAD" > animation-proof/generated/exact-technical-art-head.txt
          printf '%s\n' "$HISTORICAL_TECHNICAL_ART_HEAD" > animation-proof/generated/historical-technical-art-head.txt
          printf '%s\n' "$LID_TARGET_RIG_HEAD" > animation-proof/generated/exact-lid-target-rig-head.txt
          printf '%s\n' "$LATCH_TARGET_RIG_HEAD" > animation-proof/generated/exact-latch-target-rig-head.txt
          printf '%s\n' "$CURRENT_LATCH_SOURCE_RIG_HEAD" > animation-proof/generated/exact-current-latch-source-rig-head.txt
          printf '%s\n' "$UC_RIGID_HEAD" > animation-proof/generated/exact-uc-head.txt

      - name: Build exact UC animation runtime clock handoff
        run: |
          set -euo pipefail
          python tools/build_uc_animation_runtime_bridge.py \
            --uc-root .uc-runtime \
            --expected-uc-commit "$UC_RUNTIME_HEAD" \
            --sequence-evidence animation-proof/generated/lid-latch-motion-evidence.json \
            --out animation-proof/generated/uc-animation-runtime-bridge.json \
            --exact-object-head "$EXACT_HEAD_SHA"
      - name: Validate exact current-target cross-repo identity before UC clock handoff
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('animation-proof/generated')
          t=json.loads((root/'uc-rigid-scene-handoff-receipt.json').read_text())
          s=json.loads((root/'lid-latch-motion-evidence.json').read_text())
          r=json.loads((root/'front-latch-articulation.receipt.json').read_text())
          lid_target=json.loads((root/'target-lid-rig-binding.json').read_text())
          latch_target=json.loads((root/'target-front-latch-rig-binding.json').read_text())
          glb_sha=hashlib.sha256((root/'object-rigid-components-rebound.glb').read_bytes()).hexdigest()
          assert t['result']=='PASS_OBJECT_SOURCE_OWNED_RIGID_PARTS_THROUGH_UC_SCENE_GRAPH',t
          assert t['source_repository_head']==os.environ['TECHNICAL_ART_HEAD'],t
          assert t['observed_uc_commit']==os.environ['UC_RIGID_HEAD'],t
          assert t['rebound_glb_sha256']==os.environ['TECHNICAL_ART_REBOUND_GLB_SHA256']==glb_sha,(t,glb_sha)
          assert s['result']=='PASS_ORDERED_LATCH_RELEASE_LID_CLIP_REENGAGE_SEQUENCE',s
          assert s['exact_receiving_head']==os.environ['EXACT_HEAD_SHA'],s
          assert s['host_source_sha256']==t['source_sha256'],(s,t)
          assert s['latch_rig_dependency_head']==os.environ['LATCH_RIG_HEAD'],s
          assert r['result']=='PASS_BOUNDED_FRONT_LATCH_LEVER_ARTICULATION',r
          assert r['host_source_sha256']==s['host_source_sha256'],(r,s)
          assert lid_target['result']=='PASS_EXACT_LID_RIG_TO_UC_TARGET_BINDING_READY',lid_target
          assert latch_target['result']=='PASS_SOURCE_OWNED_FRONT_LATCH_CAPTURE_ENVELOPE_TO_UC_TARGET_BINDING_READY',latch_target
          assert lid_target['technical_art_donor_head']==latch_target['technical_art_donor_head']==os.environ['TECHNICAL_ART_HEAD'],(lid_target,latch_target)
          assert latch_target['source_rig_donor_head']==os.environ['CURRENT_LATCH_SOURCE_RIG_HEAD'],latch_target
          assert (root/'exact-lid-target-rig-head.txt').read_text().strip()==os.environ['LID_TARGET_RIG_HEAD']
          assert (root/'exact-latch-target-rig-head.txt').read_text().strip()==os.environ['LATCH_TARGET_RIG_HEAD']
          assert (root/'exact-current-latch-source-rig-head.txt').read_text().strip()==os.environ['CURRENT_LATCH_SOURCE_RIG_HEAD']
          assert s['endpoint_inclusive_sample_count']==101 and s['sample_rate_hz']==40 and s['duration_s']==2.5,s
          print('cross-repo identity gate PASS')
          PY


      - name: Validate exact UC runtime bridge identity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('animation-proof/generated')
          s=json.loads((root/'lid-latch-motion-evidence.json').read_text())
          b=json.loads((root/'uc-animation-runtime-bridge.json').read_text())
          assert b['result']=='PASS_UC_RUNTIME_OBJECT_TARGET_CLOCK_BINDING',b
          assert b['exact_object_head']==os.environ['EXACT_HEAD_SHA'],b
          assert b['uc_runtime_commit']==os.environ['UC_RUNTIME_HEAD'],b
          assert b['uc_runtime_module_git_blob_sha']==os.environ['UC_RUNTIME_MODULE_GIT_BLOB_SHA'],b
          assert b['object_sequence_id']==s['sequence_id'] and b['object_sequence_digest']==s['sequence_digest'],(b,s)
          assert b['target_adapter_policy']=='SEEK_TARGET_ANIMATIONPLAYER_TO_UC_CLIP_TIME_NO_RETIME',b
          assert len(b['checkpoints'])==5,b
          assert b['completion']['automatic_operate_to_idle_transition'] is True,b
          assert b['truth_boundary']['target_engine_playback_observed_here'] is False,b
          print(json.dumps(b,indent=2))
          PY
      - name: Negative control rejects UC runtime donor drift
        run: |
          set -euo pipefail
          if python tools/build_uc_animation_runtime_bridge.py \
            --uc-root .uc-runtime \
            --expected-uc-commit 0000000000000000000000000000000000000000 \
            --sequence-evidence animation-proof/generated/lid-latch-motion-evidence.json \
            --out /tmp/should-not-exist.json \
            --exact-object-head "$EXACT_HEAD_SHA"; then
            echo 'ERROR: UC runtime donor drift was accepted' >&2
            exit 1
          fi
      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Observe UC runtime clip-time handoff through exact Godot AnimationPlayer target
        run: |
          set -euo pipefail
          rm -f animation-proof/uc-runtime-godot-bridge-receipt.json animation-proof/uc-runtime-bridge-*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path animation-proof \
            --script observe_uc_runtime_bridge.gd
      - name: Validate retained target-host bridge receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('animation-proof')
          r=json.loads((root/'uc-runtime-godot-bridge-receipt.json').read_text())
          assert r['state']=='PASS_UC_RUNTIME_CLOCK_TO_GODOT_ANIMATIONPLAYER_CHECKPOINTS',r
          assert r['technical_art_object_head']==os.environ['TECHNICAL_ART_HEAD'],r
          assert r['uc_rigid_scene_commit']==os.environ['UC_RIGID_HEAD'],r
          assert r['uc_runtime_commit']==os.environ['UC_RUNTIME_HEAD'],r
          assert r['uc_runtime_module_git_blob_sha']==os.environ['UC_RUNTIME_MODULE_GIT_BLOB_SHA'],r
          assert len(r['uc_runtime_module_sha256'])==64,r
          assert r['animation_sequence_head']==os.environ['EXACT_HEAD_SHA'],r
          assert r['technical_art_historical_head']==os.environ['HISTORICAL_TECHNICAL_ART_HEAD'],r
          assert r['lid_target_binding_result']=='PASS_EXACT_LID_RIG_TO_UC_TARGET_BINDING_READY',r
          assert r['front_latch_target_binding_result']=='PASS_SOURCE_OWNED_FRONT_LATCH_CAPTURE_ENVELOPE_TO_UC_TARGET_BINDING_READY',r
          assert r['current_latch_source_rig_head']==os.environ['CURRENT_LATCH_SOURCE_RIG_HEAD'],r
          assert r['checkpoint_count']==5,r
          assert r['target_adapter_policy']=='SEEK_TARGET_ANIMATIONPLAYER_TO_UC_CLIP_TIME_NO_RETIME',r
          assert r['max_lid_clock_handoff_residual_deg']<=1e-4,r
          assert r['max_latch_clock_handoff_residual_deg']<=1e-4,r
          assert r['neutral_pivot_wrapper_max_drift_m']<=1e-6,r
          assert r['ordering_violation_count']==0,r
          assert r['truth_boundary']['embedded_uc_python_runtime_inside_godot'] is False,r
          assert r['truth_boundary']['wall_clock_playback_pacing_observed'] is False,r
          assert r['truth_boundary']['runtime_controller_or_input'] is False,r
          assert len(r['captures'])==5,r
          for index in range(5):
              p=root/f'uc-runtime-bridge-{index:02d}.png'
              assert p.stat().st_size>3000,p
          print(json.dumps(r,indent=2))
          PY
      - name: Assemble exact Runtime resource-reuse proof inputs
        run: |
          set -euo pipefail
          rm -rf runtime-proof/generated evidence/object_exact_uc_glb_runtime_002
          mkdir -p runtime-proof/generated evidence/object_exact_uc_glb_runtime_002
          cp animation-proof/generated/object-rigid-components-rebound.glb runtime-proof/generated/
          cp animation-proof/generated/uc-rigid-scene-handoff-receipt.json runtime-proof/generated/
          cp animation-proof/generated/lid-latch-motion-evidence.json runtime-proof/generated/
          cp animation-proof/generated/front-latch-articulation.receipt.json runtime-proof/generated/
          cp animation-proof/generated/target-lid-rig-binding.json runtime-proof/generated/
          cp animation-proof/generated/target-front-latch-rig-binding.json runtime-proof/generated/
          cp runtime/object_exact_uc_glb_resource_reuse_contract_002.json runtime-proof/generated/runtime-contract.json
          printf '%s\n' "$EXACT_HEAD_SHA" > runtime-proof/generated/exact-runtime-head.txt
          printf '%s\n' "$PRIOR_RUNTIME_HEAD" > runtime-proof/generated/historical-runtime-head.txt
          printf '%s\n' "$TA_RUNTIME_BRIDGE_HEAD" > runtime-proof/generated/receiving-ta-bridge-head.txt

      - name: Observe exact UC GLB moving-resource reuse in Godot
        run: |
          set -euo pipefail
          rm -f runtime-proof/exact-uc-glb-resource-reuse-receipt.json runtime-proof/runtime-reuse-frame-*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path runtime-proof \
            --script exact_uc_glb_resource_reuse_observe.gd

      - name: Verify exact UC GLB Runtime resource-reuse receipt
        run: |
          set -euo pipefail
          python tools/verify_object_exact_uc_glb_resource_reuse.py \
            --contract runtime/object_exact_uc_glb_resource_reuse_contract_002.json \
            --receipt runtime-proof/exact-uc-glb-resource-reuse-receipt.json \
            --runtime-head "$EXACT_HEAD_SHA" \
            --out evidence/object_exact_uc_glb_runtime_002/verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('runtime-proof/exact-uc-glb-resource-reuse-receipt.json').read_text())
          assert r['state']=='PASS_EXACT_UC_GLB_MOVING_RESOURCE_IDENTITY_REUSE',r
          assert r['resource_identity_stable'] is True,r
          assert r['observed_resource_replacements']==0,r
          assert r['direct_transform_stress_updates']==2000,r
          assert r['moving_component_count']==7,r
          assert r['truth_boundary']['historical_99_95_percent_reduction_transferred_to_exact_uc_glb'] is False,r
          for index in [0,5,10,25,40,50,60,90,95,100]:
              p=Path('runtime-proof')/f'runtime-reuse-frame-{index:03d}.png'
              assert p.stat().st_size>3000,p
          print(json.dumps(r,indent=2))
          PY

      - name: Negative control rejects fabricated resource replacement
        run: |
          set -euo pipefail
          cp runtime-proof/exact-uc-glb-resource-reuse-receipt.json /tmp/runtime-negative.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/runtime-negative.json')
          d=json.loads(p.read_text())
          d['resource_identity_stable']=False
          d['observed_resource_replacements']=1
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          if python tools/verify_object_exact_uc_glb_resource_reuse.py \
            --contract runtime/object_exact_uc_glb_resource_reuse_contract_002.json \
            --receipt /tmp/runtime-negative.json \
            --runtime-head "$EXACT_HEAD_SHA" \
            --out /tmp/should-not-pass.json; then
            echo 'ERROR: Runtime verifier accepted fabricated resource replacement' >&2
            exit 1
          fi
          echo PASS_RESOURCE_REPLACEMENT_NEGATIVE_CONTROL > evidence/object_exact_uc_glb_runtime_002/negative-control.txt

      - name: Retain exact Runtime resource-reuse evidence
