name: Object rigging articulation evidence

on:
  pull_request:
  push:
    branches: [main]

jobs:
  articulation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q tests tools
      - name: Full repository tests
        run: python -m unittest discover -s tests -v
      - name: Build exact articulation evidence
        if: matrix.python-version == '3.11'
        run: python tools/build_case_articulation.py
      - name: Upload exact articulation evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: modular-equipment-case-001-articulation-evidence
          path: evidence/modular-equipment-case-001-articulation/
          if-no-files-found: error
