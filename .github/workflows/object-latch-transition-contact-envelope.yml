name: Object latch transition contact-envelope evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_INTERFACE_HEAD: 6086f39a3da344c57a68653f90d040e03e04cec2
  SOURCE_RIG_HEAD: a1acd2bcb2074f41e536562f2673508e2cb0a4d5
  MECHANICAL_POLICY_HEAD: 8a23c32ebc6b4e1188d2961c878d9dc365bb6da7
  MECHANICAL_POLICY_BLOB: c96437649bf5d5d7e7bf49a2206f6d6baeec5cd9
  PREVIOUS_MOVING_CLEARANCE_HEAD: 44e0a56872a823cf768c749672116fd026b1ef5e

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact receiving Rigging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run full Object regression suite
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

  transition-envelope:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact receiving Rigging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: object
          fetch-depth: 0

      - name: Bind exact receiving head and source Rigging ancestry
        working-directory: object
        run: |
          set -euo pipefail
          echo "EXACT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$SOURCE_INTERFACE_HEAD" HEAD
          git merge-base --is-ancestor "$SOURCE_RIG_HEAD" HEAD
          git merge-base --is-ancestor "$PREVIOUS_MOVING_CLEARANCE_HEAD" HEAD

      - name: Checkout exact Hard-Surface mechanical-state policy donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.MECHANICAL_POLICY_HEAD }}
          path: mechanical-policy-donor
          fetch-depth: 0

      - name: Verify exact policy head and blob
        working-directory: mechanical-policy-donor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MECHANICAL_POLICY_HEAD"
          test "$(git rev-parse HEAD:assets/modular-equipment-case-001/front-latch-mechanical-state-policy-001.json)" = "$MECHANICAL_POLICY_BLOB"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove continuous neutral-lid release/reengagement proof-volume envelope
        working-directory: object
        run: |
          set -euo pipefail
          rm -rf evidence/latch-transition-contact-envelope-001
          python tools/run_latch_transition_contact_envelope.py \
            --source assets/modular-equipment-case-001/source.json \
            --source-interface assets/modular-equipment-case-001/front-latch-pivot-interface-001.json \
            --source-rig-binding assets/modular-equipment-case-001/front-latch-source-rig-binding-002.json \
            --mechanical-state-policy ../mechanical-policy-donor/assets/modular-equipment-case-001/front-latch-mechanical-state-policy-001.json \
            --observed-source-interface-head "$SOURCE_INTERFACE_HEAD" \
            --observed-source-rig-head "$SOURCE_RIG_HEAD" \
            --observed-mechanical-policy-head "$MECHANICAL_POLICY_HEAD" \
            --observed-mechanical-policy-blob "$MECHANICAL_POLICY_BLOB" \
            --observed-previous-moving-clearance-head "$PREVIOUS_MOVING_CLEARANCE_HEAD" \
            --out evidence/latch-transition-contact-envelope-001
          printf '%s\n' "$EXACT_HEAD" > evidence/latch-transition-contact-envelope-001/exact-head.txt
          printf '%s\n' "$SOURCE_INTERFACE_HEAD" > evidence/latch-transition-contact-envelope-001/source-interface-head.txt
          printf '%s\n' "$SOURCE_RIG_HEAD" > evidence/latch-transition-contact-envelope-001/source-rig-head.txt
          printf '%s\n' "$MECHANICAL_POLICY_HEAD" > evidence/latch-transition-contact-envelope-001/mechanical-policy-head.txt
          printf '%s\n' "$MECHANICAL_POLICY_BLOB" > evidence/latch-transition-contact-envelope-001/mechanical-policy-blob.txt
          printf '%s\n' "$PREVIOUS_MOVING_CLEARANCE_HEAD" > evidence/latch-transition-contact-envelope-001/previous-moving-clearance-head.txt
          cp assets/modular-equipment-case-001/front-latch-pivot-interface-001.json evidence/latch-transition-contact-envelope-001/source-latch-interface.json
          cp assets/modular-equipment-case-001/front-latch-source-rig-binding-002.json evidence/latch-transition-contact-envelope-001/source-rig-binding.json
          cp ../mechanical-policy-donor/assets/modular-equipment-case-001/front-latch-mechanical-state-policy-001.json evidence/latch-transition-contact-envelope-001/mechanical-state-policy.json

      - name: Prove full-interval-clearance promotion fails closed
        working-directory: object
        run: |
          set -euo pipefail
          rm -rf /tmp/latch-transition-full-clearance-negative
          set +e
          python tools/run_latch_transition_contact_envelope.py \
            --source assets/modular-equipment-case-001/source.json \
            --source-interface assets/modular-equipment-case-001/front-latch-pivot-interface-001.json \
            --source-rig-binding assets/modular-equipment-case-001/front-latch-source-rig-binding-002.json \
            --mechanical-state-policy ../mechanical-policy-donor/assets/modular-equipment-case-001/front-latch-mechanical-state-policy-001.json \
            --observed-source-interface-head "$SOURCE_INTERFACE_HEAD" \
            --observed-source-rig-head "$SOURCE_RIG_HEAD" \
            --observed-mechanical-policy-head "$MECHANICAL_POLICY_HEAD" \
            --observed-mechanical-policy-blob "$MECHANICAL_POLICY_BLOB" \
            --observed-previous-moving-clearance-head "$PREVIOUS_MOVING_CLEARANCE_HEAD" \
            --assert-full-interval-clearance \
            --out /tmp/latch-transition-full-clearance-negative \
            > /tmp/latch-transition-full-clearance-negative.stdout 2> /tmp/latch-transition-full-clearance-negative.stderr
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'full-interval clearance negative control unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'FULL_INTERVAL_CLEARANCE_FALSE_INTENTIONAL_ENGAGEMENT_OVERLAP' /tmp/latch-transition-full-clearance-negative.stderr
          printf '%s\n' 'PASS_FAILS_CLOSED_ON_FALSE_FULL_INTERVAL_CLEARANCE_PROMOTION' > evidence/latch-transition-contact-envelope-001/negative-control.txt
          cp /tmp/latch-transition-full-clearance-negative.stderr evidence/latch-transition-contact-envelope-001/negative-control.stderr.txt

      - name: Assert truth boundary remains explicit
        working-directory: object
        run: |
          set -euo pipefail
          grep -q 'PASS_CONTINUOUS_NEUTRAL_LID_LATCH_PROOF_VOLUME_EXIT_REENTRY__INTENTIONAL_ENGAGEMENT_PRESERVED' evidence/latch-transition-contact-envelope-001/receipt.json
          grep -q '"continuous_full_release_clearance_proven": false' evidence/latch-transition-contact-envelope-001/receipt.json
          grep -q '"continuous_full_reengagement_clearance_proven": false' evidence/latch-transition-contact-envelope-001/receipt.json
          grep -q '"animation_timing_or_playback_accepted": false' evidence/latch-transition-contact-envelope-001/receipt.json
          grep -q '"runtime_controller_or_state_machine_accepted": false' evidence/latch-transition-contact-envelope-001/receipt.json
          grep -q 'PASS_FAILS_CLOSED_ON_FALSE_FULL_INTERVAL_CLEARANCE_PROMOTION' evidence/latch-transition-contact-envelope-001/negative-control.txt

      - name: Upload exact Rigging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-latch-transition-contact-envelope-${{ github.event.pull_request.head.sha || github.sha }}
          path: object/evidence/latch-transition-contact-envelope-001
          if-no-files-found: error
          retention-days: 30
