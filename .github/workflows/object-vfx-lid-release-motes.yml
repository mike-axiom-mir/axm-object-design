name: Object VFX phase-bound lid-release motes

on:
  pull_request:
    paths:
      - 'assets/modular-equipment-case-001/lid-open-release-motes-001.json'
      - 'animation-proof/observe_lid_release_motes.gd'
      - '.github/workflows/object-vfx-lid-release-motes.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANIMATION_PARENT_HEAD: 07130d3481d69b5a4d8a399e86bd207d623dc87c
  TECHNICAL_ART_HEAD: 965fb2f24dbd0b0cbb748d9f8b8712d62966315f
  UC_HEAD: 6dc465987e01362264f88b7cef4213609ae50763
  LID_RIG_HEAD: 4b72c9918c5fc1e89bd18a0be24fb4afac6e7775
  LATCH_RIG_HEAD: 3b667ff5d30c46ec2fe7da7679518970f8610018
  LATCH_OWNERSHIP_HEAD: d3fa10a270faae7925811f44f03381fe5c5d0215
  LATCH_RIG_PLAN_SHA256: 81c27ab7b73ed9a43cb3f554b56c3f4294b893712075e33d13f5b02e008455db
  LATCH_OWNERSHIP_SHA256: 0702e4180f858d29c42ff8c38a61eaa16278d6848c8ce6f3ecfae172969ca8ae

jobs:
  exact-target-host-reactive-vfx:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact VFX PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact VFX and Animation identities
        run: |
          set -euo pipefail
          echo "EXACT_VFX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$ANIMATION_PARENT_HEAD" HEAD
          test "$(git show "${ANIMATION_PARENT_HEAD}:assets/modular-equipment-case-001/lid-latch-motion-sequence-001.json" | sha256sum | cut -d' ' -f1)" = "$(sha256sum assets/modular-equipment-case-001/lid-latch-motion-sequence-001.json | cut -d' ' -f1)"
          test "$(git show "${ANIMATION_PARENT_HEAD}:assets/modular-equipment-case-001/source.json" | sha256sum | cut -d' ' -f1)" = "$(sha256sum assets/modular-equipment-case-001/source.json | cut -d' ' -f1)"

      - name: Set up Python 3.11 and run full Object suite
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Checkout exact Technical Art rigid-scene donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ${{ env.TECHNICAL_ART_HEAD }}
          path: .technical-art

      - name: Checkout exact UC rigid-scene donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: ${{ env.UC_HEAD }}
          path: .uc

      - name: Rebuild exact Technical Art UC rigid-scene donor output
        run: |
          set -euo pipefail
          rm -rf .technical-art/rigid-proof/generated
          mkdir -p .technical-art/rigid-proof/generated
          (
            cd .technical-art
            PYTHONPATH=../.uc/src python tools/build_object_uc_rigid_scene_handoff.py \
              --uc-root ../.uc \
              --expected-uc-commit "$UC_HEAD" \
              --out rigid-proof/generated
          )
          test "$(git -C .technical-art rev-parse HEAD)" = "$TECHNICAL_ART_HEAD"
          test "$(git -C .uc rev-parse HEAD)" = "$UC_HEAD"

      - name: Materialize exact lid and latch Rigging donors
        run: |
          set -euo pipefail
          rm -rf /tmp/axm-vfx-donors /tmp/axm-latch-rig-evidence /tmp/axm-lid-motion /tmp/axm-lid-latch
          mkdir -p /tmp/axm-vfx-donors/tools /tmp/axm-vfx-donors/assets/modular-equipment-case-001
          curl -fsSL \
            "https://raw.githubusercontent.com/mike-axiom-mir/axm-object-design/${LID_RIG_HEAD}/assets/modular-equipment-case-001/articulation.json" \
            -o /tmp/axm-vfx-donors/assets/modular-equipment-case-001/articulation.json
          ownership_base="https://raw.githubusercontent.com/mike-axiom-mir/axm-object-design/${LATCH_OWNERSHIP_HEAD}"
          rig_base="https://raw.githubusercontent.com/mike-axiom-mir/axm-object-design/${LATCH_RIG_HEAD}"
          curl -fsSL "$ownership_base/assets/modular-equipment-case-001/front-latch-ownership-001.json" -o /tmp/axm-vfx-donors/assets/modular-equipment-case-001/front-latch-ownership-001.json
          curl -fsSL "$ownership_base/tools/verify_front_latch_ownership.py" -o /tmp/axm-vfx-donors/tools/verify_front_latch_ownership.py
          curl -fsSL "$rig_base/assets/modular-equipment-case-001/front-latch-articulation-001.json" -o /tmp/axm-vfx-donors/assets/modular-equipment-case-001/front-latch-articulation-001.json
          curl -fsSL "$rig_base/tools/verify_front_latch_articulation.py" -o /tmp/axm-vfx-donors/tools/verify_front_latch_articulation.py
          echo "$LATCH_OWNERSHIP_SHA256  /tmp/axm-vfx-donors/assets/modular-equipment-case-001/front-latch-ownership-001.json" | sha256sum -c -
          echo "$LATCH_RIG_PLAN_SHA256  /tmp/axm-vfx-donors/assets/modular-equipment-case-001/front-latch-articulation-001.json" | sha256sum -c -

      - name: Rebuild exact frozen Animation parent sequence
        run: |
          set -euo pipefail
          python tools/build_lid_motion_evidence.py \
            --source assets/modular-equipment-case-001/source.json \
            --rig /tmp/axm-vfx-donors/assets/modular-equipment-case-001/articulation.json \
            --clip assets/modular-equipment-case-001/lid-motion-clip.json \
            --out /tmp/axm-lid-motion \
            --exact-head "$ANIMATION_PARENT_HEAD"
          PYTHONPATH="$PWD/tools" python /tmp/axm-vfx-donors/tools/verify_front_latch_articulation.py \
            --host assets/modular-equipment-case-001/source.json \
            --ownership /tmp/axm-vfx-donors/assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --plan /tmp/axm-vfx-donors/assets/modular-equipment-case-001/front-latch-articulation-001.json \
            --out /tmp/axm-latch-rig-evidence
          python tools/build_lid_latch_motion_evidence.py \
            --source assets/modular-equipment-case-001/source.json \
            --sequence assets/modular-equipment-case-001/lid-latch-motion-sequence-001.json \
            --motion-evidence /tmp/axm-lid-motion/lid-motion-evidence.json \
            --ownership /tmp/axm-vfx-donors/assets/modular-equipment-case-001/front-latch-ownership-001.json \
            --rig-receipt /tmp/axm-latch-rig-evidence/front-latch-articulation.receipt.json \
            --rig-head "$LATCH_RIG_HEAD" \
            --rig-plan-sha256 "$LATCH_RIG_PLAN_SHA256" \
            --out /tmp/axm-lid-latch \
            --exact-head "$ANIMATION_PARENT_HEAD"

      - name: Assemble exact VFX target-host proof inputs
        run: |
          set -euo pipefail
          rm -rf animation-proof/generated
          mkdir -p animation-proof/generated
          cp .technical-art/rigid-proof/generated/object-rigid-components-rebound.glb animation-proof/generated/
          cp .technical-art/rigid-proof/generated/uc-rigid-scene-handoff-receipt.json animation-proof/generated/
          cp /tmp/axm-lid-latch/lid-latch-motion-evidence.json animation-proof/generated/
          cp /tmp/axm-latch-rig-evidence/front-latch-articulation.receipt.json animation-proof/generated/
          cp assets/modular-equipment-case-001/lid-latch-motion-sequence-001.json animation-proof/generated/
          cp assets/modular-equipment-case-001/lid-open-release-motes-001.json animation-proof/generated/
          printf '%s\n' "$ANIMATION_PARENT_HEAD" > animation-proof/generated/exact-animation-parent.txt
          printf '%s\n' "$EXACT_VFX_HEAD" > animation-proof/generated/exact-vfx-head.txt
          printf '%s\n' "$TECHNICAL_ART_HEAD" > animation-proof/generated/exact-technical-art-head.txt
          printf '%s\n' "$UC_HEAD" > animation-proof/generated/exact-uc-head.txt

      - name: Validate exact source and phase binding before target host
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('animation-proof/generated')
          t=json.loads((root/'uc-rigid-scene-handoff-receipt.json').read_text())
          s=json.loads((root/'lid-latch-motion-evidence.json').read_text())
          seq=json.loads((root/'lid-latch-motion-sequence-001.json').read_text())
          fx=json.loads((root/'lid-open-release-motes-001.json').read_text())
          assert t['result']=='PASS_OBJECT_SOURCE_OWNED_RIGID_PARTS_THROUGH_UC_SCENE_GRAPH',t
          assert t['source_repository_head']==os.environ['TECHNICAL_ART_HEAD'],t
          assert t['observed_uc_commit']==os.environ['UC_HEAD'],t
          assert s['result']=='PASS_ORDERED_LATCH_RELEASE_LID_CLIP_REENGAGE_SEQUENCE',s
          assert s['exact_receiving_head']==os.environ['ANIMATION_PARENT_HEAD'],s
          assert s['host_source_sha256']==t['source_sha256'],(s,t)
          assert fx['source_sha256']==s['host_source_sha256'],(fx,s)
          dep=fx['animation_dependency']
          assert dep['base_head']==os.environ['ANIMATION_PARENT_HEAD'],dep
          assert dep['sequence_id']==seq['sequence_id']==s['sequence_id'],(dep,seq,s)
          phase={row['id']:row for row in seq['phases']}[dep['trigger_phase_id']]
          assert dep['trigger_time_s']==phase['start_s']==0.25,(dep,phase)
          assert dep['trigger_semantics']=='EXACT_ANIMATION_PHASE_BOUNDARY_NOT_GAMEPLAY_EVENT',dep
          assert fx['visual_source']['source_label']=='STYLIZED_VISUAL_RELEASE_MOTES_NOT_DUST_OR_FLUID_SIMULATION',fx
          print('exact VFX source/phase identity gate PASS')
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Exercise phase-bound VFX in exact Godot object receiver
        run: |
          set -euo pipefail
          rm -f animation-proof/vfx-lid-release-motes-receipt.json animation-proof/vfx-control-*.png animation-proof/vfx-candidate-*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path animation-proof \
            --script observe_lid_release_motes.gd

      - name: Validate retained VFX target-host receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('animation-proof')
          r=json.loads((root/'vfx-lid-release-motes-receipt.json').read_text())
          assert r['state']=='PASS_TARGET_HOST_PHASE_BOUND_LID_RELEASE_MOTES',r
          assert r['effect_head']==os.environ['EXACT_VFX_HEAD'],r
          assert r['animation_sequence_head']==os.environ['ANIMATION_PARENT_HEAD'],r
          assert r['trigger_time_s']==0.25 and r['trigger_phase_id']=='play_exact_lid_clip',r
          assert r['particle_count']==18,r
          assert r['negative_control_trigger_time_drift_rejected'] is True,r
          rows=r['observations']
          assert len(rows)==5,rows
          by_time={round(float(row['time_s']),2):row for row in rows}
          for t in (0.30,0.40,0.52):
              row=by_time[t]
              assert row['active_particle_count']>0,row
              assert row['diff']['changed_pixels']>=80,row
              assert row['diff']['changed_fraction']<=0.08,row
              assert row['control_sha256']!=row['candidate_sha256'],row
          for t in (0.20,0.80):
              row=by_time[t]
              assert row['active_particle_count']==0,row
              assert row['diff']['changed_pixels']==0,row
              assert row['control_sha256']==row['candidate_sha256'],row
          tb=r['truth_boundary']
          assert tb['analytic_visual_motes_rendered_in_real_godot'] is True,tb
          assert tb['animation_timing_or_easing_modified'] is False,tb
          assert tb['vfx_changes_object_animation_state'] is False,tb
          for key in ('production_particle_runtime','physical_dust_pressure_airflow_or_fluid_simulation','runtime_controller_or_gameplay_event','collision_damage_or_interaction','target_device_performance_acceptance','art_direction_acceptance','visual_qa_acceptance','canon_or_production_readiness'):
              assert tb[key] is False,(key,tb)
          for ms in (200,300,400,520,800):
              tag=f'{ms:04d}'
              assert (root/f'vfx-control-{tag}ms.png').stat().st_size>3000
              assert (root/f'vfx-candidate-{tag}ms.png').stat().st_size>3000
          print(json.dumps(r,indent=2))
          PY

      - name: Retain exact phase-bound VFX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-vfx-lid-release-motes-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            assets/modular-equipment-case-001/lid-open-release-motes-001.json
            animation-proof/generated/object-rigid-components-rebound.glb
            animation-proof/generated/uc-rigid-scene-handoff-receipt.json
            animation-proof/generated/lid-latch-motion-evidence.json
            animation-proof/generated/front-latch-articulation.receipt.json
            animation-proof/generated/lid-latch-motion-sequence-001.json
            animation-proof/generated/lid-open-release-motes-001.json
            animation-proof/generated/exact-animation-parent.txt
            animation-proof/generated/exact-vfx-head.txt
            animation-proof/generated/exact-technical-art-head.txt
            animation-proof/generated/exact-uc-head.txt
            animation-proof/vfx-lid-release-motes-receipt.json
            animation-proof/vfx-control-*.png
            animation-proof/vfx-candidate-*.png
          if-no-files-found: warn
          retention-days: 30
