name: Object source box-face UV source-frame rebind family evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  procedural:
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    env:
      AXM_STICKER_FABRIC_ROOT: _donor/axm-sticker-fabric
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout exact Sticker Fabric dependency for inherited Procedural tests
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-sticker-fabric
          ref: 3aa93b0132eea9becefb20c716c6ec1a023ad28b
          path: _donor/axm-sticker-fabric
      - name: Checkout exact Hard-Surface source-face authority donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: fcae744a8bdbcb765c32758e9da03fe54ffe4dbc
          path: _donor/object-hard-surface-face
      - name: Checkout exact Hard-Surface service-frame authority donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: 6a9593b942e7cda4befe8106bfb8cc260e3e6b5f
          path: _donor/object-hard-surface-frames
      - name: Checkout exact Materials UV-family donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: ad2378f18be55efa1f8e6dba9d8823c6b5d500e1
          path: _donor/object-materials
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall tools tests
      - name: Test full repository suite
        run: python -m unittest discover -s tests -v
      - name: Materialize exact review inputs for source-face prerequisite
        if: matrix.python-version == '3.11'
        run: |
          mkdir -p evidence/source-box-face-uv-source-frame-rebind/source-faces
          git fetch origin 8e92324648d837a92b7c3e0b1107df1f58f9aa61 --depth=1
          lid_blob="$(git rev-parse 8e92324648d837a92b7c3e0b1107df1f58f9aa61:lookdev/inner_lid_surface_review_001.json)"
          test "$lid_blob" = "cc90cd2c4c0f8eaf6b93d190436bc278c0fa1c83"
          git show 8e92324648d837a92b7c3e0b1107df1f58f9aa61:lookdev/inner_lid_surface_review_001.json > /tmp/inner_lid_surface_review_001.json
          git fetch origin 04c521a5a7e31bef54093c818108fd6c2080ca0e --depth=1
          panel_blob="$(git rev-parse 04c521a5a7e31bef54093c818108fd6c2080ca0e:lookdev/front_service_panel_uv_review_001.json)"
          test "$panel_blob" = "c473d20a466b97ea2e7d513a4efe78533245de77"
          git show 04c521a5a7e31bef54093c818108fd6c2080ca0e:lookdev/front_service_panel_uv_review_001.json > /tmp/front_service_panel_uv_review_001.json
      - name: Rebuild exact source-owned face prerequisite
        if: matrix.python-version == '3.11'
        run: |
          python tools/build_source_box_face_extraction_family.py \
            --family assets/modular-equipment-case-001/source-box-face-extraction-family-001.json \
            --hard-surface-root _donor/object-hard-surface-face \
            --review lid_inner_service_surface=/tmp/inner_lid_surface_review_001.json \
            --review front_service_panel_outer_service_surface=/tmp/front_service_panel_uv_review_001.json \
            --out evidence/source-box-face-uv-source-frame-rebind/source-faces
      - name: Rebuild exact previous Procedural UV family
        if: matrix.python-version == '3.11'
        run: |
          mkdir -p evidence/source-box-face-uv-source-frame-rebind/previous-uv-family
          python tools/build_source_box_face_uv_projection_family.py \
            --family assets/modular-equipment-case-001/source-box-face-uv-projection-family-001.json \
            --materials-root _donor/object-materials \
            --face-root evidence/source-box-face-uv-source-frame-rebind/source-faces \
            --out evidence/source-box-face-uv-source-frame-rebind/previous-uv-family
      - name: Build source-frame rebound UV family
        if: matrix.python-version == '3.11'
        run: |
          mkdir -p evidence/source-box-face-uv-source-frame-rebind/rebound-family
          python tools/build_source_box_face_uv_source_frame_rebind_family.py \
            --family assets/modular-equipment-case-001/source-box-face-uv-source-frame-rebind-family-001.json \
            --materials-root _donor/object-materials \
            --face-root evidence/source-box-face-uv-source-frame-rebind/source-faces \
            --hard-surface-frame-root _donor/object-hard-surface-frames \
            --previous-summary evidence/source-box-face-uv-source-frame-rebind/previous-uv-family/summary.json \
            --out evidence/source-box-face-uv-source-frame-rebind/rebound-family
          cp assets/modular-equipment-case-001/source-box-face-uv-source-frame-rebind-family-001.json evidence/source-box-face-uv-source-frame-rebind/family-profile.json
          cp assets/modular-equipment-case-001/source-box-face-uv-projection-family-001.json evidence/source-box-face-uv-source-frame-rebind/previous-uv-family-profile.json
          cp _donor/object-hard-surface-frames/assets/modular-equipment-case-001/service-surface-reference-frames-001.json evidence/source-box-face-uv-source-frame-rebind/hard-surface-service-frames.json
          git rev-parse HEAD > evidence/source-box-face-uv-source-frame-rebind/exact-head.txt
          git -C _donor/object-hard-surface-frames rev-parse HEAD > evidence/source-box-face-uv-source-frame-rebind/hard-surface-frame-head.txt
          git -C _donor/object-materials rev-parse HEAD > evidence/source-box-face-uv-source-frame-rebind/materials-head.txt
      - name: Assert source-frame authority, variation pressure, exact continuity and failure bounds
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('evidence/source-box-face-uv-source-frame-rebind/rebound-family/summary.json').read_text())
          assert summary['result'] == 'PASS_BOUNDED_SOURCE_BOX_FACE_UV_SOURCE_FRAME_REBIND_FAMILY'
          assert summary['decision'] == 'PASS_SOURCE_FRAME_REBOUND_REVIEW_UV_FAMILY_ONLY__NO_SOURCE_UV_OR_MATERIALS_ADOPTION'
          assert summary['surface_count'] == 2
          assert summary['variant_output_count'] == 4
          assert summary['exact_previous_output_match_count'] == 4
          assert summary['distinct_source_frame_count'] == 2
          assert summary['distinct_basis_plane_count'] == 2
          assert summary['distinct_uv_output_count'] == 4
          assert len(summary['negative_controls']) == 6
          assert all(row['result'] == 'HOLD_INVALID_SOURCE_BOX_FACE_UV_SOURCE_FRAME_REBIND_FAMILY' for row in summary['negative_controls'])
          assert all(row['exact_previous_output_match'] for row in summary['outputs'])
          assert {row['basis'] for row in summary['outputs']} == {
              'SOURCE_LOCAL_X_TO_U__SOURCE_LOCAL_Y_TO_V',
              'SOURCE_LOCAL_X_TO_U__SOURCE_LOCAL_Z_TO_V',
          }
          candidates = [row for row in summary['outputs'] if row['variant_id'] == 'materials_candidate_isotropic']
          controls = [row for row in summary['outputs'] if row['variant_id'] != 'materials_candidate_isotropic']
          assert len(candidates) == 2 and len(controls) == 2
          assert all(abs(row['density_anisotropy'] - 1.0) < 1e-12 for row in candidates)
          assert all(abs(row['density_anisotropy'] - 3.0) < 1e-12 for row in controls)
          assert summary['truth_boundary']['source_uv_authored'] is False
          assert summary['truth_boundary']['production_uv_adopted'] is False
          assert summary['truth_boundary']['axis_guessing_from_geometry'] is False
          assert summary['truth_boundary']['hard_surface_reference_frame_authority_rewritten'] is False
          assert summary['truth_boundary']['materials_uv_authority_rewritten'] is False
          print('PASS_OBJECT_SOURCE_BOX_FACE_UV_SOURCE_FRAME_REBIND_FAMILY')
          PY
      - name: Upload retained evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: object-source-box-face-uv-source-frame-rebind-family-001-evidence
          path: evidence/source-box-face-uv-source-frame-rebind
          if-no-files-found: error
          retention-days: 30
