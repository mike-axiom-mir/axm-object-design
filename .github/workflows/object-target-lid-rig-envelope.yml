name: Object target lid rig envelope evidence

on:
  pull_request:
    paths:
      - "tools/build_object_target_lid_rig_binding.py"
      - "rig-envelope-proof/**"
      - ".github/workflows/object-target-lid-rig-envelope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-lid-rig-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact Rigging PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout exact Technical Art rigid-scene donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: 965fb2f24dbd0b0cbb748d9f8b8712d62966315f
          path: .tech-art

      - name: Checkout exact lid Rigging donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: 4b72c9918c5fc1e89bd18a0be24fb4afac6e7775
          path: .lid-rig

      - name: Checkout exact Universal Creation rigid-scene donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: 6dc465987e01362264f88b7cef4213609ae50763
          path: .uc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and run current Object tests
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Re-run exact source lid Rigging donor
        run: |
          cd .lid-rig
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            python tools/build_case_articulation.py
            python tools/continuous_lid_clearance.py \
              --source assets/modular-equipment-case-001/source.json \
              --plan assets/modular-equipment-case-001/articulation.json \
              --out evidence/modular-equipment-case-001-articulation/continuous-shell-clearance.certificate.json
          fi

      - name: Rebuild exact Technical Art target hierarchy
        run: |
          cd .tech-art
          rm -rf rigid-proof/generated
          mkdir -p rigid-proof/generated
          PYTHONPATH=../.uc/src python tools/build_object_uc_rigid_scene_handoff.py \
            --uc-root ../.uc \
            --expected-uc-commit 6dc465987e01362264f88b7cef4213609ae50763 \
            --out rigid-proof/generated

      - name: Build exact Rigging target binding
        run: |
          rm -rf rig-envelope-proof/generated
          mkdir -p rig-envelope-proof/generated
          python tools/build_object_target_lid_rig_binding.py \
            --source assets/modular-equipment-case-001/source.json \
            --lid-rig-plan .lid-rig/assets/modular-equipment-case-001/articulation.json \
            --tech-receipt .tech-art/rigid-proof/generated/uc-rigid-scene-handoff-receipt.json \
            --rebound-glb .tech-art/rigid-proof/generated/object-rigid-components-rebound.glb \
            --out rig-envelope-proof/generated/target-lid-rig-binding.json
          cp .tech-art/rigid-proof/generated/object-rigid-components-rebound.glb rig-envelope-proof/generated/
          git rev-parse HEAD > rig-envelope-proof/generated/exact-rigging-head.txt
          git -C .tech-art rev-parse HEAD > rig-envelope-proof/generated/exact-technical-art-head.txt
          git -C .lid-rig rev-parse HEAD > rig-envelope-proof/generated/exact-lid-rig-head.txt
          git -C .uc rev-parse HEAD > rig-envelope-proof/generated/exact-uc-head.txt

      - name: Validate exact binding identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('rig-envelope-proof/generated')
          b=json.loads((root/'target-lid-rig-binding.json').read_text())
          assert b['result']=='PASS_EXACT_LID_RIG_TO_UC_TARGET_BINDING_READY',b
          assert b['source_sha256']=='49b1f9ed9865893d6de6f1ec8f069576732df694853fde4e3fcff366de32644a',b
          assert b['technical_art_donor_head']==(root/'exact-technical-art-head.txt').read_text().strip()=='965fb2f24dbd0b0cbb748d9f8b8712d62966315f',b
          assert b['lid_rig_donor_head']==(root/'exact-lid-rig-head.txt').read_text().strip()=='4b72c9918c5fc1e89bd18a0be24fb4afac6e7775',b
          assert b['uc_donor_head']==(root/'exact-uc-head.txt').read_text().strip()=='6dc465987e01362264f88b7cef4213609ae50763',b
          assert b['lid_rig_plan_sha256']=='0ad6dc2ca22676cf301579932e599a441eb7c4bccce31991d1b727aeb22ac422',b
          assert b['source_opening_rotation_sign']==-1,b
          assert b['target_x_rotation_sign']==1,b
          assert b['representative_source_angles_deg']==[0.0,30.0,60.0,90.0,110.0],b
          assert b['representative_target_angles_deg']==[0.0,30.0,60.0,90.0,110.0],b
          assert b['hinge_pivot_source_m']==[0.0,0.252,0.306],b
          assert b['hinge_pivot_target_m']==[0.0,0.306,0.252],b
          assert b['truth_boundary']['animation_timing_or_clip_acceptance'] is False,b
          assert b['truth_boundary']['runtime_controller_or_state_machine_acceptance'] is False,b
          print(json.dumps(b,indent=2))
          PY

      - name: Download pinned Godot 4.7.2
        if: matrix.python-version == '3.11'
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        if: matrix.python-version == '3.11'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Exercise exact lid rig envelope on real imported hierarchy
        if: matrix.python-version == '3.11'
        run: |
          rm -f rig-envelope-proof/target-lid-rig-receipt.json rig-envelope-proof/rig-pose-*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path rig-envelope-proof \
            --script observe.gd

      - name: Validate target-host rig receipt
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('rig-envelope-proof')
          b=json.loads((root/'generated/target-lid-rig-binding.json').read_text())
          r=json.loads((root/'target-lid-rig-receipt.json').read_text())
          assert r['state']=='PASS_EXACT_LID_RIG_ENVELOPE_ON_UC_TARGET_HIERARCHY',r
          assert r['glb_sha256']==b['technical_art_rebound_glb_sha256'],(b,r)
          assert r['technical_art_donor_head']==b['technical_art_donor_head'],r
          assert r['lid_rig_donor_head']==b['lid_rig_donor_head'],r
          assert r['lid_rig_plan_sha256']==b['lid_rig_plan_sha256'],r
          assert len(r['representative_poses'])==5,r
          assert [p['source_angle_deg'] for p in r['representative_poses']]==[0.0,30.0,60.0,90.0,110.0],r
          assert r['max_angle_readback_error_deg']<=0.0001,r
          assert r['max_hinge_origin_drift_m']<=0.000001,r
          assert r['max_rigid_component_pairwise_distance_drift_m']<=0.000001,r
          assert r['max_lid_child_local_transform_drift']<=0.000001,r
          assert r['max_fixed_component_center_drift_m']<=0.000001,r
          assert r['neutral_return_max_center_drift_m']<=0.000001,r
          assert r['neutral_return_changed_pixels']<=100,r
          for angle in ['30.0','60.0','90.0','110.0']:
              assert r['changed_pixels_by_source_pose'][angle]>=1500,(angle,r)
          assert r['truth_boundary']['continuous_target_host_collision_clearance'] is False,r
          assert r['truth_boundary']['animation_timing_clip_or_animation_player_acceptance'] is False,r
          assert r['truth_boundary']['runtime_controller_state_machine_or_performance_acceptance'] is False,r
          for name in ['rig-pose-000.png','rig-pose-030.png','rig-pose-060.png','rig-pose-090.png','rig-pose-110.png','rig-pose-return-000.png']:
              assert (root/name).stat().st_size>3000,name
          print(json.dumps(r,indent=2))
          PY

      - name: Retain exact Rigging target-envelope evidence
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: object-target-lid-rig-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            assets/modular-equipment-case-001/source.json
            .lid-rig/assets/modular-equipment-case-001/articulation.json
            .lid-rig/evidence/modular-equipment-case-001-articulation/**
            .tech-art/rigid-proof/generated/uc-rigid-scene-handoff-receipt.json
            rig-envelope-proof/generated/object-rigid-components-rebound.glb
            rig-envelope-proof/generated/target-lid-rig-binding.json
            rig-envelope-proof/generated/exact-rigging-head.txt
            rig-envelope-proof/generated/exact-technical-art-head.txt
            rig-envelope-proof/generated/exact-lid-rig-head.txt
            rig-envelope-proof/generated/exact-uc-head.txt
            rig-envelope-proof/target-lid-rig-receipt.json
            rig-envelope-proof/rig-pose-000.png
            rig-envelope-proof/rig-pose-030.png
            rig-envelope-proof/rig-pose-060.png
            rig-envelope-proof/rig-pose-090.png
            rig-envelope-proof/rig-pose-110.png
            rig-envelope-proof/rig-pose-return-000.png
          if-no-files-found: warn
          retention-days: 30
