name: Object hinge-knuckle owner partition family

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  procedural:
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    env:
      AXM_HINGE_OWNER_DONOR_ROOT: _donor/object-hard-surface-hinge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout exact Hard Surface hinge owner
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: 172dd9ff5ed1fee3a21cd460c607f07ee0da7520
          path: _donor/object-hard-surface-hinge
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall tools tests
      - name: Test complete Object suite
        run: python -m unittest discover -s tests -v
      - name: Build exact bounded owner partition family
        if: matrix.python-version == '3.11'
        run: |
          python tools/build_hinge_knuckle_owner_partition_family.py \
            --contract assets/modular-equipment-case-001/hinge-knuckle-owner-partition-family-001.json \
            --donor-root _donor/object-hard-surface-hinge \
            --out evidence/hinge-knuckle-owner-partition-family
          git rev-parse HEAD > evidence/hinge-knuckle-owner-partition-family/exact-head.txt
          git -C _donor/object-hard-surface-hinge rev-parse HEAD > evidence/hinge-knuckle-owner-partition-family/hard-surface-owner-head.txt
      - name: Truth gate three materially different partitions
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('evidence/hinge-knuckle-owner-partition-family')
          summary = json.loads((root / 'summary.json').read_text())
          assert summary['result'] == 'PASS_BOUNDED_HINGE_KNUCKLE_OWNER_PARTITION_FAMILY'
          assert summary['decision'] == 'PASS_DERIVED_OWNER_PARTITIONS_ONLY__NO_SOURCE_RIG_OR_DOWNSTREAM_ADOPTION'
          assert summary['hard_surface_owner_head'] == '172dd9ff5ed1fee3a21cd460c607f07ee0da7520'
          assert summary['source_owner_sequence'] == ['body', 'lid', 'body', 'lid', 'body']
          rows = {row['id']: row for row in summary['variants']}
          assert set(rows) == {'full', 'body-only', 'lid-only'}
          assert (rows['full']['knuckles'], rows['full']['vertices'], rows['full']['triangles']) == (5, 240, 480)
          assert (rows['body-only']['knuckles'], rows['body-only']['vertices'], rows['body-only']['triangles']) == (3, 144, 288)
          assert (rows['lid-only']['knuckles'], rows['lid-only']['vertices'], rows['lid-only']['triangles']) == (2, 96, 192)
          assert rows['full']['knuckle_ids'] == ['b0', 'l0', 'b1', 'l1', 'b2']
          assert rows['body-only']['knuckle_ids'] == ['b0', 'b1', 'b2']
          assert rows['lid-only']['knuckle_ids'] == ['l0', 'l1']
          assert summary['materially_distinct_mesh_count'] == 3
          assert summary['request_order_canonicalization'] == 'PASS_BODY_LID_EQUALS_LID_BODY'
          assert summary['negative_control_count'] == 7
          assert summary['source_geometry_changed'] is False
          assert summary['annular_candidate_adopted'] is False
          assert summary['rig_parenting_authorized'] is False
          assert summary['automatic_downstream_adoption'] is False
          assert len({row['mesh_digest'] for row in rows.values()}) == 3
          print('PASS_OBJECT_HINGE_KNUCKLE_OWNER_PARTITION_FAMILY_TRUTH_GATE')
          PY
      - name: Upload retained evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: object-hinge-knuckle-owner-partition-family-001-evidence
          path: evidence/hinge-knuckle-owner-partition-family
          if-no-files-found: error
          retention-days: 30
