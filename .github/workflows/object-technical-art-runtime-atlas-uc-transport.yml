name: Object Technical Art runtime-atlas UC transport

on:
  push:
    branches: [studio/technical-art-service-dark-uc-texture-transport-001]
    paths:
      - "tools/build_object_service_dark_runtime_atlas_uc_transport.py"
      - "tools/prove_object_service_dark_uc_godot_front_views.py"
      - ".github/workflows/object-technical-art-runtime-atlas-uc-transport.yml"
      - "lookdev/**"
      - "lookdev-proof/**"
  pull_request:
    paths:
      - "tools/build_object_service_dark_runtime_atlas_uc_transport.py"
      - "tools/prove_object_service_dark_uc_godot_front_views.py"
      - ".github/workflows/object-technical-art-runtime-atlas-uc-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MATERIALS_HEAD: 4c12a0a57f6aa8778cff41efad321e13567c6c91
  RUNTIME_HEAD: ce23d5edeb0766201cfbaff646dda31544cd8f9c
  RUNTIME_CONTRACT_BLOB: 839d82d46e551b9f7331aea32a86e39d960c8621
  UC_BASE_HEAD: 7f62cda0dd65139366c26bb4e643ed99481f7181
  UC_HEAD: c8f38b4c3dd0d6183d035147e4816cff6fa6ef82

jobs:
  exact-runtime-atlas-uc-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Technical Art head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout exact UC rectangular-bundle receiver
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: c8f38b4c3dd0d6183d035147e4816cff6fa6ef82
          path: _donor/axm-universal-creation
          fetch-depth: 0

      - name: Checkout exact pre-repair UC negative control
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: 7f62cda0dd65139366c26bb4e643ed99481f7181
          path: _donor/axm-universal-creation-before
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind exact cross-repo identities and materialize Runtime donor
        run: |
          set -euo pipefail
          mkdir -p technical-art-proof/runtime-donor runtime-proof/generated lookdev-proof/generated
          git rev-parse HEAD > technical-art-proof/exact-technical-art-head.txt
          test "$(git -C _donor/axm-universal-creation rev-parse HEAD)" = "$UC_HEAD"
          test "$(git -C _donor/axm-universal-creation-before rev-parse HEAD)" = "$UC_BASE_HEAD"
          git merge-base --is-ancestor "$MATERIALS_HEAD" HEAD
          git fetch --no-tags origin "$RUNTIME_HEAD" --depth=1
          git cat-file -e "$RUNTIME_HEAD^{commit}"
          test "$(git rev-parse "$RUNTIME_HEAD:runtime/service_dark_atlas_height_budget_001.json")" = "$RUNTIME_CONTRACT_BLOB"
          git show "$RUNTIME_HEAD:runtime/service_dark_atlas_height_budget_001.json" > technical-art-proof/runtime-donor/service_dark_atlas_height_budget_001.json
          git show "$RUNTIME_HEAD:tools/build_object_service_dark_runtime_atlas_budget_evidence.py" > technical-art-proof/runtime-donor/build_runtime_budget.py
          printf '%s\n' "$RUNTIME_HEAD" > technical-art-proof/exact-runtime-head.txt
          printf '%s\n' "$UC_HEAD" > technical-art-proof/exact-uc-head.txt
          printf '%s\n' "$UC_BASE_HEAD" > technical-art-proof/exact-uc-base-head.txt

      - name: Rebuild exact Runtime candidate contract evidence
        run: |
          python technical-art-proof/runtime-donor/build_runtime_budget.py \
            --materials lookdev/service_dark_atlas_pack_review_001.json \
            --runtime technical-art-proof/runtime-donor/service_dark_atlas_height_budget_001.json \
            --out runtime-proof/generated \
            --exact-head "$RUNTIME_HEAD"

      - name: Rebuild exact Materials base payload
        run: python tools/build_object_material_lookdev_evidence.py

      - name: Materialize exact Animation, Rigging and latch-ownership donors
        env:
          ANIMATION_COMMIT: 12a350fc38f67348f342cd0e53ed6b16383b789d
          RIG_COMMIT: 4b72c9918c5fc1e89bd18a0be24fb4afac6e7775
          LATCH_OWNERSHIP_COMMIT: d3fa10a270faae7925811f44f03381fe5c5d0215
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            studio/animation-object-lid-open-close-001 \
            studio/rigging-object-lid-articulation-001 \
            studio/hard-surface-front-latch-ownership-001
          git cat-file -e "$ANIMATION_COMMIT^{commit}"
          git cat-file -e "$RIG_COMMIT^{commit}"
          git cat-file -e "$LATCH_OWNERSHIP_COMMIT^{commit}"
          git show "$ANIMATION_COMMIT:assets/modular-equipment-case-001/lid-motion-clip.json" > lookdev-proof/generated/lid-motion-clip.json
          git show "$RIG_COMMIT:assets/modular-equipment-case-001/articulation.json" > lookdev-proof/generated/articulation.json
          git show "$LATCH_OWNERSHIP_COMMIT:assets/modular-equipment-case-001/front-latch-ownership-001.json" > lookdev-proof/generated/front-latch-ownership-001.json

      - name: Rebuild exact owner-bound Materials chain
        run: |
          python tools/build_object_material_articulation_evidence.py
          git fetch --no-tags origin e67353416209604aa50ad3ba57f71336f4384349 --depth=1
          test "$(git rev-parse e67353416209604aa50ad3ba57f71336f4384349:assets/modular-equipment-case-001/lid-inner-surface-identity-001.json)" = "873c03a73042213255c65df63cdff49edcf10a6c"
          git show e67353416209604aa50ad3ba57f71336f4384349:assets/modular-equipment-case-001/lid-inner-surface-identity-001.json > lookdev-proof/generated/lid-inner-surface-identity-001.json
          python tools/build_object_inner_lid_material_evidence.py \
            --source-surface-identity lookdev-proof/generated/lid-inner-surface-identity-001.json
          python tools/build_object_service_dark_uv_density_family_evidence.py \
            --exact-head "$(git rev-parse HEAD)"
          python tools/build_object_service_dark_atlas_pack_evidence.py \
            --exact-head "$(git rev-parse HEAD)"

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Reproduce exact Materials padded source atlas
        run: |
          set -euo pipefail
          rm -f lookdev-proof/service-dark-atlas-pack-runtime-receipt.json lookdev-proof/service-dark-atlas-*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path lookdev-proof \
            --script service_dark_atlas_pack_observe.gd

      - name: Prove exact Runtime 512x384 candidate through repaired UC bundle receiver
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/_donor/axm-universal-creation/src" \
            python tools/build_object_service_dark_runtime_atlas_uc_transport.py \
              --uc-root _donor/axm-universal-creation \
              --runtime-contract technical-art-proof/runtime-donor/service_dark_atlas_height_budget_001.json \
              --runtime-build-receipt runtime-proof/generated/service_dark_atlas_height_budget_build_receipt.json \
              --expected-materials-head "$MATERIALS_HEAD" \
              --expected-runtime-head "$RUNTIME_HEAD" \
              --expected-uc-base-head "$UC_BASE_HEAD" \
              --expected-uc-head "$UC_HEAD" \
              --out creations/technical-art-proof/runtime-candidate \
              > technical-art-proof/runtime-candidate.log 2>&1
          cat technical-art-proof/runtime-candidate.log

      - name: Prove pre-repair UC rejects the exact rectangular bundle
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/_donor/axm-universal-creation-before/src" \
            python - <<'PY' > technical-art-proof/pre-repair-rejection.log 2>&1
          from axm_uc.game_material_bridge import load_material_bundle
          load_material_bundle('creations/technical-art-proof/runtime-candidate/service-dark-runtime-uc-bundle')
          PY
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "invalid material size" technical-art-proof/pre-repair-rejection.log
          echo "PASS_PRE_REPAIR_UC_REJECTED_EXACT_RECTANGULAR_BUNDLE" | tee -a technical-art-proof/pre-repair-rejection.log

      - name: Prove ambiguous rectangular manifest fails closed in repaired UC
        run: |
          set -euo pipefail
          cp -R creations/technical-art-proof/runtime-candidate/service-dark-runtime-uc-bundle technical-art-proof/ambiguous-bundle
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('technical-art-proof/ambiguous-bundle/game-material.json')
          m=json.loads(p.read_text())
          m['size']=512
          p.write_text(json.dumps(m))
          PY
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/_donor/axm-universal-creation/src" \
            python - <<'PY' > technical-art-proof/ambiguous-manifest-rejection.log 2>&1
          from axm_uc.game_material_bridge import load_material_bundle
          load_material_bundle('technical-art-proof/ambiguous-bundle')
          PY
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "exactly one of size or dimensions" technical-art-proof/ambiguous-manifest-rejection.log
          echo "PASS_REJECTED_AMBIGUOUS_SIZE_AND_DIMENSIONS" | tee -a technical-art-proof/ambiguous-manifest-rejection.log

      - name: Prove real Godot target from source-front evidence views
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1000x760x24" \
            env AXM_GODOT="$GITHUB_WORKSPACE/.godot-bin/Godot_v4.7.2-stable_linux.x86_64" \
            PYTHONPATH="$GITHUB_WORKSPACE/_donor/axm-universal-creation/src" \
            python tools/prove_object_service_dark_uc_godot_front_views.py \
              --uc-root _donor/axm-universal-creation \
              --expected-uc-head "$UC_HEAD" \
              --transport-dir creations/technical-art-proof/runtime-candidate \
              --transport-receipt-name technical-art-runtime-atlas-uc-transport-receipt.json \
              --glb-name service-dark-runtime-two-surface.glb \
              --expected-transport-result PASS_OBJECT_SERVICE_DARK_RUNTIME_512X384_TO_UC_RECTANGULAR_BUNDLE_TEXTURED_GLB \
              --final-result PASS_OBJECT_SERVICE_DARK_RUNTIME_512X384_TO_UC_RECTANGULAR_BUNDLE_TEXTURED_GLB_TO_GODOT_FRONT_VIEWS \
              --uc-product-modified \
              --out creations/technical-art-proof/runtime-candidate-godot \
              > technical-art-proof/runtime-candidate-godot.log 2>&1
          cat technical-art-proof/runtime-candidate-godot.log

      - name: Validate exact final truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          transport=json.loads(Path('creations/technical-art-proof/runtime-candidate/technical-art-runtime-atlas-uc-transport-receipt.json').read_text())
          target=json.loads(Path('creations/technical-art-proof/runtime-candidate-godot/technical-art-uc-godot-front-view-receipt.json').read_text())
          assert transport['result']=='PASS_OBJECT_SERVICE_DARK_RUNTIME_512X384_TO_UC_RECTANGULAR_BUNDLE_TEXTURED_GLB',transport
          assert transport['receiving_dimensions_px']==[512,384],transport
          assert transport['maximum_required_padded_extent_px']==[422,382],transport
          assert transport['candidate_spare_extent_px']==[90,2],transport
          assert transport['runtime_authority_head']=='ce23d5edeb0766201cfbaff646dda31544cd8f9c',transport
          assert transport['uc_head']=='c8f38b4c3dd0d6183d035147e4816cff6fa6ef82',transport
          assert transport['truth_boundary']['uc_product_modified'] is True,transport
          assert transport['truth_boundary']['runtime_candidate_production_adopted'] is False,transport
          assert transport['truth_boundary']['final_art_direction_accepted'] is False,transport
          assert transport['truth_boundary']['final_visual_qa_accepted'] is False,transport
          assert transport['rgb_crop']['max_rgb_channel_delta_inside_retained_rows']==0,transport
          assert target['result']=='PASS_OBJECT_SERVICE_DARK_RUNTIME_512X384_TO_UC_RECTANGULAR_BUNDLE_TEXTURED_GLB_TO_GODOT_FRONT_VIEWS',target
          assert target['uc_product_modified'] is True,target
          assert target['godot_status']=='PASS' and target['godot_observation_status']=='PASS',target
          assert len(target['godot_images'])==2 and all(row['visible_pixels']>0 for row in target['godot_images']),target
          print(json.dumps({'transport':transport,'target':target},indent=2))
          PY

      - name: Retain exact cross-repo candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-service-dark-runtime-atlas-uc-transport-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            technical-art-proof/exact-technical-art-head.txt
            technical-art-proof/exact-runtime-head.txt
            technical-art-proof/exact-uc-head.txt
            technical-art-proof/exact-uc-base-head.txt
            technical-art-proof/runtime-donor/**
            runtime-proof/generated/**
            technical-art-proof/runtime-candidate.log
            technical-art-proof/pre-repair-rejection.log
            technical-art-proof/ambiguous-manifest-rejection.log
            technical-art-proof/runtime-candidate-godot.log
            creations/technical-art-proof/runtime-candidate/**
            creations/technical-art-proof/runtime-candidate-godot/**
            lookdev/service_dark_atlas_pack_review_001.json
            lookdev/service_dark_uv_density_family_001.json
            lookdev-proof/generated/object_service_dark_atlas_pack_payload.json
            lookdev-proof/generated/service_dark_atlas_pack_build_receipt.json
            lookdev-proof/service-dark-atlas-pack-runtime-receipt.json
            lookdev-proof/service-dark-atlas-padded.png
          if-no-files-found: warn
          retention-days: 30
